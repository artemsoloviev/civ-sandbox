  const perHolm=new Map();
  while(n<Math.round(12*SZ*SZ) && tries<Math.round(24000*SZ*SZ)){ tries++;
    const x=(trnd()-0.5)*(SIZE-6), z=(trnd()-0.5)*(SIZE-6);
    if(biomeAt(x,z)!==B_HILLS) continue;
    const hi=HOLMS6.findIndex(H=>Math.hypot(x-H.x,z-H.z)<H.r+1.5);
    if(hi<0) continue;
    const got=perHolm.get(hi)||0;                          // 24.08-1: ОДНА группа-выход на холм (плита = тройная глыба, 2–3 плиты издали читались кучей)
    if(got>=1) continue;
    if(seaAt(x,z)>0.03) continue;

    let near=false; for(const [sx,sz] of STARTS_RAW){ if(Math.hypot(x-sx,z-sz)<10){ near=true; break; } }
    if(near) continue;

  const _slabNoise=(geo)=>{ const p=geo.attributes.position;

    for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i);

// ===== ВИЗУАЛ-ЛАБ (B. «трава пучками») =====
// Пучки травы на лугах: ОДИН InstancedMesh на все пучки (железное правило проекта — как деревья).
// Геометрия — две скрещённые плашки с процедурной текстурой пучка (прозрачность отсекается
// alphaTest, сортировка не нужна). Каждому пучку — свой размер/поворот, а ЦВЕТ берётся из
// нарисованной земли под ним (baseIm): на тёплом пятне пучок тёплый, на сухом — жёлтый,
// поэтому трава «врастает» в живописную раскраску, а не лежит поверх. Ветер — покачивание
// верхних вершин в шейдере (низ прибит к земле).
const labGrassUniforms={uTime:{value:0}};
{
  // Свой генератор случайных чисел (Mulberry32): у trnd() выше умножение выходит за точность
  // double и последовательность ЗАЦИКЛИВАЕТСЯ (~42 тыс. значений) — на 1,2 млн вызовов травы
  // это давало тысячи пучков в одних и тех же точках (один жирный клок вместо ковра).
  let gseed=987654321;
  const grnd=()=>{ gseed|=0; gseed=(gseed+0x6D2B79F5)|0; let t=Math.imul(gseed^(gseed>>>15),1|gseed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };

  // никаких картинок с прозрачностью — чистая геометрия, как трава в Zelda/Ghost of Tsushima.
  // Травинка = изогнутый клин из 3 треугольников (5 вершин): широкое ТЁМНОЕ основание, светлый
  // острый кончик, середина вынесена по изгибу. Пучок = веер из 7-8 травинок, торчащих вверх
  // и наружу. Вершинные цвета (низ тёмный → верх светлый) × оттенок земли (instanceColor) —
  // пучок «врастает» в раскраску луга, как раньше. Цена: 21-24 треуг./пучок (было 12 у плашек).
  const mkTuftGeo=()=>{
    const parts=[];
    const NB=7+(grnd()*2|0);
    for(let b=0;b<NB;b++){
      const ang=(b+grnd()*0.7)*(Math.PI*2/NB);          // веер по кругу с дрожью
      const h=0.28+grnd()*0.22;                         // высота травинки
      const w=0.045+grnd()*0.03;                        // полуширина основания
      const lean=0.04+grnd()*0.12;                      // вынос кончика вбок: почти вертикально (при 0.12-0.38 пучок растопыривался «агавой»)
      const bx=(grnd()-0.5)*0.18, bz=(grnd()-0.5)*0.18; // корень чуть в стороне от центра пучка
      const dx=Math.cos(ang), dz=Math.sin(ang);         // направление наклона
      const px=-dz, pz=dx;                              // поперечник (ширина клина)
      const midH=h*0.55, midLean=lean*0.42, tipJ=(grnd()-0.5)*0.08;
      const pos=[
        bx-px*w,                0,    bz-pz*w,
        bx+px*w,                0,    bz+pz*w,
        bx-px*w*0.5+dx*midLean, midH, bz-pz*w*0.5+dz*midLean,
        bx+px*w*0.5+dx*midLean, midH, bz+pz*w*0.5+dz*midLean,
        bx+dx*(lean+tipJ),      h,    bz+dz*(lean+tipJ),
      ];
      const g=new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
      g.setIndex([0,1,3, 0,3,2, 2,3,4]);
      // вершинные цвета: тёмное основание → светлый кончик, у каждой травинки свой сдвиг тона
      const c0=new THREE.Color().setHSL(0.27+(grnd()-0.5)*0.020, 0.46, 0.19+grnd()*0.04);
      const c1=new THREE.Color().setHSL(0.25+(grnd()-0.5)*0.030, 0.55, 0.33+grnd()*0.07);   // светлее не делать: кончики L>0.42 белели «кактусом» под тон-мэппингом
      const cm=c0.clone().lerp(c1,0.55);

  // зуме видеокарта не красит десятки тысяч дальних пучков.
  const patchWindFade=(m)=>{
    m.onBeforeCompile=(sh)=>{

      sh.vertexShader=sh.vertexShader
        .replace('#include <begin_vertex>',
`#include <begin_vertex>
{
  vec4 wp = instanceMatrix * vec4(0.0,0.0,0.0,1.0);
  float df = 1.0 - smoothstep(34.0, 56.0, distance(cameraPosition, wp.xyz));
  transformed *= df;
  float ph = wp.x*0.35 + wp.z*0.41;
  float sw = sin(uTime*1.6+ph)*0.5 + sin(uTime*0.53+ph*1.7)*0.5;
  transformed.x += sw * 0.10 * position.y * df;

// (масштаб 0) в его InstancedMesh; убранное дерево уже не восстанавливается (как и раньше).
function removeTreesNear(x,z,r){
  const touched=new Set(), zeroM=new THREE.Matrix4().makeScale(0,0,0);
  const c0x=Math.floor((x-r)/TG_CELL), c1x=Math.floor((x+r)/TG_CELL),
        c0z=Math.floor((z-r)/TG_CELL), c1z=Math.floor((z+r)/TG_CELL);
  for(let cx=c0x;cx<=c1x;cx++)for(let cz=c0z;cz<=c1z;cz++){
    const a=TREE_GRID.get(cx+'|'+cz); if(!a) continue;
    for(const t of a){
      if(t.removed || Math.hypot(t.x-x,t.z-z)>=r) continue;
      t.removed=true;
      for(const p of t.parts){ p.im.setMatrixAt(p.idx, zeroM); touched.add(p.im); }
    }
  }
  for(const im of touched) im.instanceMatrix.needsUpdate=true;
}

        el.innerHTML = unk ? `<span class="vn" style="opacity:.6">дымки вдали${eta>0?` · ${GI('eye',11)} в пути (${eta} х.)`:''}</span>`   // 04.09: имя и население — только после разведки
                           : `${mark}${vn}${GI('people',11)} <b>${fmtPop(popOf(lm.size))}</b>`;
      }
      el.style.pointerEvents='auto';         // 26.08-4: плашка кликабельна у ВСЕХ, и у нашей столицы тоже (просьба: открывать панель и по плашке)
      el.onclick=(ev)=>{ ev.stopPropagation();
        const cur=LM[i]; if(!cur) return;   // деревню берём В МОМЕНТ клика: захваченный lm мог устареть, если мир пересоздан (ловушка 2026-07-15)
        // на этапе «выбери столицу» клик по плашке = клик по самой деревне (просьба 2026-07-15)
        if(pickingCapital && !cur.aiCapital && !cur.aiOwned){ if(window.__capital&&window.__capital.propose) window.__capital.propose(cur); return; }
        if(window.__selUnit && window.__selUnit()){              // 05.09: выбран юнит → клик по плашке = ПРИКАЗ идти туда, панель молчит
          window.__unitOrderTo(hexOfWorld(cur.x,cur.z)); return; }
        if(cur.aiCapital) openForeign(i);
        else if(cur.capital){ if(window.__openCity) window.__openCity(); }   // 26.08-4: плашка столицы открывает панель города
        else openVillage(i); };
    }
    // 21.08-14 (вердикт «размывается вдалеке, а подписи всех пятисот деревень остаются»):
    // плашки ДЕРЕВЕНЬ тают с расстоянием вместе с дымкой мира; столицы — маяки, видны всегда
    if(!isCap){
      const ddx=camera.position.x-lm.x, ddy=camera.position.y-lm.y, ddz=camera.position.z-lm.z;
      const d=Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz);
      if(d>125){ if(el.style.display!=='none') el.style.display='none'; continue; }
      el.style.opacity = d>90 ? (1-(d-90)/35).toFixed(2) : '';
    } else if(el.style.opacity!=='') el.style.opacity='';
    // высота плашки: чуть выше конька — деревня +1.9, столица +2.6 (плашка крупнее)
    _lp.set(lm.x, lm.y+(isCap?2.6:1.9), lm.z); _lp.project(camera);
    if(_lp.z>1){ if(el.style.display!=='none') el.style.display='none'; continue; }   // за спиной камеры — скрыть
    if(el.style.display!=='block') el.style.display='block';
    const px=((_lp.x*0.5+0.5)*innerWidth).toFixed(1), py=((-_lp.y*0.5+0.5)*innerHeight).toFixed(1);
    el.style.transform=`translate(${px}px,${py}px) translate(-50%,-100%)`;
  }
  for(const [i,rec] of labelEls){ if(i>=LM.length){ rec.el.remove(); labelEls.delete(i);} }  // сброс мира
}

// ===== карточка деревни: что случилось за последний ход (2026-07-09) =====
// Подсказки при наведении НЕТ — имя и население и так висят над деревней (замечание пользователя).
let vilPanel=null, vilIdx=-1;
function ensureVilPanel(){
  if(!vilPanel){

function openVillage(i){
  if(window.__unitDesel) window.__unitDesel();                 // 05.09: панель открылась — выбор юнита снят (не дублируемся)
  const lm=LM[i]; if(!lm || lm.capital || lm.aiCapital) return;
  if(window.__closeCity) window.__closeCity();   // 26.08-4: панель города закрываем — окошки не накладываются
  ensureVilPanel();
  vilIdx=i; renderVillage();
  vilPanel.classList.add('on');
}
function closeVillage(){ if(vilPanel) vilPanel.classList.remove('on'); vilIdx=-1; }
// карточка ЧУЖОЙ ДЕРЖАВЫ (столица соперника). Переговоров пока нет — их место в GAME-VISION §12.
function openForeign(i){
  const lm=LM[i]; if(!lm||!lm.aiCapital) return;
  if(window.__closeCity) window.__closeCity();   // 26.08-4: и тут — только одно окошко
  ensureVilPanel();
  const L=leaderById(AI.leaderId), C=COUNTRIES[AI.countryId], c=aiCss();
  vilPanel.innerHTML=`<div class="x">✕</div>
    <h4 style="color:${c}">${C.flag} ${lm.name} <span style="opacity:.5;font-weight:400;font-size:12.5px">— столица ${C.gen}</span></h4>
    <div class="rr">${GI('crown',15)}<span class="k">правитель</span><span class="v" style="color:${c}">${L.name}</span></div>
    <div class="rr">${GI('people',15)}<span class="k">жителей</span><span class="v">${fmtPop(popOf(lm.size))}</span></div>
    <div class="rr">${GI('trend',15)}<span class="k">прирост за ход</span><span class="v ${(lm._growLast||0)>=0?'plus':'minus'}">${(lm._growLast||0)>=0?'+':''}${lm._growLast||0}</span></div>
    <div class="rr up">${GI('fort',15)}<span class="k">присоединено деревень</span><span class="v">${AI.taken}</span></div>
    <div class="cap">Соперник растёт сам и подбирает ничейные деревни вокруг. Переговоры, дань и союз —
      следующий слой (GAME-VISION §12). Пока за деревни идёт молчаливая гонка: чья зона дотянется первой.</div>`;
  vilPanel.querySelector('.x').onclick=closeVillage;
  vilIdx=-1; vilPanel.classList.add('on');
}
function renderVillage(){
  if(!vilPanel || vilIdx<0 || vilIdx>=LM.length) return;
  const lm=LM[vilIdx]; if(!lm || lm.capital || lm.aiCapital){ closeVillage(); return; }
  // 04.09 (§13): дальняя деревня НЕ разведана — карточка закрыта, пока не дошёл разведчик
  if(window.__unitsInit) window.__unitsInit();   // разметка «разведано» появляется вместе со столицей
  if(window.__scoutingOn && !lm.scouted && !lm.aiOwned && !['prot','trib','ours'].includes(lm.rel||'')){
    vilPanel.innerHTML=`<div class="x">✕</div>
      <h4>Незнакомая деревня</h4>
      <div class="cap" style="margin-top:4px">В столице о ней знают понаслышке: дымки за лесом, чужие тропы.
        Пошли <b>разведчика</b> (панель города → Обзор) — он разузнает имя, нрав и достаток,
        и тогда можно будет говорить о дарах и дани.</div>`;
    vilPanel.querySelector('.x').onclick=closeVillage;
    return;
  }
  const b=lm._births||0, d=lm._deaths||0, o=lm._out||0, net=lm._growLast||0;   // 25.08-1: до первого хода показываем 0, не undefined
  const stage=STAGES[stageIdxH(lm)];
  const first = (b||d||o) ? '' : `<div class="cap">Ход ещё не считался — числа появятся после «Конца хода».</div>`;
  // 25.08-1 (этап 1 «сбора земель»): воля + действия (дар/защита/дань/в державу)
  const w=Math.round(ensureWill(lm)), cap=LM.find(l=>l.capital);
  const wcol=w<=20?'#7fd18a':w<=40?'#a9d17f':w<=60?'#ffd98a':w<=80?'#f0a56a':'#e08b8b';
  const relLine = (lm.rel==='prot'?`<div class="cap" style="margin:0 0 6px;color:#9cc4ff">🛡 под нашей защитой</div>`
    : lm.rel==='trib'?`<div class="cap" style="margin:0 0 6px;color:#ffd98a">💰 платит нам дань</div>`
    : lm.rel==='ours'?`<div class="cap" style="margin:0 0 6px;color:${playerCss()}">⚑ земля нашей державы</div>`:'')
    + (lm.palisade?`<div class="cap" style="margin:0 0 6px;color:#c9a86a">🪵 обнесена частоколом</div>`:'');
  let act='';
  if(!lm.aiOwned && lm.rel!=='ours' && cap){
    const giftCd=(lm._giftTurn!=null)&&(turn-lm._giftTurn<4);
    const goods=window.__goodsTotal?window.__goodsTotal():0;
    if(lm.rel==='trib') act+=`
      <div class="rr up"><span class="k">размер дани</span><span class="v">${lm.tribRate}%</span></div>
      <input type="range" min="5" max="30" step="5" value="${lm.tribRate}" data-a="rate">
      <div class="cap" style="margin-top:2px">≈ +${tribOf(lm)} еды/ход в амбар. Больше 15% — копится обида (воля растёт), 10% и меньше — воля тает.</div>`;
    act+=`<div class="brow">
      <button data-a="gift" ${giftCd||goods<6?'disabled':''} title="${giftCd?'дары приелись — подожди пару ходов':goods<6?'нужно 6 товаров на складе':'−6 товаров со склада, воля −10'}">🎁 Поднести дар</button>
      ${lm.rel!=='prot'?`<button data-a="prot" ${canProtect(lm,cap)?'':'disabled'} title="деревня должна быть близко и заметно меньше столицы">🛡 Под защиту</button>`:''}
      ${lm.rel!=='trib'?`<button data-a="trib" ${w<=50?'':'disabled'} title="${w<=50?'деревня согласится платить':'откроется при воле ≤ 50'}">💰 Потребовать дань</button>`:''}
      ${w<=20?`<button data-a="annex" style="background:#3f7d4f">⚑ Принять в державу</button>`:''}
    </div>`;
  }
  // 04.09 (§13): частокол — своим и подопечным деревням, после озарения «Частокол»
  if(!lm.aiOwned && ['prot','trib','ours'].includes(lm.rel||'') && window.__sci&&window.__sci.done&&window.__sci.done.palisade && !lm.palisade){
    const wd=window.__wood?window.__wood.n():0;
    act+=`<div class="brow"><button data-a="pal" ${wd>=20?'':'disabled'} title="${wd>=20?'обнести деревню оградой из брёвен — налётчику +2 хода на грабёж':'нужно 20 древесины на складе'}">🪵 Поставить частокол (−20 · есть ${wd})</button></div>`;
  }
  vilPanel.innerHTML=`<div class="x">✕</div><div class="q" title="как это было в настоящей истории">?</div>
    <h4>${lm.name||'деревня'} <span style="opacity:.5;font-weight:400;font-size:12.5px">— ${stage}</span></h4>
    ${lm.aiOwned?`<div class="cap" style="margin:0 0 8px;color:${aiCss()}">под рукой ${COUNTRIES[AI.countryId].gen} — ${leaderById(AI.leaderId).name}</div>`:''}
    ${relLine}
    ${lm.rel==='ours'?`<div class="cap" style="margin:0 0 8px">жители трудятся на державу: <b>+${Math.round(popOf(lm.size)*0.5)}</b> рабочих рук · округа открыта под промыслы (осмотр — в панели города, вкладка «Промыслы») · науки и казна — общие</div>`:''}
    ${!lm.aiOwned&&lm.rel!=='ours'?`<div class="rr"><span class="k">воля — ${willWord(w)}</span><span class="v" style="color:${wcol}">${w}</span></div>
    <div class="wb"><i style="width:${w}%;background:${wcol}"></i></div>`:''}
    <div class="rr up">${GI('people',15)}<span class="k">жителей</span><span class="v">${fmtPop(popOf(lm.size))}</span></div>
    <div class="rr up">${GI('trend',15)}<span class="k">родилось за ход</span><span class="v plus">+${b}</span></div>
    <div class="rr">${GI('people',15)}<span class="k">умерло за ход</span><span class="v minus">−${d}</span></div>
    <div class="rr">${GI('people',15)}<span class="k">ушло в город</span><span class="v out">${o?('−'+o):'0'}</span></div>
    ${o&&lm._outTo?`<div class="cap" style="margin-top:6px">ушли в <b style="color:${playerCss()}">${lm._outTo}</b></div>`:''}
    <div class="rr up">${GI('trend',15)}<span class="k">итог за ход</span><span class="v ${net>=0?'plus':'minus'}">${net>=0?'+':''}${net}</span></div>

  vilPanel.querySelector('.x').onclick=closeVillage;
  vilPanel.querySelector('.q').onclick=()=>openEdu(lm.rel==='trib'?'dan':'sbor');
  vilPanel.querySelectorAll('[data-a]').forEach(el=>{
    const a=el.dataset.a;
    if(a==='rate'){ el.oninput=()=>{ lm.tribRate=+el.value; renderVillage(); }; return; }
    el.onclick=()=>{ const nm=lm.name||'деревня';
      if(a==='gift') doGift(vilIdx);
      else if(a==='prot'){ window.__evt({ icon:'🛡', title:`Взять «${nm}» под защиту?`,   // 05.09: подтверждение вместо мгновенного действия
        html:`Мы обязуемся оборонять «${nm}» от налётчиков — набег на неё станет ударом и по нашему имени (и подтолкнёт наши науки обороны). Взамен деревня проникнется доверием: воля заметно упадёт и с каждым ходом под крылом будет таять дальше — со временем деревня сама попросится в державу.`,
        buttons:[{t:'Взять под защиту',cb:()=>doProtect(vilIdx)},{t:'Отмена',cls:'no'}] }); }
      else if(a==='trib') doTribute(vilIdx);
      else if(a==='annex'){ window.__evt({ icon:'⚑', title:`Принять «${nm}» в державу?`,
        html:`«${nm}» готова присягнуть. Её жители вольются в рабочие руки державы, округа откроется под наши промыслы, а граница расцветёт нашим цветом. Науки и казна у державы общие. Дани с неё больше не будет — свои не платят.`,
        buttons:[{t:'Принять',cb:()=>doAnnex(vilIdx)},{t:'Отмена',cls:'no'}] }); }
      else if(a==='pal'){ if(window.__wood&&window.__wood.take(20)){ lm.palisade=true;
        if(window.__glog)window.__glog(`🪵 «${lm.name||'Деревня'}» обнесена частоколом`); renderVillage(); } } };
  });
}

// ===== 25.08-1: ЭТАП 1 «СБОРА ЗЕМЕЛЬ» (GAME-VISION §12+§13) — воля, дар, патронат, дань =====
// Воля 0..100: чем ниже, тем ближе деревня к державе (≤20 — готова войти). Дальние — упрямее.
function ensureWill(lm){
  if(lm.will==null){
    const cap=LM.find(l=>l.capital);
    const dist=cap?Math.hypot(lm.x-cap.x,lm.z-cap.z):40;
    const jit=Math.abs(Math.sin(lm.x*12.9898+lm.z*78.233))*18;     // детерминированный «характер» деревни
    lm.will=Math.round(Math.min(92, Math.max(35, 36+dist*0.5+jit)));
    if(lm.tribRate==null) lm.tribRate=10;
  }
  return lm.will;
}
const willWord=w=> w<=20?'готовы войти в державу':w<=40?'дружелюбны':w<=60?'насторожены':w<=80?'держатся особняком':'враждебны';
function canProtect(lm,cap){ return !!cap && lm.rel!=='prot' && Math.hypot(lm.x-cap.x,lm.z-cap.z)<=38
  && popOf(lm.size)<popOf(cap.size)*0.75; }
function tribOf(lm){ return Math.max(1, Math.round(popOf(lm.size)*lm.tribRate/100*0.15)); }
function doGift(i){ const lm=LM[i]; if(!lm) return;
  if(!(window.__takeGoods&&window.__takeGoods(6))){ if(window.__glog) window.__glog('Для дара нужно 6 товаров на складе'); return; }
  lm._giftTurn=turn; lm.will=Math.max(0, ensureWill(lm)-10);
  if(window.__glog) window.__glog(`🎁 Дар принят — «${lm.name||'деревня'}» стала дружелюбнее`);
  renderVillage();
}
function doProtect(i){ const lm=LM[i], cap=LM.find(l=>l.capital); if(!lm||!canProtect(lm,cap)) return;
  // 05.09 (баланс-дыра «защита → мгновенная аннексия»): защита опускает волю не ниже 25 —
  // дальше −0.8/ход «привыкают», в державу деревня созревает ходов за 7–10, а не вторым кликом.
  const w0=ensureWill(lm); lm.rel='prot'; lm.will=Math.min(w0, Math.max(25, w0-30));
  if(window.__glog) window.__glog(`🛡 «${lm.name||'Деревня'}» встала под нашу защиту (мы обязаны её оборонять)`);
  if(window.__evt) window.__evt({ icon:'🛡', title:`«${lm.name||'Деревня'}» под защитой`,
    html:`Старейшины приняли покровительство: отныне мы обязаны оборонять деревню, и налётчиков сюда потянет реже. Воля упала до <b>${Math.round(lm.will)}</b> и будет таять с каждым ходом — когда дойдёт до 20, деревня будет готова войти в державу.` });
  renderVillage();
}
function doTribute(i){ const lm=LM[i]; if(!lm||ensureWill(lm)>50) return;
  lm.rel='trib'; lm.tribRate=lm.tribRate||10;
  if(window.__glog) window.__glog(`💰 «${lm.name||'Деревня'}» согласилась платить дань`);
  if(window.__evt) window.__evt({ icon:'💰', title:`«${lm.name||'Деревня'}» платит дань`,
    html:`Деревня согласилась отсыпать еду в наш амбар (~<b>+${tribOf(lm)} еды/ход</b>; без амбара половина сгниёт в ямах). Ставку двигай ползунком в её карточке: больше 15% — копится обида и зреет бунт, 10% и меньше — воля тает и деревня привыкает к державе.` });
  renderVillage();
}
function doAnnex(i){ const lm=LM[i]; if(!lm||ensureWill(lm)>20) return;
  lm.rel='ours';
  if(window.__glog) window.__glog(`⚑ «${lm.name||'Деревня'}» вошла в державу!`);
  // 05.09: вступление даёт настоящую отдачу — руки, земли под промыслы, границу (см. laborPool/reveal/drawZoneOf)
  if(window.__evt) window.__evt({ icon:'⚑', title:`«${lm.name||'Деревня'}» — в державе!`,
    html:`Деревня присягнула. Что это даёт: её жители (<b>${fmtPop(popOf(lm.size))}</b>) добавили державе <b>+${Math.round(popOf(lm.size)*0.5)}</b> рабочих рук; округа деревни открыта под промыслы — вели новый <b>осмотр земель</b> (панель города → Промыслы → осмотр), и советник разметит угодья; граница державы теперь охватывает её земли. Науки и казна — общие на всю державу.` });
  if(typeof refreshPanels==='function') refreshPanels();   // граница и панели — сразу, не дожидаясь конца хода
  renderVillage();
}
// каждый ход: дрейф воли, сбор дани (в амбар столицы; без амбара половина гниёт), бунты за жадность
function processWill(){
  const cap=LM.find(l=>l.capital); if(!cap){ window.__tribFood=0; return; }
  let tf=0;
  LM.forEach(lm=>{
    if(lm.capital||lm.aiCapital||lm.aiOwned) return;
    ensureWill(lm);
    if(lm.rel==='trib'){
      tf+=tribOf(lm);
      lm.will+= lm.tribRate>15 ? (lm.tribRate-15)*0.35 : (lm.tribRate<=10 ? -0.6 : -0.2);
      if(lm.will>=80){                                             // бунт за жадность (Игорь и древляне, 945)
        lm.rel=null; lm.will=62;
        if(window.__glog) window.__glog(`🔥 «${lm.name||'Деревня'}» взбунтовалась — дань потеряна! Соседи насторожились`);
        LM.forEach(o=>{ if(o!==lm&&!o.capital&&!o.aiCapital&&!o.aiOwned&&Math.hypot(o.x-lm.x,o.z-lm.z)<20&&o.will!=null) o.will=Math.min(100,o.will+8); });
      }
    } else if(lm.rel==='prot'){ lm.will-=0.8; }                    // под крылом привыкают к державе
    else if(lm.rel!=='ours' && lm.will>60){ lm.will-=0.1; }        // время едва заметно лечит страхи
    lm.will=Math.max(0,Math.min(100,lm.will));
    if(!lm.rel && !lm.aiOwned && lm.will<=32 && canProtect(lm,cap) && (lm._begT==null||turn-lm._begT>10) && Math.random()<0.05){
      lm._begT=turn; if(window.__glog) window.__glog(`🙏 «${lm.name||'Деревня'}» просится под нашу защиту`);
    }
  });
  tf=Math.round(tf);
  window.__tribFood=tf;
  if(tf>0){ cap._store=(cap._store||0)+(cap._hasGranary?tf:Math.round(tf/2)); }   // негде хранить — половина пропадает
  if(vilIdx>=0) renderVillage();                                   // открытая панель живёт вместе с ходом
}

// ===== СОВЕТНИКИ: единое правило «аудиенции» (§14 GAME-VISION, 27.08-2) =====
// Каждый советник — {id,name,icon,check(cap,ctx)}: check в конце экономического тика возвращает
// «тревогу» {key,sev,see,threat,advice,edu} или null. Никаких модалок: строка в журнал + значок 🔔.
// Тишина: по одной теме не чаще раза в 4 хода, раньше — только если стало заметно хуже (sev вырос).
const ADVISORS=[];
const _advState={};          // key → {turn, sev}
let _advQueue=[];            // назревшие аудиенции
function advisorsTick(cap, ctx){
  if(!cap) return;
  let changed=false;
  for(const a of ADVISORS){
    let al=null; try{ al=a.check(cap, ctx||{}); }catch(e){}
    if(!al) continue;
    // 27.08-4 (вердикт «раз в 3-4 хода — можно город потерять»): тревога приходит ХОТЬ КАЖДЫЙ
    // ход, пока беда держится; защита только от дублей внутри одного хода.
    const st=_advState[al.key];
    if(st && st.turn===turn) continue;
    _advState[al.key]={turn, sev:al.sev||0};
    al.adv=a; _advQueue=_advQueue.filter(q=>q.key!==al.key); _advQueue.push(al); changed=true;
    advLog(al);                                          // 27.08-7: кликабельная строка прямо в Журнале
  }
}

function advLog(al){ ensureAudCss(); const l=document.getElementById('g-log'); if(!l) return;
  const d=document.createElement('div'); d.className='advline new'; d.dataset.k=al.key;
  d.textContent=`🔔 ${al.adv.name} просит аудиенции`;
  d.onclick=()=>openAudience(al.key);
  l.insertBefore(d, l.firstChild);
  while(l.childElementCount>80) l.removeChild(l.lastChild); }
function openAudience(key){
  ensureAudCss();
  let ix = key!=null ? _advQueue.findIndex(q=>q.key===key) : 0;
  if(key!=null && ix<0 && !_advSeen[key]) return;
  const al = (key!=null && ix<0) ? _advSeen[key] : _advQueue.splice(ix<0?0:ix,1)[0];
  if(!al) return;
  _advSeen[al.key]=al;
  const l=document.getElementById('g-log');
  if(l) l.querySelectorAll(`.advline[data-k="${al.key}"]`).forEach(e=>e.classList.remove('new'));
  let p=document.getElementById('g-aud');
  if(!p){ p=document.createElement('div'); p.id='g-aud'; document.body.appendChild(p); }
  p.innerHTML=`<div class="x">✕</div><h4>${al.adv.icon} ${al.adv.name}</h4>
    <div class="sec"><b class="lbl">что вижу</b>${al.see}</div>
    ${al.threat?`<div class="sec"><b class="lbl">чем грозит</b>${al.threat}</div>`:''}
    <div class="sec"><b class="lbl">совет</b>${al.advice}</div>
    ${al.edu?`<button class="q">📜 как это было в истории</button>`:''}
    <button class="okb">Понятно</button>`;
  p.querySelector('.x').onclick=()=>{ p.classList.remove('on'); };
  p.querySelector('.okb').onclick=()=>{ p.classList.remove('on'); };
  const q=p.querySelector('.q'); if(q) q.onclick=()=>openEdu(al.edu);
  setTimeout(()=>p.classList.add('on'),30);   // не rAF: headless-ловушка (см. openEdu)
}

// — первая аудиенция при основании столицы: разбор места (зовётся из свитка «Да будет так!») —
function advFounding(){
  const cap=LM.find(l=>l.capital); if(!cap) return;
  const hi=hexOfWorld(cap.x,cap.z); if(hi<0) return;
  let forest=0, meadow=0, water=0, hills=0, tot=0;
  for(const h of hexes){ const d=Math.hypot(h.x-cap.x,h.z-cap.z); if(d>14) continue; tot++;
    const b=biomeAt(h.x,h.z);
    if(b===B_FOREST) forest++; else if(b===B_MEADOW||b===B_STEPPE) meadow++;
    else if(b===B_WATER) water++; else if(b===B_HILLS) hills++; }
  if(!tot) return;
  const f=forest/tot, m=meadow/tot, w=water/tot;
  let see, advice;
  if(f>0.45){ see=`Государь, осмотрел округу: кругом лес, пахотной земли мало (лугов лишь ${Math.round(m*100)}%).`;
    advice=`Прокормимся охотой${w>0.08?' и рыбой':''}, но зверь не бесконечен — со временем понадобятся пашни на дальних лугах или хлебная дань с деревень.`; }
  else if(m>0.45){ see=`Государь, место доброе: лугов и степи вдоволь (${Math.round(m*100)}% округи) — паши да сей.`;
    advice=`Закладывай пашни и скотный двор; лес и камень добудем в стороне.`; }
  else if(w>0.25){ see=`Государь, мы у большой воды: рыба прокормит вернее охоты.`;
    advice=`Ставь причалы рыбарей; пашни — по лугам, что найдутся.`; }
  else { see=`Государь, округа пёстрая: лес — ${Math.round(f*100)}%, луга — ${Math.round(m*100)}%, есть вода и холмы.`;
    advice=`Начни с еды: охота или пашня, что ближе. Камень и лес подождут — голодный город не строит.`; }
  const al={ key:'feeder-founding', adv:ADVISORS[0], see, advice, threat:null, edu:'golod' };
  _advQueue.push(al); _advState['feeder-founding']={turn, sev:0};
  advLog(al);        // 27.08-7: след в журнале — можно перечитать позже
  openAudience();    // при основании — аудиенция открывается сама (§14)

// ТЕРРАСА (2026-07-12). Поселение ставится в ОДНУ точку — высоту центра клетки, — поэтому на склоне
// половина домов висела в воздухе (видно на скринах у реки). Подкладываем насыпь: плоская площадка на
// уровне поселения и стенка, уходящая вниз до самой низкой земли под пятном. Так люди и строили на
// склоне — срезали и подсыпали. На ровном месте (перепад мал) терраса не нужна и не создаётся.
const TER_MAT=new THREE.MeshStandardMaterial({color:0x8f7a55, roughness:1});
function terraceFor(lm, sz){
  const R=1.35+0.32*sz;                                   // площадка чуть шире пятна построек
  let lo=lm.y;
  for(let a=0;a<12;a++){ const th=a*Math.PI/6;
    const h=hAt(lm.x+Math.cos(th)*R, lm.z+Math.sin(th)*R); if(h<lo) lo=h; }
  const drop=lm.y-lo;
  if(drop<0.35) return null;                              // ровно — терраса ни к чему
  const dep=drop+0.45;                                    // стенка уходит ниже земли, чтобы не было щели
  const m=new THREE.Mesh(new THREE.CylinderGeometry(R, R*0.94, dep, 24), TER_MAT);
  m.position.y = -dep/2 + 0.06;                           // верх площадки — вровень с поселением (группа уже на lm.y)
  m.receiveShadow=true; m.castShadow=true;
  return m;
}
const CL_SCALE=0.34;   // «вариант 1»: поселение целиком в одном тайле (2026-07-15, tg 1102)
// ВОРОТА К ДОРОГЕ (просьба пользователя 2026-07-15): посёлок разворачивается воротами
// (местная ось +z кластера — там ворота ограды и входы зданий) к самой наезженной дороге
// у своей клетки. Дорог рядом нет — прежний псевдослучайный угол. Пересчитывается при
// (пере)сборке кластера, т.е. при основании и каждом росте — посёлки не крутятся на глазах.
function gateRot(lm, i){
  const h=hexOfWorld(lm.x,lm.z);
  let best=0, bx=0, bz=0;
  if(h>=0) for(const [dq,dr] of HN){
    const jk=key(hexes[h].q+dq, hexes[h].r+dr); if(!hexIdx.has(jk)) continue;
    const j=hexIdx.get(jk), e=edgeOf(h,j); if(e<0) continue;
    if(roadUse[e]>best){ best=roadUse[e]; bx=hexes[j].x-lm.x; bz=hexes[j].z-lm.z; }
  }
  if(best < (roadUseMax||1e-6)*0.05 || (bx===0&&bz===0)) return (i*2.399)%6.28;  // рядом нет заметной дороги
  return Math.atan2(bx,bz);   // rotation.y=rot разворачивает местную +z в (sin·rot, cos·rot) — на дорогу
}
function syncSettlements(){
  for(let i=0;i<LM.length;i++){
    const lm=LM[i], si=stageIdxH(lm);
    const ep=archFor(si,turn), sz=si+1, kind=kindOf(lm), col=lmColor(lm);
    const key=ep+'|'+sz+'|'+kind+'|'+(kind==='capital'?col:0);
    if(!LM3D[i]){ LM3D[i]={key:null,group:null}; }
    const rec=LM3D[i];
    if(rec.key!==key){
      if(rec.group){ scene.remove(rec.group); rec.group.traverse(c=>{ if(c.geometry) c.geometry.dispose(); }); }
      const rot=gateRot(lm, i);
      // МАСШТАБ ПОСЕЛЕНИЯ = ОДИН ТАЙЛ (выбор пользователя 2026-07-15, «вариант 1», tg 1102):
      // застройка ×0.34 — весь кластер, включая ограду, помещается в гекс r=2.0.
      // ?clscale=N — служебная примерка другого масштаба поверх.
      const _cls=+(new URLSearchParams(location.search).get('clscale'))||CL_SCALE;
      const g=LAB_ARCH[ep] ? labCluster(ep,sz,{kind,color:col,at:{x:lm.x,z:lm.z,rot,scl:_cls}})
                           : cluster(ep,sz,{onPad:false,kind,color:col});   // v2-силуэты ранних эпох
      enrichCluster(g);   // задание №2 (постройки): вариация тона домов + дымок над очагом + двор
      if(LAB_ARCH[ep]) mergeClusterMeshes(g);   // §T1: слить кластер в горстку мешей (после enrichCluster — тона уже розданы)
      g.scale.setScalar(_cls);
      g.position.set(lm.x, lm.y, lm.z); g.rotation.y=rot; scene.add(g);
      const ter=terraceFor(lm, sz); if(ter) g.add(ter);       // насыпь-терраса, если поселение стоит на склоне
      rec.key=key; rec.group=g;
      if(lm.capital||lm.aiCapital) clearVillageDecor(i);   // стала столицей (нашей или чужой) → украшения исчезают
    }
  }
  syncVillageDecor();                             // дорисовать декор новым деревням, снять у наших
  drawCapitalZone();
}

function aiTurn(idx, yr){
  const cap=aiCap(); if(!cap) return;
  let pop=popOf(cap.size);
  const by=BIRTH_RATE[idx]/100, dy=DEATH_BASE[idx]/100;                 // сытый город — без штрафа «кладбища», как у нас
  for(let y=0;y<yr;y++) pop=Math.max(10, pop*(1+by-dy));
  let mig=0;                                                            // приток из ПОДЧИНЁННЫХ деревень
  LM.forEach(v=>{ if(!v.aiOwned || v.aiCapital) return;
    const dist=Math.hypot(v.x-cap.x, v.z-cap.z);
    const flow=MIG_BASE*CITY_PULL*(1/(1+0.035*dist))*0.7;               // без дорог соперника — поток скромнее нашего
    const take=Math.max(0, Math.min(flow, popOf(v.size)*(1-VILLAGE_FLOOR)));
    v.size=sizeOfPop(Math.max(10, popOf(v.size)-take)); mig+=take; });
  const before=popOf(cap.size);
  cap.size=sizeOfPop(pop+mig); cap._growLast=popOf(cap.size)-before; cap._migrants=Math.round(mig);
  // 27.08-3: САМОЗАХВАТ ДЕРЕВЕНЬ УБРАН (вердикт: «непонятный захват по непонятному сценарию»).
  // Раньше держава ИИ раз в несколько ходов молча помечала ближнюю ничейную деревню своей —
  // без воли, дани и причин, просто по расстоянию. Соперник снова начнёт собирать земли в
  // этапе 2 (вождества ИИ) — по тем же честным правилам воли/даров/дани, что и игрок (§13).
}

// добавляем сюда новые обязательные действия (основать столицу, назначить и т.п.).
function pendingTask(){
  if(pickingCapital) return { remind(){ if(window.__capital) window.__capital.nudge(); } };
  const firstInd = window.__survey && window.__survey.firstNeeded && window.__survey.firstNeeded();
  if((pickingSurvey||pickingIndustry) && firstInd)   // держим ход только пока не заложен ПЕРВЫЙ промысел; повторный осмотр — по желанию

function updEndBtn(){ const b=document.getElementById('g-end'); if(!b) return;
  const face=b.querySelector('.face'); const d=unitDuties();

function endTurn(){
  if(running) return;
  const pt=pendingTask(); if(pt){ pt.remind(); return; }  // есть незакрытое дело → к нему, ход не начинаем
  if(!_forceEnd && !autoTurns){ const d=unitDuties();                       // авто-ходы дела не стопорят
    if(d.length){ const selU=window.__selUnit&&window.__selUnit();
      const ix=d.indexOf(selU);
      if(ix<0){ if(window.__unitFocus) window.__unitFocus(d[0]); updEndBtn(); return; }      // 1-й клик — к первому делу
      if(ix<d.length-1){ if(window.__unitFocus) window.__unitFocus(d[ix+1]); updEndBtn(); return; }   // дальше — по кругу дел
      /* последнее дело уже показано — повторный клик завершает ход */ } }
  _forceEnd=false;
  if(window.__survey && window.__survey.cancelPick) window.__survey.cancelPick();  // необязательный (повторный) осмотр не начат/не завершён → отменяем, ход идёт
  if(animate){ running=true; remaining=stepsPerTurn; perFrame=Math.max(1, Math.ceil(stepsPerTurn/72));
    hud.setBusy(true); hud.setState('идёт ход…');

    turn++; advanceEconomy(); growRoads(); syncSettlements(); rebuildRoads(); updateBoard(); refreshTime(); hud.setState('мир замер'); }
}

  // задать плашку-подсказку (внизу, над «Конец хода»): {icon, body, cta, ctaKind:'button'|'prompt'} или строка-body.

  function render(o){

  function showFoundingStory(lm){

    const text=`После долгих недель пути ты, <b>${PLAYER.name}</b>, во главе своего отряда вступаешь в ${acc} <b>${nm}</b>. Жители выходят навстречу с хлебом да солью и радушно принимают тебя. Здесь, под этим небом, ты решаешь основать столицу нового государства. Вместе с отрядом шёл и Мудрец — он готов взяться за первые тайны мира, стоит тебе сказать слово. Так рождается держава <b>${ctry.name} ${ctry.flag}</b> — да выдержит она испытание временем, а имя твоё войдёт в летописи!`;

  function setCapital(lm){

// ===== ОСМОТР округи (СЛОЙ 1): после основания столицы — напоминание, по клику показываем =====
// ресурсные пятна контуром. Пятна ищем flood-fill'ом по типу клетки (biomeAt) в радиусе 4 колец;
// контур — LineSegments по граничным рёбрам, в осветлённом цвете самой местности. Клик по пятну →
// дорога/здание — следующий слой. (DECISIONS 2026-07-06)
(function initSurvey(){
  const SCAN=4;
  const EDGEC=[[0,1],[3,4],[1,2],[4,5],[5,0],[2,3]];   // рёбра гекса (пары углов) по индексу соседа в HN
  const bright=(hex,t)=>{ const r=hex>>16&255,g=hex>>8&255,b=hex&255;   // осветлить цвет к белому
    return (Math.round(r+(255-r)*t)<<16)|(Math.round(g+(255-g)*t)<<8)|Math.round(b+(255-b)*t); };
  const RES={ [B_FOREST]  :{key:'forest',col:0x1f7a1f},    // яркие РАЗНЫЕ оттенки, чтобы контуры не сливались (лес — густо-зелёный)
              [B_WATER]   :{key:'water', col:0x1587e0},    // вода — синий
              [B_HILLS]   :{key:'hills', col:0xe08a1e},    // холмы — янтарно-оранжевый (не путать с зеленью); сама ГОРА — не клетка
              [B_MEADOW]  :{key:'meadow',col:0x9ede1f} };  // луг — лаймовый (жёлто-зелёный)
  const RES_RIVER={key:'rwater',col:0x49b7e8};             // 31.08: ЛЕСНОЙ берег у русла — речная ловля (верши/заколы) или охота; русло само не застраивается
  const grp=new THREE.Group(); grp.renderOrder=6; scene.add(grp);
  let foundPatches=[], capHexI=-1, curPatch=null;         // слой 2: найденные угодья, гекс столицы, текущее превью
  let selInd=null, curBld=null, placeX=0, placeZ=0, placeRot=0;   // выбранный промысел + место/разворот здания (для лугового выбора пашня/скот)
  const INDUSTRIES=[];                                    // реестр заложенных промыслов города
  const STORE={};                                         // СКЛАД города: шерсть/шкуры/камень/древесина (еда считается отдельно)
  const built=new THREE.Group(); scene.add(built);        // постоянные 3D-здания промыслов (не стираются превью)
  const hlg=new THREE.Group(); scene.add(hlg);            // подсветка клеток промысла (пока панель открыта)
  function clear(){ while(grp.children.length){ const o=grp.children[grp.children.length-1];
    if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); grp.remove(o); } }
  const hdist=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs(a.q+a.r-b.q-b.r))/2;

  // после основания — только напоминание, контуры пока НЕ рисуем (держим ход)
  function onCapitalFounded(){
    clear(); pickingSurvey=true;
    if(window.__capital){ window.__capital.setTask({
        body:'Мудрый советник склонился пред тобою: «Дозволь, Правитель, обойти окрестные земли — сочту, где чащи для ловчих, где вода для рыбарей, где камень для зодчих».',
        cta:'осмотреть округу', ctaKind:'button' });
      window.__capital.showBanner(); }
  }
  // по клику на напоминание — осмотр: находим пятна и обводим контуром
  function reveal(){
    if(!pickingSurvey) return;
    clear();
    const cap=LM.find(l=>l.capital); if(!cap) return;
    const ci=hexOfWorld(cap.x,cap.z); if(ci<0) return;
    const c0=hexes[ci];
    const PATCHMAX=7;                                     // предел тайлов на один ресурсный кусок — крупные режем
    const SCANR=capitalCtrlRadius(cap);                   // осмотр = ровно зона досягаемости (кольца тела города + 4), один источник правды
    // 05.09: осмотр многоцентровый — столица + округа ВОШЕДШИХ деревень (земли державы под промыслы)
    const CTRS=[{h:c0,R:SCANR}];
    LM.forEach(l=>{ if(l.rel==='ours'&&!l.capital){ const vi=hexOfWorld(l.x,l.z); if(vi>=0) CTRS.push({h:hexes[vi],R:4}); } });
    const taken=new Set(); INDUSTRIES.forEach(r=>r.cells.forEach(c=>taken.add(c)));   // уже занятые угодья повторно не предлагаем
    const distC=i=>Math.min(...CTRS.map(c=>hdist(hexes[i],c.h)));   // расстояние тайла от ближайшего поселения державы
    const typeOf=new Map();
    hexes.forEach((h,i)=>{ if(CTRS.some(c=>hdist(h,c.h)<=1)) return; if(!CTRS.some(c=>hdist(h,c.h)<=c.R)) return; if(taken.has(i)) return;   // ближний ряд поселений свободен под застройку; занятые угодья пропускаем
      if(riverHex.has(i)) return;                         // клетка РУСЛА — не угодье: пашня обрубала ленту реки (план №5, скрин 15.08 16:24)
      const b=biomeAt(h.x,h.z);
      if(b===B_FOREST && HN.some(([dq,dr])=>{ const nk=key(h.q+dq,h.r+dr); return hexIdx.has(nk)&&riverHex.has(hexIdx.get(nk)); })){
        typeOf.set(i,RES_RIVER); return; }                // 31.08: лесной берег у реки — рыба/охота; ЛУГ у реки остаётся пашне
      const r=RES[b]; if(r) typeOf.set(i,r); });
    const sameNbr=(j,r)=>{ const hj=hexes[j], out=[];    // соседи того же ресурса в зоне осмотра
      HN.forEach(([dq,dr])=>{ const nk=key(hj.q+dq,hj.r+dr); if(!hexIdx.has(nk)) return;
        const ni=hexIdx.get(nk); const nr=typeOf.get(ni); if(nr&&nr.key===r.key) out.push(ni); }); return out; };
    const seen=new Set(), patches=[];
    typeOf.forEach((r,i)=>{ if(seen.has(i)) return;
      const comp=[], st=[i]; seen.add(i);               // 1) связная компонента одного типа
      while(st.length){ const j=st.pop(); comp.push(j);
        sameNbr(j,r).forEach(ni=>{ if(!seen.has(ni)){ seen.add(ni); st.push(ni); } }); }
      // Режем компоненту на РАВНЫЕ КОМПАКТНЫЕ СВЯЗНЫЕ поля, КАЖДОЕ ≤PATCHMAX клеток. (Переписано 2026-07-09:
      // прежний Вороной+балансировка давал ~22% полей-ГАНТЕЛЕЙ — комок+перешеек+комок; пользователь: «поля кучнее».)
      // splitInto(k): 1) k зёрен дальней выборкой; 2) ВОРОНОЙ (клетка к ближнему зерну) — РАВНЫЕ компактные куски
      //   плотно у семёрки; 3) починка связности (крупнейший блок полю, оторванные → соседу = один остров); 4)
      //   балансировка до равных, но ход, рождающий ГАНТЕЛЬ у любого поля, ЗАПРЕЩЁН (это и держит поля кучными);
      //   5) «разжать гантель» — остаточную гантель распускаем, меньшую долю за перешейком отдаём соседу. Затем: если
      //   поле всё же >PATCHMAX — увеличиваем k и режем заново.
      // Проверено node-моделью (scratchpad/field_model.mjs) на 3000 форм: гантелей 0.9% (было 22.2%), 0 разрывов,
      // 0 полей>7, средний размер поля 5.9 (у семёрки), разброс 0.6 (равные).
      const n=comp.length, cells=[...comp];
      const SN=j=>sameNbr(j,r);                              // соседи того же угодья
      const conn=arr=>{ if(arr.length<=1) return true; const set=new Set(arr),seen=new Set([arr[0]]),st=[arr[0]];
        while(st.length){ const c=st.pop(); SN(c).forEach(ni=>{ if(set.has(ni)&&!seen.has(ni)){ seen.add(ni); st.push(ni); } }); } return seen.size===arr.length; };
      const dumb=arr=>{ if(arr.length<4) return false; const set=new Set(arr);   // гантель: есть клетка-перешеек, разрыв которой даёт две доли по ≥2 клетки
        for(const cut of arr){ const rest=arr.filter(x=>x!==cut); const vis=new Set(),blocks=[];
          for(const s0 of rest){ if(vis.has(s0)) continue; const cc=[],q=[s0]; vis.add(s0);
            while(q.length){ const c=q.pop(); cc.push(c); SN(c).forEach(ni=>{ if(set.has(ni)&&ni!==cut&&!vis.has(ni)){ vis.add(ni); q.push(ni); } }); } blocks.push(cc); }
          blocks.sort((a,b)=>b.length-a.length); if(blocks.length>=2&&blocks[1].length>=2) return true; } return false; };
      const splitInto=(k)=>{
        // 1) k зёрен дальней выборкой (разнесены по пятну)
        const seeds=[]; { let s=cells[0],bd=-1; cells.forEach(j=>{ const d=distC(j); if(d>bd){ bd=d; s=j; } }); seeds.push(s); }
        while(seeds.length<k){ let s=-1,bd=-1; cells.forEach(j=>{ let md=Infinity; seeds.forEach(sd=>{ const d=hdist(hexes[j],hexes[sd]); if(d<md)md=d; }); if(md>bd){ bd=md; s=j; } }); seeds.push(s); }
        // 2) ВОРОНОЙ: каждая клетка к БЛИЖНЕМУ зерну → равные компактные куски, плотно у семёрки (как нравилось пользователю).
        const owner=new Map(); cells.forEach(j=>{ let bi=0,bd=Infinity; seeds.forEach((sd,si)=>{ const d=hdist(hexes[j],hexes[sd]); if(d<bd){ bd=d; bi=si; } }); owner.set(j,bi); });
        const pc=si=>cells.filter(j=>owner.get(j)===si);
        // 3) ПОЧИНКА связности: у поля крупнейший блок — своё, оторванные под-блоки → соседу (каждое поле один остров).
        const repair=()=>{ for(let pass=0; pass<n+2; pass++){ let dirty=false;
            for(let si=0; si<k; si++){ const mine=pc(si); if(mine.length<=1) continue; const seen=new Set(),comps=[];
              for(const s0 of mine){ if(seen.has(s0)) continue; const cc=[],st=[s0]; seen.add(s0);
                while(st.length){ const j=st.pop(); cc.push(j); SN(j).forEach(ni=>{ if(owner.get(ni)===si&&!seen.has(ni)){ seen.add(ni); st.push(ni); } }); } comps.push(cc); }
              if(comps.length<=1) continue; dirty=true; comps.sort((a,b)=>b.length-a.length);
              for(let c=1;c<comps.length;c++){ const orph=comps[c]; let tgt=-1;
                for(const j of orph){ for(const ni of SN(j)){ const o=owner.get(ni); if(o!==si){ tgt=o; break; } } if(tgt>=0) break; }
                if(tgt<0) tgt=si; orph.forEach(j=>owner.set(j,tgt)); } }
            if(!dirty) break; } };
        const stays=(j,oj)=>conn(pc(oj).filter(x=>x!==j));
        repair();
        // 4) БАЛАНСИРОВКА до равных, но ход, рождающий гантель у любого поля, — ЗАПРЕЩЁН (это и держит поля кучными).
        for(let it=0; it<n*8 && k>1; it++){ const c=cells.reduce((a,j)=>(a[owner.get(j)]++,a),new Array(k).fill(0));
          const order=[...c.keys()].sort((a,b)=>c[a]-c[b]); const big=order[order.length-1];
          if(c[big]-c[order[0]]<=1) break; let moved=false;
          for(const sm of order){ if(c[sm]>=c[big]) break;
            for(const j of cells){ const oj=owner.get(j); if(oj===sm||c[oj]<=c[sm]+1) continue;
              if(!SN(j).some(ni=>owner.get(ni)===sm)||!stays(j,oj)) continue;
              if(dumb([...pc(sm),j])||dumb(pc(oj).filter(x=>x!==j))) continue;
              owner.set(j,sm); moved=true; break; }
            if(moved) break; }
          if(!moved) break; }
        repair();
        // 5) РАЗЖАТЬ ГАНТЕЛЬ: у гантельного поля меньшую долю за перешейком отдаём примыкающему соседу (если тот ≤PATCHMAX и не станет гантелью).
        for(let pass=0; pass<3; pass++){ let fixed=false;
          for(let si=0; si<k; si++){ const piece=pc(si); if(!dumb(piece)) continue;
            let give=null; const set=new Set(piece);
            for(const cut of piece){ const rest=piece.filter(x=>x!==cut); const vis=new Set(),blocks=[];
              for(const s0 of rest){ if(vis.has(s0)) continue; const cc=[],q=[s0]; vis.add(s0);
                while(q.length){ const c2=q.pop(); cc.push(c2); SN(c2).forEach(ni=>{ if(set.has(ni)&&ni!==cut&&!vis.has(ni)){ vis.add(ni); q.push(ni); } }); } blocks.push(cc); }
              blocks.sort((a,b)=>b.length-a.length); if(blocks.length>=2&&blocks[1].length>=2){ give=blocks[blocks.length-1]; break; } }
            if(!give) continue; const gset=new Set(give);
            const tc=new Map(); give.forEach(j=>SN(j).forEach(ni=>{ const o=owner.get(ni); if(o!==si&&!gset.has(ni)) tc.set(o,(tc.get(o)||0)+1); }));
            let tgt=-1,bt=0; tc.forEach((v,o)=>{ if(v>bt){ bt=v; tgt=o; } }); if(tgt<0) continue;
            const tAfter=[...pc(tgt),...give]; if(tAfter.length>PATCHMAX||dumb(tAfter)||!conn(tAfter)) continue;
            const gAfter=piece.filter(j=>!gset.has(j)); if(gAfter.length&&!conn(gAfter)) continue;
            give.forEach(j=>owner.set(j,tgt)); fixed=true; }
          if(!fixed) break; }
        const pieces=Array.from({length:k},()=>[]); owner.forEach((v,j)=>pieces[v].push(j)); return pieces;
      };
      // ЖАДНАЯ НАБИВКА (2026-07-10). Вороной делит пятно «поровну», и на тонком вьющемся луге-ЗМЕЙКЕ (а настоящие
      // луга между лесом и горами именно такие) куски вылезают за 7 → k растёт → вместо 3 полей по ~6 выходит 4 по ~4.
      // Здесь растим поле-блоб от края внутрь, добирая соседа с максимальной связью с блобом, до цели
      // target=ceil(остаток/ceil(остаток/7)): полей всегда минимум (ceil(n/7)), и они не «7,7,3», а ровные 6,6,5.
      const greedyFit=()=>{
        const un=new Set(cells), out=[];
        while(un.size){
          const rem=un.size, target=Math.ceil(rem/Math.max(1,Math.ceil(rem/PATCHMAX)));
          let cq=0,cr=0; un.forEach(j=>{ cq+=hexes[j].q; cr+=hexes[j].r; }); const ct={q:cq/rem,r:cr/rem};
          let seed=-1,bd=-1; un.forEach(j=>{ const d=hdist(hexes[j],ct); if(d>bd){ bd=d; seed=j; } });   // зерно = крайняя клетка остатка (растём от края внутрь — остаток не рвётся)
          const blob=new Set([seed]); un.delete(seed);
          while(blob.size<target){
            const cand=new Set(); blob.forEach(j=>SN(j).forEach(ni=>{ if(un.has(ni)) cand.add(ni); }));
            if(!cand.size) break;                            // блоб упёрся в тупик (узкое место змейки) — остаток пойдёт в следующее поле
            let bq=0,br=0; blob.forEach(j=>{ bq+=hexes[j].q; br+=hexes[j].r; }); const bc={q:bq/blob.size,r:br/blob.size};
            let bj=-1,bnb=-1,bd2=Infinity;                   // берём соседа с макс. связью (заполняем вырезы), при равенстве — ближе к центру блоба (кучность)
            cand.forEach(j=>{ const nb=SN(j).filter(ni=>blob.has(ni)).length, d=hdist(hexes[j],bc);
              if(nb>bnb||(nb===bnb&&d<bd2)){ bnb=nb; bd2=d; bj=j; } });
            blob.add(bj); un.delete(bj);
          }
          out.push([...blob]);
        }
        return out;
      };
      // УПАКОВКА (2026-07-09). Обе нарезки выше промахиваются мимо МИНИМУМА полей ceil(n/7) на вытянутых кусках:
      // Вороной лезет за потолок → k++ → лишнее поле; жадная набивка ПЕРЕКУСЫВАЕТ остаток пополам → хвосты 7+4+3.
      // Пользователь на скрине: кусок луга 14 клеток вышел 3+5+6 вместо 7+7. Здесь поле растёт из ТУПИКА (клетка
      // с наименьшим числом соседей по остатку) и клетка НЕ берётся, если после неё остаток распадается на части;
      // затем соседние поля сливаются, пока сумма ≤7, а одиночная клетка пристраивается к соседу (но НЕ выше потолка).
      // Проверено node (scratchpad/hybrid3.mjs, 3000 лугов): лишнее поле/потерянная клетка 4.8%→0.2% на компактных
      // и 7.8%→0.4% на змейках; брошенных клеток почти ноль; гантелей 9.4%→10.8%; полей >7 нет.
      const packFit=()=>{
        const un=new Set(cells), out=[];
        const nbrIn=(j,set)=>SN(j).filter(ni=>set.has(ni));
        while(un.size){
          const rem=un.size, target=Math.min(PATCHMAX, Math.ceil(rem/Math.max(1,Math.ceil(rem/PATCHMAX))));
          let seed=-1,bn=99; un.forEach(j=>{ const d=nbrIn(j,un).length; if(d<bn){ bn=d; seed=j; } });   // зерно — самая «глухая» клетка
          const blob=new Set([seed]); un.delete(seed);
          while(blob.size<target && un.size){
            const cand=[]; blob.forEach(j=>nbrIn(j,un).forEach(ni=>{ if(!cand.includes(ni)) cand.push(ni); }));
            if(!cand.length) break;
            const safe=cand.filter(j=>{ const rest=[...un].filter(x=>x!==j); return !rest.length||conn(rest); });  // не рвать остаток
            let pool=safe.length?safe:cand;
            const nice=pool.filter(j=>!dumb([...blob,j])); if(nice.length) pool=nice;                              // не рождать гантель
            let bq=0,br=0; blob.forEach(j=>{ bq+=hexes[j].q; br+=hexes[j].r; }); const bc={q:bq/blob.size,r:br/blob.size};
            let bj=-1,bnb=-1,bd=Infinity;                    // сосед с макс. связью, при равенстве — ближе к центру блоба
            pool.forEach(j=>{ const nb=nbrIn(j,blob).length, d=hdist(hexes[j],bc);
              if(nb>bnb||(nb===bnb&&d<bd)){ bnb=nb; bd=d; bj=j; } });
            blob.add(bj); un.delete(bj);
          }
          out.push([...blob]);
        }
        const adjac=(a,b)=>a.some(j=>SN(j).some(ni=>b.includes(ni)));
        for(let merged=true; merged;){ merged=false; out.sort((a,b)=>a.length-b.length);   // слить соседей, пока влезает в потолок
          outer: for(let i=0;i<out.length;i++) for(let k2=i+1;k2<out.length;k2++){
            const sum=out[i].concat(out[k2]);
            if(sum.length<=PATCHMAX && adjac(out[i],out[k2]) && !dumb(sum)){ out[i]=sum; out.splice(k2,1); merged=true; break outer; } } }
        for(let i=out.length-1;i>=0;i--){ if(out[i].length>=2) continue;                    // одиночку — соседу, но не выше потолка
          const cell=out[i][0]; let tgt=-1,best=99;
          out.forEach((f,k2)=>{ if(k2===i||f.length>=PATCHMAX||!f.some(j=>SN(j).includes(cell))) return;
            const sc=f.length+(dumb([...f,cell])?100:0); if(sc<best){ best=sc; tgt=k2; } });
          if(tgt>=0){ out[tgt].push(cell); out.splice(i,1); } }
        return out;
      };
      // Берём ЛУЧШУЮ из ТРЁХ нарезок: меньше полей → меньше брошенных клеток → меньше гантелей → ровнее размеры.
      // Проверено node-моделью (scratchpad/field_model.mjs, 3000 форм каждого класса): на змейках лишних полей 0.9%
      // (было 37%), средний размер 5.69 при теоретическом пределе 5.77; на компактных пятнах 5.94 при пределе 5.95,
      // гантелей 1%. Ноль потерянных клеток, ноль полей >7, ноль разрывов — в обоих классах форм.
      const scoreOf=pl=>{ const real=pl.filter(p=>p.length>=2), sz=real.map(p=>p.length);
        return { real, fields:real.length, lost:pl.reduce((s,p)=>s+(p.length<2?p.length:0),0),
                 dumb:real.filter(p=>dumb(p)).length, spread:sz.length?Math.max(...sz)-Math.min(...sz):0 }; };
      let k=Math.max(1,Math.ceil(n/PATCHMAX)), A=splitInto(k);
      while(k<n && Math.max(0,...A.map(p=>p.length))>PATCHMAX){ k++; A=splitInto(k); }   // поле вылезло за потолок → больше полей
      const better=(x,y)=>(x.fields!==y.fields ? (x.fields<y.fields) : x.lost!==y.lost ? (x.lost<y.lost)
                : x.dumb!==y.dumb ? (x.dumb<y.dumb) : x.spread<=y.spread) ? x : y;
      const win=better(better(scoreOf(A), scoreOf(greedyFit())), scoreOf(packFit()));
      win.real.forEach(pc=>patches.push({r,cells:pc}));
    });
    const W=0.30;                                        // полуширина ленты-контура (мировые ед.) — «жирная» линия вместо тонкой
    patches.forEach(p=>{
      const set=new Set(p.cells), pos=[];
      const y=(x,z)=>hAt(x,z)+0.16;
      const ribbon=(ax,az,bx,bz)=>{                      // плоская лента по ребру: смещаем концы ±перпендикуляр в плоскости XZ
        let px=-(bz-az), pz=(bx-ax); const pl=Math.hypot(px,pz)||1; px=px/pl*W; pz=pz/pl*W;
        const a1x=ax+px,a1z=az+pz, a2x=ax-px,a2z=az-pz, b1x=bx+px,b1z=bz+pz, b2x=bx-px,b2z=bz-pz;
        pos.push(a1x,y(a1x,a1z),a1z, a2x,y(a2x,a2z),a2z, b1x,y(b1x,b1z),b1z,   // 2 треугольника = квад-полоска
                 a2x,y(a2x,a2z),a2z, b2x,y(b2x,b2z),b2z, b1x,y(b1x,b1z),b1z);
      };
      p.cells.forEach(j=>{ const hj=hexes[j], cor=hexCorners(hj.x,hj.z);
        HN.forEach(([dq,dr],d)=>{ const nk=key(hj.q+dq,hj.r+dr);
          if(hexIdx.has(nk)&&set.has(hexIdx.get(nk))) return;
          const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]];
          ribbon(A[0],A[1],B[0],B[1]); }); });
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      const rib=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:p.r.col,transparent:true,opacity:0.92,depthTest:false,side:THREE.DoubleSide}));
      rib.renderOrder=7; grp.add(rib);
    });
    // сохранить пятна для слоя 2 (клик по угодью → выбор промысла)
    foundPatches=patches.map(p=>{ const set=new Set(p.cells);
      let target=p.cells[0], bd=Infinity;                 // целевая клетка = ближняя к городу ПО ПРЯМОЙ (не по гекс-дистанции:
      p.cells.forEach(j=>{ const dx=hexes[j].x-cap.x, dz=hexes[j].z-cap.z;   // среди равных по гексам выбирает реально ближнюю → хижина у ближнего края, дорога короче)
        const d=dx*dx+dz*dz; if(d<bd){ bd=d; target=j; } });
      return { r:p.r, cells:p.cells, set, target, cx:hexes[target].x, cz:hexes[target].z }; });
    capHexI=ci;
    if(window.__glog) window.__glog(`Округа осмотрена: найдено ${patches.length} ${plural(patches.length,'угодье','угодья','угодий')}`);
    if(patches.length===0){                               // редкий случай — обводить нечего, ход не держим
      pickingSurvey=false; pickingIndustry=false;
      if(window.__capital){ window.__capital.setTask({ body:'Советник воротился ни с чем: годных угодий вкруг города не высмотрел. Что ж, вершим ход, Правитель.' }); window.__capital.hideBanner(); }
      return;
    }
    pickingSurvey=false; pickingIndustry=true;             // осмотр закрыт → держим ход, пока не выбран первый промысел
    if(window.__capital) window.__capital.setTask({
      body:`Советник воротился с обходом: высмотрел <b>${patches.length}</b> ${plural(patches.length,'угодье','угодья','угодий')} под промысел вкруг города. Укажи, Правитель, за какое взяться первым.`,
      cta:'кликни по угодью', ctaKind:'prompt' });
  }

  const BIOME_IND={ forest:['hunt','lumber'], water:['fish'], rwater:['fish','hunt'], hills:['quarry'], meadow:['farm','pasture'] };   // какие промыслы доступны на биоме (в лесу, на лугу и на речном берегу — выбор)
  // ЧЕСТНЫЕ ПРОПОРЦИИ ЕДЫ (2026-07-09, по историческим данным — см. DECISIONS/DEMOGRAPHY).
  // Прежние числа (4 / 3.5 / 3 / 2.6) я выдумал «по ощущению» — охота почти равнялась пашне, чего не было и близко.
  // За основу: сколько людей кормит клетка (≈10 га) при урожайности 1000-1700 кг/га — пашня ~20, причал ~6,

  // взамен зверь ВЫБИВАЕТСЯ: отдача стана падает с каждым ходом (HUNT_DECAY).
  // ТОВАРЫ (res2/amp2): скот даёт ШЕРСТЬ — главный товар Междуречья; охота — ШКУРЫ. Торговли пока нет, копятся на складе.
  const INDMETA={

  const OX_PER_CELLS=2, OX_STEP=0.10, OX_MAX=0.40;   // волы: каждые 2 клетки пастбища → +10% к урожаю пашни, потолок +40%

  // пунктир-дорога прогноза столица→угодье (dijkstra уже есть; smoothChain сажает на рельеф)
  function roadPoints(targetHex,endXZ){                    // точки пути город→угодье, посаженные на рельеф

    if(!pts){ const c=hexes[capHexI]; pts=[[c.x,hAt(c.x,c.z),c.z]]; }   // здание вплотную к городу — прямой штрих от города

    line.computeLineDistances(); line.renderOrder=8; return line;
  }
  // ПУНКТИР К УЖЕ ЗАЛОЖЕННОМУ ПРОМЫСЛУ: рисуем ТОЛЬКО пока открыта его карточка И тропа ещё не
  // протоптана (grade 0 = целина). Как только люди натоптали тропу — ведёт настоящая дорога.

  // панель промысла (справа снизу)

  document.head.appendChild(pst);
  const panel=document.createElement('div'); panel.id='g-ind'; document.body.appendChild(panel);
  function openPanel(p){ const inds=BIOME_IND[p.r.key]||[p.r.key]; const m=IND[selInd]; const people=p.cells.length*m.per;
    const choice = inds.length>1                            // на лугу — выбор пашня/скот; иначе выбора нет
      ? `<div class="ch">`+inds.map(id=>`<button class="chip${id===selInd?' sel':''}" data-ind="${id}"><span class="cdot" style="background:${IND[id].tint}"></span>${IND[id].name}</button>`).join('')+`</div>` : '';
    panel.innerHTML=`<h4><span class="dot" style="background:${m.tint}"></span>${m.name}</h4>
      ${choice}
      <p>${m.desc}</p>
      <div class="row">Угодье: <b>${p.cells.length}</b> ${plural(p.cells.length,'клетка','клетки','клеток')} · займёт <b>~${people}</b> ${plural(people,'человек','человека','человек')}</div>
      <div class="soon">Доход вызревает — подсчитаем в следующих ходах.</div>
      <button class="go" type="button">Заложить промысел</button>`;
    panel.querySelectorAll('.chip').forEach(btn=>btn.onclick=()=>{ selInd=btn.dataset.ind; renderBuilding(); openPanel(p); });

  function closePanel(){ panel.classList.remove('on'); }
  function renderBuilding(){                               // (пере)поставить здание выбранного промысла на уже посчитанное место
    if(curBld){ pv.remove(curBld); curBld.traverse(c=>{ if(c.geometry) c.geometry.dispose(); }); curBld=null; }

    const avg=edgeAvgTr(destHex), L=pathLenHex(destHex);
    const grade=Math.max(natGrade(avg), paved||0), speed=GRADE_SPEED[grade];
    const T=Math.max(1, Math.ceil(L/speed));                     // ходов на доставку
    const rq=Math.min(1, 0.3+grade*0.12);                        // качество 0..1 для расчёта потерь
    return { L, grade, gradeName:GRADE_NAME[grade], speed, T, rq };
  }
  function deliv(r){                                              // доставка промысла: {T, eta, frac, ...}
    const th=hexOfWorld(r.bx,r.bz), ri=roadInfo(th>=0?th:r.cx, r.paved);
    let loss=Math.min(0.7, ri.L*0.03*(1-0.6*ri.rq))*sciMods.spoil;  // потери в пути
    if(PLAYER.leaderId==='peter1') loss*=0.85;                    // Пётр I: флот и верфи — в дороге теряем меньше
    if(r.res!=='еда') loss*=0.2;                                 // руда/камень почти не портятся
    const eta=Math.max(0.3, 1-loss);                             // доля, что доходит
    const ramp=Math.min(1, (r._age||0)/ri.T);                    // «труба» наполняется: далёкая новая шахта отдаёт не сразу
    return Object.assign(ri, { eta, ramp, frac: eta*ramp });
  }
  function foodDeliveredPerTurn(){ let f=0; INDUSTRIES.forEach(r=>{ if(r.res==='еда') f+=r.perTurn*deliv(r).frac; }); return Math.round(f); }
  function paveRoad(r){                                          // мостить дорогу к промыслу «по приказу» за казну
    const th=hexOfWorld(r.bx,r.bz), ri=roadInfo(th>=0?th:r.cx, r.paved);
    const next=Math.max(3, ri.grade+1); if(next>6) return;
    if(epIdxNow()<GRADE_MIN_EP[next]) return;                    // эпоха ещё не даёт этот грейд
    const cost=Math.round(ri.L*7*(next-2)*(PLAYER.leaderId==='napoleon'?0.75:1));   // Наполеон: инженеры гвардии — мостить дешевле
    if(money<cost) { if(window.__glog) window.__glog(`Не хватает казны на дорогу (нужно ${cost})`); return; }
    money-=cost; r.paved=next; updateStats();
    if(window.__glog) window.__glog(`Проложена дорога: ${GRADE_NAME[next]} к «${r.name}» (−${cost})`);
    refreshPanels();
  }
  function nextPave(r){                                          // какой грейд доступен замостить сейчас (или null)
    const th=hexOfWorld(r.bx,r.bz), ri=roadInfo(th>=0?th:r.cx, r.paved);
    const next=Math.max(3, ri.grade+1); if(next>6 || epIdxNow()<GRADE_MIN_EP[next]) return null;
    return { grade:next, name:GRADE_NAME[next], cost:Math.round(ri.L*7*(next-2)*(PLAYER.leaderId==='napoleon'?0.75:1)) };
  }
  // ===== ГЛАВНЫЙ ТИК: доставка → рождаемость/смертность → миграция → голод (раз в ход) =====
  // Население считаем ПО ГОДАМ с накоплением (компаундинг) — устойчиво к длинным ходам (40 лет),
  // никого не «уводит в минус». births/deaths — настоящие суммы за все годы хода (большая текучка, малый итог).
  function tick(){ recompute();
    INDUSTRIES.forEach(r=>{ r.total+=r.perTurn; r._age=(r._age||0)+1;       // возраст промысла (для «трубы» доставки и убыли зверя)
      const fr=deliv(r).frac;                                                // до склада доходит столько же, сколько до стола
      if(r.res2 && r.perTurn2){ STORE[r.res2]=(STORE[r.res2]||0)+r.perTurn2*fr; r.total2=(r.total2||0)+r.perTurn2; }
      if(r.res!=='еда'){ STORE[r.res]=(STORE[r.res]||0)+r.perTurn*fr; } });  // камень, дерево и прочие материалы — на склад
    Object.keys(STORE).forEach(k=>STORE[k]=Math.round(STORE[k]*10)/10);
    const cap=LM.find(l=>l.capital); if(!cap){ refreshPanels(); return; }
    // yearsPerTurn теперь ДРОБНОЕ (39.5 в медном веке, 14.9 в средневековье) — эпохи режутся на равное число
    // ходов. Демография считает по ЦЕЛЫМ годам с накоплением, поэтому округляем явно (иначе `y<yr` молча
    // округлял вверх: при 39.5 крутил 40 шагов, при 14.93 — 15).
    const idx=epIdxNow(), yr=Math.max(1, Math.round(yearsPerTurn(turn)));
    // — еда с учётом доставки (потери + лаг); амбар копит излишек и отдаёт в голод —
    const need=capNeed(); let food=foodDeliveredPerTurn();
    // 04.09: излишек копят и ЯМЫ, не только амбар (раньше без амбара излишек пропадал, ямы никогда
    // не пополнялись — вопреки справкам «ямы теряют треть»). Потолок ям ниже: need*2 против need*5.
    if(food>need){ const cp=Math.max(1,need*(cap._hasGranary?5:2));
      cap._store=Math.min(cp,(cap._store||0)+(food-need)*0.5); }
    else if(food<need && (cap._store||0)>0){
      // 27.08-1 ФИКС: запас кормит и БЕЗ амбара (раньше выдача была только «if(_hasGranary)» —
      // город вымирал, сидя на 30 еды стартового дара в ямах). Ямы хуже амбара: треть теряется
      // при выемке (гниль, мыши); с амбаром — без потерь, как раньше.
      const eff=cap._hasGranary?1:0.7;
      const draw=Math.min(cap._store, (need-food)/eff);
      cap._store=Math.round((cap._store-draw)*10)/10; food+=draw*eff; }
    const hunger=need>0?Math.max(0,Math.min(1,(need-food)/need)):0;
    const attract=need>0?Math.max(0,Math.min(1,(food-need)/need)):0;
    cap._food=food; cap._need=need; cap._hunger=hunger; cap._attract=attract;
    // — миграция из деревень + их собственная демография (закон сохранения: сколько пришло — столько убыло) —
    let migrants=0; const log=[];
    const vby=(BIRTH_RATE[idx]+VILLAGE_BIRTH_ADD)/100, vdy=(DEATH_BASE[idx]/100);
    const pull=Math.max(CITY_PULL, attract);                      // город манит и без избытка еды: ремесло, обмен, защита за стенами
    LM.forEach(v=>{ if(v.capital||v.aiCapital) return;              // чужая столица живёт своей жизнью
      const vpop=popOf(v.size); let flow=0;
      if(!decreeClosed && !v.aiOwned){                               // деревня соперника людей нам не отдаёт
        v._news=Math.min(1,(v._news||0)+0.34);                    // «узнать о городе» — разгон за ~3 хода
        const d=Math.hypot(v.x-cap.x, v.z-cap.z);
        const rq=0.40+natGrade(edgeAvgTr(hexOfWorld(v.x,v.z)))*0.12;   // качество дороги для миграции: пол 0.30→0.40 (ранняя целина/тропа не так душит приток)
        flow=MIG_BASE*pull*v._news*(1/(1+0.035*d))*rq;                 // штраф расстояния мягче (0.05→0.035): дальние деревни тоже питают столицу
        flow=Math.max(0, Math.min(flow, vpop*(1-VILLAGE_FLOOR)));  // дробную долю НЕ округляем — копим точно, деревня не пустеет ниже пола
      } else v._news=0;
      let vp=vpop, vb=0, vd=0;
      for(let y=0;y<yr;y++){ const bb=vp*vby, dd=vp*vdy; vb+=bb; vd+=dd; vp=Math.max(10, vp + bb - dd); }   // роды/смерти по годам
      vp=Math.max(10, vp-flow);                                   // и отток в столицу
      v.size=Math.min(capVillageOf(v), sizeOfPop(vp));            // свой потолок: ближние хиреют, дальние дорастают до города
      // сохраняем демографию деревни за ПОСЛЕДНИЙ ход — показывается в карточке по клику (2026-07-09)
      v._births=Math.round(vb); v._deaths=Math.round(vd); v._out=Math.round(flow);
      v._outTo=flow>=0.5 ? (cap.name||'столица') : null;
      v._growLast=popOf(v.size)-vpop;
      if(flow>=0.01){ migrants+=flow; const nr=Math.round(flow); if(nr>0) log.push({name:v.name||'деревня',n:nr}); }
    });
    // — демография столицы (компаундинг по годам) —
    const by=(BIRTH_RATE[idx]/100)*sciMods.birth;
    // «СЫТЫЙ ГОРОД В НУЛЕ» (2026-07-09): пока еды хватает, штраф «городского кладбища» не берём — свой прирост
    // города выходит около нуля (+0.04%/год), и приток мигрантов НАКАПЛИВАЕТСЯ, а не проедается. Начался голод —
    // штраф возвращается и город снова вымирает. Раньше штраф висел всегда → −0.11%/год, и все приезжие уходили в землю.
    const pen=hunger>0 ? CITY_DEATH_PEN[idx] : 0;
    const dy=((DEATH_BASE[idx]+pen+hunger*3)/100)*sciMods.death;   // +голод к смертности
    const before=popOf(cap.size); let p=before, births=0, deaths=0;
    for(let y=0;y<yr;y++){ const bb=p*by, dd=p*dy; births+=bb; deaths+=dd; p=Math.max(10, p+bb-dd); }
    p=Math.max(10, p+migrants);                                   // потолок CAP СНЯТ — путь к мегаполису
    cap.size=sizeOfPop(p);
    cap._births=Math.round(births); cap._deaths=Math.round(deaths); cap._migrants=Math.round(migrants);
    cap._growLast=popOf(cap.size)-before;
    if(!cap._migLog) cap._migLog=[];
    log.forEach(e=>cap._migLog.push({name:e.name,n:e.n,turn}));
    cap._migLog=cap._migLog.filter(e=>e.turn>turn-3);            // держим последние 3 хода
    aiTurn(idx, yr);                                             // и ход соперника — в тех же годах и той же эпохе
    sciTick(cap, hunger);                                        // §15: опыт наук капает от занятий этого хода
    recompute();                                                 // 27.08-8: население за ход изменилось → руки пересобрать (было «67 из 56»)
    if(window.__adv){                                            // §14: проверки советников в конце тика
      const fW=INDUSTRIES.filter(r=>r.res==='еда').reduce((s,r)=>s+r.workers,0);
      const mW=INDUSTRIES.reduce((s,r)=>s+r.workers,0)-fW;
      const fCap=INDUSTRIES.filter(r=>r.res==='еда').reduce((s,r)=>s+r.cells.length*IND[r.ind].per,0);
      window.__adv.tick(cap,{ food, need, hunger, fW, mW, fCap,
        matStock:(STORE['камень']||0)+(STORE['древесина']||0) });
    }
    refreshPanels(); }

  // — подсветка клеток промысла лентой по краю (как контур осмотра), пока панель открыта —
  function clearHL(){ while(hlg.children.length){ const o=hlg.children[hlg.children.length-1]; if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); hlg.remove(o); } }
  function highlight(cells,col){ clearHL(); const set=new Set(cells), pos=[], W=0.30, y=(x,z)=>hAt(x,z)+0.16;
    const rib=(ax,az,bx,bz)=>{ let px=-(bz-az),pz=(bx-ax); const pl=Math.hypot(px,pz)||1; px=px/pl*W; pz=pz/pl*W;
      const a1x=ax+px,a1z=az+pz,a2x=ax-px,a2z=az-pz,b1x=bx+px,b1z=bz+pz,b2x=bx-px,b2z=bz-pz;
      pos.push(a1x,y(a1x,a1z),a1z,a2x,y(a2x,a2z),a2z,b1x,y(b1x,b1z),b1z, a2x,y(a2x,a2z),a2z,b2x,y(b2x,b2z),b2z,b1x,y(b1x,b1z),b1z); };
    cells.forEach(j=>{ const hj=hexes[j], cor=hexCorners(hj.x,hj.z);
      HN.forEach(([dq,dr],d)=>{ const nk=key(hj.q+dq,hj.r+dr); if(hexIdx.has(nk)&&set.has(hexIdx.get(nk))) return;
        const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]]; rib(A[0],A[1],B[0],B[1]); }); });
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    const mm=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.92,depthTest:false,side:THREE.DoubleSide}));
    mm.renderOrder=7; hlg.add(mm); }

  const FURROW_ROWS=(h,j,cb)=>{                             // обход точек внутри гекса j: (wx,wz,a,b)

  function decoSoil(rec, parent=built){                     // борозды (валики вспаханной земли)

        const nx=hAt(wx-0.4,wz)-hAt(wx+0.4,wz), nz=hAt(wx,wz-0.4)-hAt(wx,wz+0.4);

  function decoFence(rec, parent=built){ const g=new THREE.Group();   // изгородь: жерди и сваи — по ОДНОМУ InstancedMesh на тип (2 вызова отрисовки на всю ограду, сколько бы её ни было)

    const XAX=new THREE.Vector3(1,0,0), dir=new THREE.Vector3();

      HN.forEach(([dq,dr],d)=>{ const nk=key(hj.q+dq,hj.r+dr); if(hexIdx.has(nk)&&rec.set.has(hexIdx.get(nk))) return;   // только ВНЕШНИЕ рёбра пятна
        const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]];

        // ЖЕРДЬ ИДЁТ ПО СКЛОНУ (2026-07-12): раньше она лежала строго горизонтально, а столбы стояли на разных
        // высотах → на косогоре жердь висела в воздухе или врезалась в землю. Теперь соединяем ВЕРШИНЫ столбов:
        // направление жерди — вектор от A к B с учётом перепада высот, длина — с учётом этого же перепада.
        [0.42,0.22].forEach(hy=>{
