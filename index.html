          const len=dir.length(); dir.normalize();
          q.setFromUnitVectors(XAX, dir); sc.set(len,1,1);
          pos.set(mx,(yA+yB)/2+hy,mz);
          rails.push(new THREE.Matrix4().compose(pos,q,sc)); });
        [A,B].forEach(P=>{ const kk=Math.round(P[0]*8)+'_'+Math.round(P[1]*8); if(seen.has(kk))return; seen.add(kk);
          pos.set(P[0],hAt(P[0],P[1])+0.31,P[1]); posts.push(new THREE.Matrix4().compose(pos,I,ONE)); }); }); });
    const im=(geo,mats)=>{ const m=new THREE.InstancedMesh(geo,woodM,Math.max(1,mats.length)); mats.forEach((mx,i)=>m.setMatrixAt(i,mx)); m.instanceMatrix.needsUpdate=true; m.castShadow=true;
      m.userData.farHide=true; m.visible=!window.__farMode;   // изгородь на дальнем зуме гасим
      g.add(m); };
    im(railG,rails); im(postG,posts);
    rec.deco=g; parent.add(g); return g; }
  function decoCrops(rec, parent=built){   // ПАШНЯ = ростки РЯДАМИ по гребням борозд. ОДИН InstancedMesh на ростки
    const green=new THREE.MeshStandardMaterial({color:0x6fbf3f,roughness:0.85});   // ярче прежнего 0x4f8f34
    const bladeG=new THREE.ConeGeometry(0.06,0.42,4), UP=new THREE.Vector3(0,1,0); // выше прежнего (0.26)
    const M=[], q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), pos=new THREE.Vector3(), tmp=new THREE.Vector3();
    rec.cells.forEach(j=>{ const h=hexes[j];
      FURROW_ROWS(h,j,(wx,wz,a,b)=>{ if(b&1) return;         // ростки — на валиках, как в поле
        const nx=hAt(wx-0.4,wz)-hAt(wx+0.4,wz), nz=hAt(wx,wz-0.4)-hAt(wx,wz+0.4);           // уклон земли → нормаль
        q.setFromUnitVectors(UP, tmp.set(nx,1.6,nz).normalize());                            // наклон по склону тайла
        q.multiply(new THREE.Quaternion().setFromAxisAngle(UP, a+b*1.7));                    // лёгкий разворот вокруг своей оси
        pos.set(wx, hAt(wx,wz)+0.24, wz);                                                    // на гребне валика
        M.push(new THREE.Matrix4().compose(pos,q,sc)); }); });
    if(window.__cutGrassCells) window.__cutGrassCells(rec.cells);   // пашня = трава с клеток выкошена (заказ 2026-07-18)
    const soil=decoSoil(rec, parent);                       // сперва борозды, ростки поверх них
    const inst=new THREE.InstancedMesh(bladeG, green, Math.max(1,M.length));
    M.forEach((m,i)=>inst.setMatrixAt(i,m)); inst.instanceMatrix.needsUpdate=true; inst.castShadow=true;
    inst.userData.farHide=true; inst.visible=!window.__farMode;   // ростки на дальнем зуме гасим (борозды-валики остаются — поле видно)
    rec.deco=inst; parent.add(inst); return {soil,inst}; }

  // ===== УКРАШЕНИЕ ДЕРЕВЕНЬ (2026-07-09) =====
  // У деревни, рядом с центром которой есть луг: одна клетка под пастбище, одна под пашню. Есть вода — ещё причал.
  // Это ЧИСТО декорация, не настоящее угодье: когда деревня становится нашей (столица/присоединение),
  // всё это ИСЧЕЗАЕТ — иначе игрок примет украшение за готовый промысел. (Прямое требование пользователя.)
  const VDECO=[];                                            // VDECO[i] = группа декора деревни i
  function clearVillageDecorInner(i){
    const g=VDECO[i]; if(!g) return;
    scene.remove(g); g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); VDECO[i]=null;
  }
  function villageDecorAll(){
    for(let i=0;i<LM.length;i++){
      const lm=LM[i];
      if(lm.capital||lm.aiCapital){ clearVillageDecorInner(i); continue; }  // столица — украшения долой
      // если игрок заложил промысел ПОВЕРХ клеток декора — снести декор и нарисовать заново (вариант «А»)
      if(VDECO[i] && (VDECO[i].userData.cells||[]).some(c=>occupiedHex.has(c))) clearVillageDecorInner(i);
      if(VDECO[i]) continue;                                  // уже нарисовано
      const ci=hexOfWorld(lm.x,lm.z); if(ci<0) continue;
      const h0=hexes[ci], meadow=[], water=[];
      HN.forEach(([dq,dr])=>{ const nk=key(h0.q+dq,h0.r+dr); if(!hexIdx.has(nk)) return;
        const ni=hexIdx.get(nk); if(occupiedHex.has(ni)) return;      // на НАШЕЙ пашне декор не рисуем
        const hh=hexes[ni], b=biomeAt(hh.x,hh.z);
        if(b===B_MEADOW) meadow.push(ni); else if(b===B_WATER) water.push(ni); });
      if(!meadow.length && !water.length) continue;
      const g=new THREE.Group(); scene.add(g); VDECO[i]=g;
      g.userData.cells=[meadow[0],meadow[1],water[0]].filter(c=>c!==undefined);
      if(meadow[0]!==undefined){                              // 1 клетка — пастбище (изгородь)
        const cells=[meadow[0]]; decoFence({cells,set:new Set(cells)}, g); }
      if(meadow[1]!==undefined){                              // 1 клетка — пашня (пахота + ростки)
        const cells=[meadow[1]]; decoCrops({cells,set:new Set(cells)}, g); }
      if(water[0]!==undefined){                               // причал у воды: тот же, что у промысла рыбарей
        const wh=hexes[water[0]], b=IND.fish.build();
        b.position.set((wh.x+lm.x)/2, hAt((wh.x+lm.x)/2,(wh.z+lm.z)/2), (wh.z+lm.z)/2);
        b.rotation.y=Math.atan2(wh.x-lm.x, wh.z-lm.z); b.scale.setScalar(0.6); g.add(b); }
    }
    for(let i=LM.length;i<VDECO.length;i++) clearVillageDecorInner(i);   // сброс мира
  }
  function clearAllVillageDecor(){ for(let i=0;i<VDECO.length;i++) clearVillageDecorInner(i); VDECO.length=0; }

  // — повторный осмотр («Советник осмотрит округу ещё раз») + отмена необязательного осмотра —
  function firstNeeded(){ return INDUSTRIES.length===0; }   // держим ход только пока не заложен ПЕРВЫЙ промысел
  function rescan(){ if(pickingCapital||pickingScience||pickingSurvey||pickingIndustry) return;
    cityP.classList.remove('on'); resP.classList.remove('on'); curRes=null; clearHL(); clearDash();
    pickingSurvey=true; reveal(); }
  function cancelPick(){ if(pickingSurvey||pickingIndustry){ pickingSurvey=false; pickingIndustry=false; clear(); clearPreview(); closePanel();
    if(window.__capital) window.__capital.hideBanner(); } }

  window.__survey={ onCapitalFounded, reveal, nudge, onReset, tick, firstNeeded, rescan, cancelPick, decoFence, decoCrops,
                    villageDecorAll, clearVillageDecor:clearVillageDecorInner, clearAllVillageDecor, pool:laborPool };   // pool — для стенда (05.09)
  // ===== 27.08-8: отладочная ручка «ИИ-игрок» для стенда (tools/ai-play.mjs). На игру не влияет. =====
  // patches(): список угодий вокруг столицы с оценкой каждого промысла ТЕМИ ЖЕ формулами игры (yieldOf/deliv):
  //   {pi, biome, cells, dist, opts:[{ind, res, foodAt(workers), frac(доставка), T(ходов), cap(ёмкость рук)}]}
  // lay(pi, ind): заложить промысел ind на угодье pi — ровно как клик игрока (preview → commit).
  window.__aiDbg={
    survey(){ if(pickingSurvey||pickingIndustry){ pickingSurvey=true; reveal(); } else { rescan(); } return foundPatches.length; },
    patches(){ const cap=LM.find(l=>l.capital); if(!cap) return [];
      return foundPatches.map((p,pi)=>{ const opts=(BIOME_IND[p.r.key]||[]).map(ind=>{
          const meta=INDMETA[ind]; const per=IND[ind].per, capW=p.cells.length*per;
          const rec={ ind, cells:p.cells, set:p.set, cx:p.cx, cz:p.cz, bx:p.cx, bz:p.cz, amp:ampFor(ind,p.r.key), workers:capW, res:meta.res, paved:0, _age:0 };
          const d=deliv(rec); const yFull=yieldOf(rec); rec.workers=Math.round(capW*0.6); const yHalf=yieldOf(rec);
          return { ind, res:meta.res, cap:capW, yFull, y60:yHalf, frac:Math.round(d.frac*100)/100, T:d.T, fert:ind==='farm'?Math.round(fieldFert(rec)*100)/100:null }; });
        const dx=hexes[p.target].x-cap.x, dz=hexes[p.target].z-cap.z;
        return { pi, biome:p.r.key, n:p.cells.length, dist:Math.round(Math.hypot(dx,dz)*10)/10, opts }; }); },
    lay(pi, ind){ const p=foundPatches[pi]; if(!p) return 'нет угодья '+pi;
      if(!(BIOME_IND[p.r.key]||[]).includes(ind)) return 'на '+p.r.key+' нельзя '+ind;
      pickingIndustry=true; preview(p); selInd=ind; renderBuilding(); commit(p);
      foundPatches.splice(pi,1); return 'ок'; },
    state(){ const cap=LM.find(l=>l.capital); if(!cap) return null;
      const byInd={}; INDUSTRIES.forEach(r=>{ const k=r.ind; byInd[k]=byInd[k]||{n:0,w:0,y:0}; byInd[k].n++; byInd[k].w+=r.workers; byInd[k].y+=Math.round(r.perTurn*deliv(r).frac); });
      return { turn, pop:popOf(cap.size), pool:laborPool(), used:INDUSTRIES.reduce((s,r)=>s+r.workers,0),
        food:foodDeliveredPerTurn(), need:capNeed(), store:Math.round(cap._store||0), hunger:Math.round((cap._hunger||0)*100)/100,
        granary:!!cap._hasGranary, sci:{...sciDone}, sciExp:Object.fromEntries(Object.entries(sciExp).map(([k,v])=>[k,Math.round(v)])),
        STORE:{...STORE}, trib:window.__tribFood||0, byInd }; },
    setShare(v){ laborShare=v; allocWorkers(); recompute(); },
    addRes(k,n){ STORE[k]=(STORE[k]||0)+n; return STORE[k]; },   // для отладки на стенде (как __sci.invent)
    tickCity(){ tick(); },                                       // 04.09: полный ход города со стенда (демография+науки), без анимации мира
    inds(){ return INDUSTRIES.map(r=>({ind:r.ind, n:r.cells.length, w:r.workers, y:r.perTurn, age:r._age||0})); }
  };
  // 04.09: дерево для построек вне панели города (частокол в карточке деревни)
  window.__wood={ n:()=>Math.floor(STORE['древесина']||0),
    take:v=>{ if((STORE['древесина']||0)<v) return false; STORE['древесина']=Math.round((STORE['древесина']-v)*10)/10; return true; } };
})();

// ===== 04.09: ЮНИТЫ И НАБЕГИ (GAME-VISION §13, DECISIONS 04.09(2)) =====
// Разведчик (5 еды разово + 2 монеты/ход в походе), дружина (60 монет + 3/ход в походе),
// варвары из гнёзд-стойбищ («маршрут с жадностью», дорог НЕ используют), частокол.
// Управление — гибрид Civ+HoMM: клик по юниту = выбрать → путь и ходы рисуются под курсором,
// клик = пошёл, ESC/клик по юниту = отмена. Правая кнопка не тронута (пан камеры).
(function initUnits(){
  // --- цена шага ДЛЯ НОГ (§13: луг 1, лес 2, холм 2.5, болото 3, переправа +2) — не дорожная BCOST (там лес 55) ---
  const UCOST={[B_MEADOW]:1,[B_STEPPE]:1.1,[B_TUNDRA]:1.5,[B_SAND]:2,[B_FOREST]:2,[B_HILLS]:2.5,[B_SWAMP]:3,[B_MOUNTAIN]:6,[B_ICE]:4};
  const _uc=new Float32Array(NH).fill(-1);
  const uHexCost=i=>{ if(_uc[i]>=0) return _uc[i];
    const b=biomeAt(hexes[i].x,hexes[i].z); _uc[i]=(b===B_WATER)?1e9:(UCOST[b]??2); return _uc[i]; };
  const ngrade=avg=>avg<0.2?0:avg<0.5?1:2;                      // целина→тропа→грунтовка (копия natGrade — та в другом замыкании)
  function stepCost(i,j,useRoads){
    let c=uHexCost(j); if(c>=1e9) return 1e9;
    if(useRoads){ const e=edgeOf(i,j);                          // дорога ЗАМЕНЯЕТ цену клетки — только нашим (§13)
      // 05.09: дороги-«магниты» (вердикт «плывёт по прямой»): тропа 0.5, грунтовка 0.35, мощёная 0.25
      // (было 0.7/0.5, а 3-й грейд вовсе игнорировался — маршруты не липли к дорогам)
      if(e>=0){ const g=ngrade(edgeTr[e]); if(g===1)c=Math.min(c,0.5); else if(g===2)c=Math.min(c,0.35); else if(g>=3)c=Math.min(c,0.25); } }
    const ri=riverCross[i]>0, rj=riverCross[j]>0;
    if(ri!==rj) c+=2;                                           // переправа поперёк русла
    return c; }
  const uPath=(src,dst,useRoads)=>((src===dst)?[src]:dijkstra(src,dst,(a,b)=>stepCost(a,b,useRoads)));
  function turnsFor(path,mpMax,useRoads){                       // симуляция шагов: вход в клетку разрешён, пока очки >0 (как в Civ)
    if(!path||path.length<2) return 1;
    let t=1, mp=mpMax;
    for(let k=1;k<path.length;k++){ const c=stepCost(path[k-1],path[k],useRoads);
      if(c>=1e9) return 99;
      if(mp<=0){ t++; mp=mpMax; }
      mp-=c; }
    return t; }
  const HSP=(()=>{ const a=hexAdj[0]&&hexAdj[0][0]; return a!=null?Math.hypot(hexes[a].x-hexes[0].x,hexes[a].z-hexes[0].z):HEX*1.732; })();
  const capLm=()=>LM.find(l=>l.capital);
  const glog=m=>{ if(window.__glog) window.__glog(m); };

  // --- фигурки кодом (05.09: «нелепый конус» заменён): человечек с ногами/руками/головой
  //     на ПОДСТАВКЕ-«фишке» цвета стороны (как миниатюра настолки) — виден на любом фоне ---
  const _mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.82});
  function man(bodyC,capC){ const m=new THREE.Group(); const skin=0xd9b48c;
    for(const s of[-1,1]){ const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.24,6),_mat(0x4a3826));
      leg.position.set(s*0.06,0.12,0); m.add(leg); }
    const body=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.14,0.34,7),_mat(bodyC)); body.position.y=0.40; m.add(body);
    const belt=new THREE.Mesh(new THREE.TorusGeometry(0.125,0.02,5,10),_mat(0x3a2c1a));
    belt.rotation.x=Math.PI/2; belt.position.y=0.30; m.add(belt);
    for(const s of[-1,1]){ const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.035,0.30,6),_mat(bodyC));
      arm.position.set(s*0.155,0.44,0); arm.rotation.z=s*-0.25; m.add(arm); }
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.095,8,8),_mat(skin)); head.position.y=0.68; m.add(head);
    if(capC!=null){ const cap=new THREE.Mesh(new THREE.SphereGeometry(0.104,8,8,0,Math.PI*2,0,Math.PI/2),_mat(capC)); cap.position.y=0.69; m.add(cap); }
    return m; }
  function baseDisc(col,r){ const g=new THREE.Group();                       // подставка-фишка
    const d=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.06,0.09,20),_mat(col)); d.position.y=0.045; g.add(d);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(r,0.028,6,22),new THREE.MeshBasicMaterial({color:0xf2ead6}));
    rim.rotation.x=Math.PI/2; rim.position.y=0.09; g.add(rim); return g; }
  function mkFig(kind){ const g=new THREE.Group();
    if(kind==='scout'){
      g.add(baseDisc(playerColor(),0.34));
      const m=man(0x8a5a2b,0x6e4a20); m.position.y=0.09; g.add(m);           // кожано-охряный — контрастен на зелени
      const staff=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.024,0.86),_mat(0x7a5a34)); staff.position.set(0.2,0.5,0); m.add(staff);
      const bag=new THREE.Mesh(new THREE.SphereGeometry(0.09,7,7),_mat(0xb5905e)); bag.position.set(-0.13,0.42,-0.12); m.add(bag); }
    else if(kind==='warband'){
      g.add(baseDisc(playerColor(),0.5));
      for(let k=0;k<4;k++){ const m=man(playerColor(),0xb08d57);
        m.position.set((k%2)*0.4-0.2,0.09,Math.floor(k/2)*0.4-0.2); g.add(m);
        const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.03,10),_mat(0xe8e2d0));  // светлый щит — кант стороны
        sh.rotation.x=Math.PI/2; sh.position.set(0.14,0.42,0.12); m.add(sh);
        const sp=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.95),_mat(0x7a5a34)); sp.position.set(-0.15,0.55,0); m.add(sp);
        const tip=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.1,6),_mat(0xc9c9c9)); tip.position.set(-0.15,1.06,0); m.add(tip); }
      const bn=banner(0.5, playerColor()); bn.position.set(0,0.09,0); g.add(bn); }
    else {
      g.add(baseDisc(0x7a2d20,0.42));                                        // варвары — тёмно-красная фишка (как их гнездо)
      for(let k=0;k<3;k++){ const m=man(0x2f2620,0x1e1712);
        m.position.set(Math.cos(k*2.1)*0.22,0.09,Math.sin(k*2.1)*0.22); g.add(m);
        const ax=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.5),_mat(0x6e5638)); ax.position.set(0.16,0.5,0); m.add(ax);
        const bl=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.09,0.03),_mat(0x9a9a9a)); bl.position.set(0.16,0.72,0); m.add(bl); } }
    g.userData.farHide=true; g.scale.setScalar(kind==='scout'?2.7:2.3); return g; }

  // --- юниты ---
  const UNITS=[]; const NESTS=[]; let inited=false;
  window.__raidsInfo={ newRaids:0, lastRaidTurn:-1, total:0 };
  function spawn(kind,hex){ const u={kind,hex,path:[],mpMax:kind==='raider'?5:6,mp:kind==='raider'?5:6,str:kind==='warband'?30:(kind==='raider'?14+Math.floor(Math.random()*7):0),
      fig:mkFig(kind), plunder:0, bag:0, fleeing:false, _skipT:-1, _sleep:false };
    scene.add(u.fig); place(u); UNITS.push(u); return u; }
  function place(u){ const h=hexes[u.hex];
    const crowd=UNITS.some(o=>o!==u&&o.hex===u.hex&&o.kind!=='raider');            // разносим ТОЛЬКО когда на клетке двое (иначе смещение сталкивало в воду)
    const o=!crowd?[0,0]:(u.kind==='scout'?[0.62,0.36]:(u.kind==='warband'?[-0.5,-0.3]:[0,0]));
    u.fig.position.set(h.x+o[0], hAt(h.x+o[0],h.z+o[1]), h.z+o[1]); }
  function kill(u){ scene.remove(u.fig); const i=UNITS.indexOf(u); if(i>=0) UNITS.splice(i,1); if(sel===u) deselect(); }
  const unitAt=k=>UNITS.find(u=>u.kind===k);
  const hexDistW=(a,b)=>Math.hypot(hexes[a].x-hexes[b].x, hexes[a].z-hexes[b].z);

  // --- гнёзда-стойбища (§13): в глуши, 10–25 клеток от ближайшего поселения ---
  function initWorldOnce(){ const cap=capLm(); if(inited||!cap) return; inited=true; window.__scoutingOn=true;
    LM.forEach(lm=>{ if(lm.capital||lm.aiCapital) return;
      if(Math.hypot(lm.x-cap.x,lm.z-cap.z)<9*HSP) lm.scouted=true; });   // округа столицы знакома сразу
    const tries=[];
    for(let n=0;n<400;n++){ const i=Math.floor(Math.random()*NH);
      if(isNoTileHex(i)||uHexCost(i)>2.6) continue;
      let dmin=1e9; LM.forEach(lm=>{ const d=Math.hypot(lm.x-hexes[i].x,lm.z-hexes[i].z); if(d<dmin)dmin=d; });
      if(dmin>=10*HSP && dmin<=25*HSP) tries.push({i,dmin}); }
    tries.sort(()=>Math.random()-0.5);
    function mkNest(i){ const fig=new THREE.Group();
      for(let k=0;k<2;k++){ const tn=new THREE.Mesh(new THREE.ConeGeometry(0.5,0.75,7),_mat(0x3d3227)); tn.position.set(k*0.8-0.4,0.37,(k%2)*0.5-0.25); fig.add(tn); }
      const bn=banner(0.7,0x7a2d20); bn.position.set(0.15,0,0.4); fig.add(bn);
      const h=hexes[i]; fig.position.set(h.x,hAt(h.x,h.z),h.z); scene.add(fig);
      NESTS.push({hex:i, fig, sleepUntil:0, nextSpawn:turn+8+Math.floor(Math.random()*5)}); }
    for(const t of tries){ if(NESTS.length>=2) break;
      if(NESTS.some(n=>hexDistW(n.hex,t.i)<15*HSP)) continue;
      mkNest(t.i); }
    if(!NESTS.length){                                          // 05.09: ГАРАНТИЯ гнезда (случай «25 ходов — ни налётчика»:
      const t2=[];                                              // тесная карта, глуши 10–25 клеток нет) — берём самое глухое место
      for(let n=0;n<600;n++){ const i=Math.floor(Math.random()*NH);
        if(isNoTileHex(i)||uHexCost(i)>2.6) continue;
        let dmin=1e9; LM.forEach(lm=>{ const d=Math.hypot(lm.x-hexes[i].x,lm.z-hexes[i].z); if(d<dmin)dmin=d; });
        if(dmin>=6*HSP) t2.push({i,dmin}); }
      t2.sort((a,b)=>b.dmin-a.dmin);
      if(t2.length) mkNest(t2[0].i); }
  }

  // --- разведка: дошёл — открыл деревню ---
  function scoutReveal(u){ LM.forEach(lm=>{ if(lm.capital||lm.aiCapital||lm.scouted) return;
    const h=hexes[u.hex]; if(Math.hypot(lm.x-h.x,lm.z-h.z)<1.2*HSP){ lm.scouted=true;   // 05.09: открытие ВПЛОТНУЮ (было 2.3 — «издалека», вердикт)
      glog(`🥾 Разведчик добрался до «${lm.name||'деревни'}» — теперь мы знаем её нрав и достаток`);
      if(window.__evt){                                          // 05.09: событие по центру — реакция жителей + что узнали; ПОСЛЕ доезда фигурки
        const w=Math.round(ensureWill(lm)), nm=lm.name||'деревня';
        const mood= w>80?`Жители «${nm}» встречают чужака угрюмо: ворота на засов, из-за тына глядят копья. Разговор вышел коротким и колючим.`
          : w>60?`В «${nm}» разведчика встретили настороженно: хлеба не вынесли, но и не прогнали — расспросили, кто таков и чей будет.`
          : w>40?`«${nm}» приняла гостя сдержанно, но по-людски: пустили к костру, расспросили о столице и дорогах.`
          : `В «${nm}» разведчику обрадовались: усадили за стол, наперебой расспрашивали о державе — здесь о нас наслышаны и настроены дружески.`;
        const delay=Math.max(0,(u._animEndAt||0)-performance.now())+60;
        setTimeout(()=>window.__evt({ icon:'🥾', title:`Разведана «${nm}»`,
          html:`${mood}<br><br>Что узнали: жителей <b>${fmtPop(popOf(lm.size))}</b>, нрав — <b>${willWord(w)}</b> (воля ${w}). Теперь с деревней можно говорить: дары, защита, дань — открой её карточку кликом.` }), delay); }
      if(vilPanel&&vilPanel.classList.contains('on')) renderVillage(); } }); }

  // --- набеги: «маршрут с жадностью» (§13) — перевыбор цели каждый ход, богатство ÷ расстояние ---
  function raiderTargets(){ return LM.filter(lm=>!lm.capital&&!lm.aiCapital); }
  function pickTarget(u){ let best=null,bs=0; const h=hexes[u.hex];
    raiderTargets().forEach(lm=>{ const d=Math.hypot(lm.x-h.x,lm.z-h.z); if(d>12*HSP) return;
      let s=popOf(lm.size)/(1+d/HSP); if(lm.palisade) s*=0.5;
      const wb=unitAt('warband');                              // отпор: дружина близ цели — соблазн падает вчетверо
      if(wb && hexDistW(wb.hex,hexOfWorld(lm.x,lm.z))<3*HSP) s*=0.25;
      if(s>bs){ bs=s; best=lm; } });
    return best; }
  function plunder(u,lm){ u.plunder++;
    const need=lm.palisade?4:2;                                 // частокол: +2 хода на грабёж
    if(u.plunder===1) glog(`🔥 Налётчики грабят «${lm.name||'деревню'}»!${lm.palisade?' Частокол держит — есть время на подмогу':''}`);
    if(u.plunder>=need){ u.plunder=0; u.bag++;
      const vp=Math.max(10,popOf(lm.size)*0.86); lm.size=sizeOfPop(vp);   // −14% жителей за разграбление
      if(lm.will!=null) lm.will=Math.min(100,lm.will+8);
      glog(`🔥 «${lm.name||'Деревня'}» разграблена — жители разбежались (−${Math.round(popOf(lm.size)*0.16)} чел)`);
      if(['prot','trib','ours'].includes(lm.rel||'')){ const ri=window.__raidsInfo;
        ri.newRaids++; ri.total++; ri.lastRaidTurn=turn; } } }

  // --- движение по очкам хода (05.09): очки u.mp живут ВЕСЬ ход, приказ выполняется СРАЗУ,
  //     фигурка скользит по клеткам (ANIM); вход в клетку разрешён, пока очки >0 (как Civ) ---
  const ANIM=[]; let animOn=false,_animT=0;
  function figTarget(u){ const h=hexes[u.hex];
    const crowd=UNITS.some(o=>o!==u&&o.hex===u.hex&&o.kind!=='raider');
    const o=!crowd?[0,0]:(u.kind==='scout'?[0.62,0.36]:(u.kind==='warband'?[-0.5,-0.3]:[0,0]));
    return new THREE.Vector3(h.x+o[0], hAt(h.x+o[0],h.z+o[1]), h.z+o[1]); }
  function animateFig(u,pts){ for(let i=ANIM.length-1;i>=0;i--) if(ANIM[i].u===u) ANIM.splice(i,1);
    ANIM.push({u,pts,seg:0,t:0});
    u._animEndAt=performance.now()+(pts.length-1)*160+150;       // когда фигурка ДОЕДЕТ — события прихода ждут этого
    if(!animOn){ animOn=true; _animT=0; requestAnimationFrame(animStep); } }
  function animStep(ts){ if(!_animT)_animT=ts; const dt=Math.min(0.06,(ts-_animT)/1000); _animT=ts;
    const SEG=0.16;                                                        // сек на клетку пути
    for(let i=ANIM.length-1;i>=0;i--){ const a=ANIM[i];
      a.t+=dt/SEG;
      while(a.t>=1 && a.seg<a.pts.length-2){ a.t-=1; a.seg++; }
      if(a.t>=1){ ANIM.splice(i,1); place(a.u); if(sel===a.u) drawSelGfx(); continue; }
      a.u.fig.position.lerpVectors(a.pts[a.seg],a.pts[a.seg+1],a.t); }
    if(ANIM.length) requestAnimationFrame(animStep); else { animOn=false; _animT=0; } }
  function walkNow(u,useRoads){                                            // пройти на остаток очков ЭТОГО хода
    const pts=[u.fig.position.clone()];
    while(u.path.length && u.mp>0){ const nxt=u.path[0], c=stepCost(u.hex,nxt,useRoads);
      if(c>=1e9) { u.path.length=0; break; }
      u.mp-=c; u.hex=nxt; u.path.shift(); pts.push(figTarget(u)); }
    if(pts.length>1) animateFig(u,pts); else place(u);
    if(sel===u){ drawSelGfx(); updUnitCard(); } }
  function stepAlong(u,useRoads){ u.mp=u.mpMax; walkNow(u,useRoads); }     // новый ход: очки восстановлены
  function turnsFrom(path,u,useRoads){                                     // 0 = дойдёт ЭТИМ же ходом
    if(!path||path.length<2) return 0;
    let t=u.mp>0?0:1, mp=u.mp>0?u.mp:u.mpMax;
    for(let k=1;k<path.length;k++){ const c=stepCost(path[k-1],path[k],useRoads);
      if(c>=1e9) return 99;
      if(mp<=0){ t++; mp=u.mpMax; }
      mp-=c; }
    return t; }
  const capHex=()=>{ const c=capLm(); return c?hexOfWorld(c.x,c.z):-1; };
  function goHome(u){ const ch=capHex(); if(ch>=0){ const p=uPath(u.hex,ch,true); u.path=p?p.slice(1):[]; } }

  // --- бой (вариант А, §13): пыль + две тающие цифры ---
  function dustFx(x,z,aStr,bStr){
    const cnv=document.createElement('canvas'); cnv.width=cnv.height=64;
    const c2=cnv.getContext('2d'); const gr=c2.createRadialGradient(32,32,4,32,32,30);
    gr.addColorStop(0,'#cfc4b0ee'); gr.addColorStop(1,'#cfc4b000'); c2.fillStyle=gr; c2.fillRect(0,0,64,64);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cnv),transparent:true,depthWrite:false}));
    sp.scale.setScalar(3.2); sp.position.set(x,hAt(x,z)+1.1,z); scene.add(sp);
    const t0=performance.now();
    (function fade(){ const k=(performance.now()-t0)/1600;
      if(k>=1){ scene.remove(sp); return; } sp.material.opacity=1-k; sp.scale.setScalar(3.2+k*2); requestAnimationFrame(fade); })();
    const d=document.createElement('div');
    d.style.cssText='position:fixed;left:50%;top:38%;transform:translate(-50%,0);z-index:30;pointer-events:none;font:800 20px system-ui;color:#ffe9c2;text-shadow:0 2px 8px #000;transition:opacity 1.6s,transform 1.6s;';
    d.textContent=`⚔ ${aStr} × ${bStr}`;
    document.body.appendChild(d);
    requestAnimationFrame(()=>{ d.style.opacity='0'; d.style.transform='translate(-50%,-40px)'; });
    setTimeout(()=>d.remove(),1700);
  }
  function battles(){ const wb=unitAt('warband'); if(!wb) return;
    UNITS.slice().forEach(u=>{ if(u.kind!=='raider') return;
      if(hexDistW(wb.hex,u.hex)<=1.2*HSP){
        const dug=wb._sleep, wstr=Math.round(wb.str*(dug?1.25:1));   // 05.09: «окопалась» = +25% в обороне
        const h=hexes[u.hex]; dustFx(h.x,h.z,wstr,u.str);
        if(wstr>=u.str){ wb.str=Math.max(1,Math.round(wb.str-u.str*0.4*(dug?0.75:1))); kill(u);
          glog(`⚔ Дружина разбила налётчиков (сила ${wb.str}); добыча отбита`);
          if(wb.str<10){ glog('⚔ Дружина потрёпана — отходит в столицу набираться сил'); goHome(wb); } }
        else { u.str=Math.max(1,Math.round(u.str-wb.str*0.6)); kill(wb);
          glog('⚔ Дружина полегла в сече… Налётчики уходят с добычей'); } } }); }

  // --- ход юнитов (зовётся из advanceEconomy) ---
  function tick(){ initWorldOnce(); const cap=capLm(); if(!cap) return;
    const ch=capHex();
    UNITS.forEach(u=>{ if(u.kind==='raider') return;                     // — наши: жалованье в походе (§ реш. 04.09)
      const home=(u.hex===ch), upkeep=u.kind==='scout'?2:3;
      if(!home){ if(money>=upkeep) money-=upkeep;
        else if(!u._broke){ u._broke=true; goHome(u); glog(u.kind==='scout'?'🥾 Казна пуста — разведчик бредёт домой':'⚔ Казна пуста — дружина возвращается'); } }
      else { u._broke=false; if(u.kind==='warband'&&u.str<30) u.str=Math.min(30,u.str+5); }
      stepAlong(u,true);
      if(u.kind==='scout') scoutReveal(u); });
    battles();                                                           // ПЕРЕХВАТ: дружина настигла — налётчик не успевает сбежать
    NESTS.forEach(n=>{ if(turn<n.sleepUntil) return;                     // — гнёзда: спавн налётчиков
      const wb=unitAt('warband');
      if(wb && wb.hex===n.hex){ n.sleepUntil=turn+30; glog('⚔ Дружина разорила стойбище налётчиков — набеги оттуда стихнут надолго'); return; }
      if(turn>=n.nextSpawn && !UNITS.some(u=>u.kind==='raider'&&u._nest===n)){
        const r=spawn('raider',n.hex); r._nest=n; n.nextSpawn=turn+10+Math.floor(Math.random()*7);
        glog('👁 В глуши зашевелилось стойбище — по деревням пойдёт лихой люд'); } });
    UNITS.slice().forEach(u=>{ if(u.kind!=='raider') return;             // — варвары: жадный маршрут, без дорог
      const wb=unitAt('warband');
      if(wb && hexDistW(wb.hex,u.hex)<=3*HSP && wb.str>u.str) u.fleeing=true;
      if(u.fleeing||u.bag>=2){ const p=uPath(u.hex,u._nest.hex,false); u.path=p?p.slice(1):[];
        stepAlong(u,false);
        if(u.hex===u._nest.hex){ kill(u); } return; }
      let t=pickTarget(u);
      if(!t){ // цели в «слухе» нет — идёт НАПРАВЛЕНИЕМ к ближайшей деревне вообще (§13: направление + перевыбор по пути)
        let bd=1e9; const h=hexes[u.hex];
        raiderTargets().forEach(lm=>{ const d=Math.hypot(lm.x-h.x,lm.z-h.z); if(d<bd){ bd=d; t=lm; } });
        if(!t){ const p=uPath(u.hex,u._nest.hex,false); u.path=p?p.slice(1):[]; stepAlong(u,false); if(u.hex===u._nest.hex) kill(u); return; } }
      const th=hexOfWorld(t.x,t.z);
      if(u.hex===th || hexDistW(u.hex,th)<=1.2*HSP){ plunder(u,t); }
      else { const p=uPath(u.hex,th,false); u.path=p?p.slice(1):[]; stepAlong(u,false);
        if(u.hex===th||hexDistW(u.hex,th)<=1.2*HSP) plunder(u,t); } });
    battles();
    drawSelGfx(); updUnitCard();
    if(window.__updEnd) window.__updEnd();                       // 05.09: пересчитать «дела» на кнопке «Конец хода»
  }

  // --- найм (кнопки в панели города) ---
  function hire(kind){ const cap=capLm(); if(!cap) return false; const ch=capHex();
    if(kind==='scout'){ if(unitAt('scout')) return false;
      if((cap._store||0)<5){ glog('🥾 Не из чего собрать котомку — нужно 5 еды в запасе'); return false; }
      cap._store=Math.round((cap._store-5)*10)/10; select(spawn('scout',ch)); updateStats();
      glog('🥾 Разведчик снаряжён (−5 еды). В походе — 2 монеты/ход жалованья. Кликни по нему и укажи путь'); return true; }
    if(kind==='warband'){ if(unitAt('warband')) return false;
      if(money<60){ glog('⚔ Не хватает казны на дружину (нужно 60)'); return false; }
      money-=60; select(spawn('warband',ch)); updateStats();
      glog('⚔ Дружина собрана (−60). В походе — 3 монеты/ход содержания'); return true; }
    return false; }
  function hireButtons(CBTN,gi){ const cap=capLm(); if(!cap) return '';
    const sc=unitAt('scout'), wb=unitAt('warband'); const ch=capHex(); let h='';
    h+= sc? `<div class="line" style="opacity:.75;font-size:11.5px">${gi('eye',13)}<span class="k">разведчик ${sc.hex===ch?'дома':'в походе · −2 монеты/ход'}</span></div>`
      : `<button class="cbtn" data-a="scout" style="${CBTN}${(cap._store||0)>=5?'':';opacity:.62'}">${gi('eye',14)} Снарядить разведчика (−5 еды)</button>`;
    h+= wb? `<div class="line" style="opacity:.75;font-size:11.5px">${gi('fort',13)}<span class="k">дружина (сила ${wb.str}) ${wb.hex===ch?'у стен':'в походе · −3 монеты/ход'}</span></div>`
      : `<button class="cbtn" data-a="warband" style="${CBTN}${money>=60?'':';opacity:.62'}">${gi('fort',14)} Собрать дружину (−60)</button>`;
    return h; }

  // --- управление: клик = выбрать; путь под курсором; клик = пошёл; ESC = отмена ---
  let sel=null, prevHex=-1, prevPath=null;
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.0,1.28,32), new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:0.95,depthWrite:false,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.visible=false; ring.renderOrder=5; scene.add(ring);
  ring.onBeforeRender=()=>{ const t=performance.now()*0.003; const s=1+0.07*Math.sin(t*2); ring.scale.set(s,s,s); };   // мягкая пульсация вместо конуса-маркера
  const routeGrp=new THREE.Group(); routeGrp.renderOrder=9; scene.add(routeGrp);   // маршрут — плотный пунктир (05.09: «точек надо больше»)
  const dotGeo=new THREE.CylinderGeometry(0.12,0.12,0.05,10);
  const dotMat=new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:0.95,depthWrite:false,depthTest:false});   // сквозь лес и холмы, как в Civ
  function clearRoute(){ while(routeGrp.children.length) routeGrp.remove(routeGrp.children[routeGrp.children.length-1]); }
  function drawRoute(path){ clearRoute(); if(!path||path.length<2) return;
    const STEP=1.15;                                            // точка каждые ~треть клетки
    for(let k=1;k<path.length;k++){ const a=hexes[path[k-1]], b=hexes[path[k]];
      const len=Math.hypot(b.x-a.x,b.z-a.z), n=Math.max(1,Math.round(len/STEP));
      for(let s=1;s<=n;s++){ const t=s/n, x=a.x+(b.x-a.x)*t, z=a.z+(b.z-a.z)*t;
        const d=new THREE.Mesh(dotGeo,dotMat); d.position.set(x,hAt(x,z)+0.22,z); d.renderOrder=9; routeGrp.add(d); } } }
  const unitCard=document.createElement('div');                // карточка юнита (внизу слева, как в Civ)
  unitCard.id='g-unit';
  unitCard.style.cssText='position:fixed;left:210px;bottom:12px;z-index:22;display:none;background:#12233af2;color:#ffe9c2;padding:11px 15px;border-radius:13px;font:600 13px system-ui;box-shadow:0 4px 14px #0008;min-width:195px;user-select:none;';   // left 210 — не закрывать мини-карту
  document.body.appendChild(unitCard);
  const UBTN='border:0;border-radius:8px;padding:6px 10px;color:#fff;cursor:pointer;font:700 12px system-ui;';
  function updUnitCard(){ if(!sel){ unitCard.style.display='none'; if(window.__updEnd)window.__updEnd(); return; }
    const nm=sel.kind==='scout'?'Разведчик':'Дружина';
    const up=sel.kind==='scout'?2:3, home=sel.hex===capHex();
    const restLbl = sel._sleep ? 'Разбудить' : (sel.kind==='warband'?'Окопаться':'Спать');
    unitCard.innerHTML=`<div style="display:flex;gap:13px;align-items:flex-start">
      <div style="flex:0 0 auto;padding-top:2px">${GI(sel.kind==='scout'?'eye':'fort',48,'#ffe1a0')}</div>
      <div>
        <div style="font-size:16.5px;font-weight:800;color:#ffe1a0;margin-bottom:5px">${nm}${sel._sleep?` <span style="font-size:11.5px;opacity:.75">· ${sel.kind==='warband'?'окопалась':'спит'}</span>`:''}</div>
        ${sel.kind==='warband'?`<div class="ur">сила: <b>${sel.str}</b>${sel._sleep?' <span style="color:#9fe0a8">+25% в обороне</span>':''}</div>`:''}
        <div class="ur">очки хода: <b>${Math.max(0,Math.round(sel.mp*10)/10)} / ${sel.mpMax}</b></div>
        <div class="ur">содержание: ${home?'дома — бесплатно':up+' монеты/ход'}</div>
        ${sel.path.length?`<div class="ur">в пути: ещё ${sel.path.length} клет.</div>`:''}
      </div></div>
      <div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">
        <button data-u="home" style="${UBTN}background:#3f6b8f">Домой</button>
        <button data-u="skip" style="${UBTN}background:#6b4a2f">Пропустить ход</button>
        <button data-u="rest" style="${UBTN}background:#4a5a3f">${restLbl}</button>
        <button data-u="x" style="${UBTN}background:#485262">✕</button></div>
      <div style="opacity:.6;margin-top:6px;font-weight:400;font-size:11.5px">кликни клетку — пойдёт · ESC — снять выбор</div>`;
    unitCard.style.display='block';
    unitCard.querySelector('[data-u=home]').onclick=()=>{ if(!sel) return; sel._sleep=false; goHome(sel); walkNow(sel,true); };
    unitCard.querySelector('[data-u=skip]').onclick=()=>{ if(!sel) return; sel._skipT=turn; deselect(); };   // на этот ход из списка дел
    unitCard.querySelector('[data-u=rest]').onclick=()=>{ if(!sel) return; sel._sleep=!sel._sleep; if(sel._sleep) sel.path.length=0; drawSelGfx(); updUnitCard(); };
    unitCard.querySelector('[data-u=x]').onclick=()=>deselect();
    if(window.__updEnd)window.__updEnd(); }
  const updSelHud=updUnitCard;                                 // старое имя — на карточку
  // 05.09: число ходов ВПИСАНО в клетку-цель — плоский спрайт на тайле с мягкой тёмной подложкой
  const tcv=document.createElement('canvas'); tcv.width=256; tcv.height=256;
  const ttx=new THREE.CanvasTexture(tcv);
  const badge=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.7),
    new THREE.MeshBasicMaterial({map:ttx,transparent:true,depthWrite:false,depthTest:false}));
  badge.rotation.x=-Math.PI/2; badge.visible=false; badge.renderOrder=10; scene.add(badge);
  function hideBadge(){ badge.visible=false; }
  function badgeAtHex(i,big,small){ const h=hexes[i], c=tcv.getContext('2d');
    c.clearRect(0,0,256,256);
    const gr=c.createRadialGradient(128,128,18,128,128,118);
    gr.addColorStop(0,'rgba(9,20,38,0.80)'); gr.addColorStop(1,'rgba(9,20,38,0)');
    c.fillStyle=gr; c.fillRect(0,0,256,256);
    c.fillStyle='#ffe9c2'; c.textAlign='center';
    c.font='800 112px system-ui'; c.fillText(big,128,small?138:170);
    if(small){ c.font='700 38px system-ui'; c.fillText(small,128,192); }
    ttx.needsUpdate=true;
    badge.position.set(h.x,hAt(h.x,h.z)+0.32,h.z); badge.visible=true; }
  function drawSelGfx(){ if(!sel){ ring.visible=false; clearRoute(); return; }
    const p=sel.fig.position;
    ring.position.set(p.x,p.y+0.14,p.z); ring.visible=true;
    drawRoute([sel.hex,...sel.path]); }                        // оставшийся путь юнита виден всегда
  function deselect(){ sel=null; ring.visible=false; clearRoute(); hideBadge(); prevHex=-1; prevPath=null; updSelHud(); }
  function select(u){ sel=u; drawSelGfx(); updSelHud();
    if(window.__closeCity) window.__closeCity();               // 05.09: выбор юнита закрывает панели — не дублируемся
    if(typeof closeVillage==='function') closeVillage(); }
  // — 05.09: дела хода и приказы извне —
  window.__unitDuties=()=>UNITS.filter(u=>u.kind!=='raider' && u.mp>0 && !u.path.length && !u._sleep && u._skipT!==turn);
  window.__unitFocus=u=>{ select(u); const h=hexes[u.hex]; if(typeof controls!=='undefined') controls.target.set(h.x,hAt(h.x,h.z),h.z); };
  window.__unitDesel=()=>{ if(sel) deselect(); };
  window.__unitOrderTo=hex=>{ if(!sel) return false; const p=uPath(sel.hex,hex,true);
    if(p&&p.length>1){ const u=sel; u._sleep=false; u.path=p.slice(1); walkNow(u,true); if(u.kind==='scout') scoutReveal(u); deselect(); }
    return true; };
  window.__upkeepNow=()=>UNITS.filter(u=>u.kind!=='raider'&&u.hex!==capHex()).reduce((a,u)=>a+(u.kind==='scout'?2:3),0);
  window.__scoutEta=lm=>{ const sc=unitAt('scout'); if(!sc||!sc.path.length) return -1;   // идёт ли разведчик к этой деревне и за сколько ходов
    const h=hexes[sc.path[sc.path.length-1]];
    if(Math.hypot(lm.x-h.x,lm.z-h.z)>1.3*HSP) return -1;
    return Math.max(1,turnsFrom([sc.hex,...sc.path],sc,true)); };

  const dom=renderer.domElement, ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  let dX=0,dY=0;
  dom.addEventListener('pointerdown',e=>{ dX=e.clientX; dY=e.clientY; });
  function pickUnit(e){ ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc,camera);
    const own=UNITS.filter(u=>u.kind!=='raider');
    const hit=own.length?ray.intersectObjects(own.map(u=>u.fig),true)[0]:null;
    if(!hit) return null;
    let o=hit.object; while(o && !own.some(u=>u.fig===o)) o=o.parent;

  function pickHex(e){ ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;

  // — карусель «кто на клетке»: город → юниты по кругу (как в Civ). Зовётся из панельного клика (pointerup) ДО открытия панелей.

  function cycleFrom(i){                                         // клик по клетке ВЫБРАННОГО юнита → следующий на клетке
    const us=UNITS.filter(x=>x.kind!=='raider'&&x.hex===i);

    if(capHex()===i){ window.__openCity&&window.__openCity(); }  // круг замкнулся — снова город
    else if(us.length>1) select(us[0]); }
  function tileCycle(i,cityOpen){                                // true = клик наш, панели не открывать
    if(sel) return true;                                         // юнит выбран: клик = приказ ему, разберёт обработчик ниже
    const us=UNITS.filter(x=>x.kind!=='raider'&&x.hex===i);
    if(!us.length) return false;
    if(capHex()===i && !cityOpen) return false;                  // первый клик — город

    if(cycleConsumed){ cycleConsumed=false; return; }            // клик уже разобрала карусель (pointerup)

      walkNow(sel,true);                                        // 05.09: идёт СРАЗУ на остаток очков хода, дальше — по ходам
      if(sel&&sel.kind==='scout') scoutReveal(sel);             // дошёл до деревни этим же ходом — открыть не дожидаясь конца хода
      deselect(); return; }                                     // приказ отдан — выбор снят («резинка» не липнет к курсору)
    deselect(); });

  // --- мостики ---
  window.__units={ tick, hire, hireButtons, has:k=>!!unitAt(k) };
  window.__unitsInit=initWorldOnce;
  window.__unitsDbg={ list:()=>UNITS.map(u=>({kind:u.kind,hex:u.hex,path:u.path.length,str:u.str,bag:u.bag,mp:u.mp,sleep:u._sleep,skip:u._skipT,fleeing:u.fleeing})),
    addMoney:n=>{ money+=n; updateStats(); return money; },        // для отладки на стенде (как __aiDbg.addRes)
    teleport:(k,hex)=>{ const u=UNITS.find(x=>x.kind===k); if(!u) return false; u.hex=hex; u.path=[]; place(u); return true; },
    nests:()=>NESTS.map(n=>({hex:n.hex,sleepUntil:n.sleepUntil,nextSpawn:n.nextSpawn})),
    sendTo:(k,hex)=>{ const u=unitAt(k); if(!u) return 'нет юнита'; const p=uPath(u.hex,hex,true); if(!p) return 'нет пути'; u.path=p.slice(1); return 'ок '+p.length; },
    spawnRaiderNow:()=>{ if(!NESTS.length) return 'нет гнёзд'; const n=NESTS[0]; const r=spawn('raider',n.hex); r._nest=n; return 'ок'; },
    scoutedList:()=>LM.map((lm,i)=>({i,name:lm.name,scouted:!!lm.scouted,rel:lm.rel||null})).filter(v=>!v.name||true),
    hexOfLm:i=>hexOfWorld(LM[i].x,LM[i].z), turnsTo:(k,hex)=>{ const u=unitAt(k); return u?turnsFor(uPath(u.hex,hex,true),u.mpMax,true):-1; } };

  }

  let pickWater=Math.min(50,Math.max(10,(savedMap && savedMap.water)?+savedMap.water:((+urlP.get('water'))||25)));

  let pickMtn=Math.min(2,Math.max(0,(savedMap && savedMap.mtn!=null)?+savedMap.mtn:(urlP.get('mtn')!=null?+urlP.get('mtn'):1)));
  { const mInp=g('g-m-mtn'), mVal=g('g-m-mtnval');

// АВТО-ВОЗОБНОВЛЕНИЕ после «сброса» с новой картой: пришли с ?map=N и есть сохранённая партия →
// восстановить игрока, спрятать меню и построить мир на новой карте (без повторного прохода по меню).
(function resumeAfterReset(){
  try{
    const params=new URLSearchParams(location.search);
    const raw=localStorage.getItem('grad_resume');
    if(params.get('map') && raw){
      localStorage.removeItem('grad_resume');
      const r=JSON.parse(raw);
      if(r && r.player){
        Object.assign(PLAYER, r.player); TAKEN_COLORS = r.taken || [PLAYER.colorId];
        const menu=document.getElementById('g-menu'); if(menu) menu.classList.add('off');
        const sf=document.getElementById('seed'); if(sf) sf.value = r.seed;
        newWorld();
      }
    }
  }catch(e){}
})();

      const a=Math.atan2(off.x,off.z);   // азимут камеры: 0 = камера к югу от цели, взгляд на север
      if(Math.abs(a)<0.01){ off.applyAxisAngle(UPY,-a); toNorth=false; }
      else off.applyAxisAngle(UPY,-a*0.18);   // мягкий доворот, как у lerp камеры хода
      camera.position.copy(controls.target).add(off);
    }
  };
  const startNorth=()=>{ toNorth=true; };
  el.onclick=startNorth;
  addEventListener('keydown',e=>{ if(e.code==='KeyC' && !e.metaKey && !e.ctrlKey && !e.altKey
    && !/INPUT|TEXTAREA/.test((document.activeElement&&document.activeElement.tagName)||'')) startNorth(); });

// ===== МИНИ-КАРТА (21.08-11, заказ «пора в левом нижнем углу делать мини-карту») =====
// Основа — готовый канвас краски земли (groundCvs), уменьшенный в 176 px: рельеф/биомы/пустыня
// видны без пересчёта. Поверх ~2 раза в секунду: точки поселений (столицы цветные, крупнее)
// и золотая рамка взгляда (центр = цель камеры, поворот = азимут). Клик — мгновенный перелёт.
(function initMinimap(){
  const S=176;
  const st=document.createElement('style'); st.textContent=`
    #g-minimap{position:fixed;left:14px;bottom:14px;z-index:9;width:${S}px;height:${S}px;
      border-radius:10px;overflow:hidden;border:1px solid #ffffff2a;box-shadow:0 2px 10px #0006;
      background:#0e1520cc;cursor:pointer}
    #g-minimap canvas{display:block;width:100%;height:100%}`;
  document.head.appendChild(st);
  const box=document.createElement('div'); box.id='g-minimap'; box.title='Мини-карта — клик: перелететь';
  const cv=document.createElement('canvas'); cv.width=cv.height=S; box.appendChild(cv);
  document.body.appendChild(box);
  const ctx=cv.getContext('2d');
  const w2m=w=>(w/SIZE+0.5)*S;   // мировая координата → пиксель мини-карты (y канваса = +z мира: север сверху)
  // 21.08-16: слой ВОДЫ — краска земли рисует под водой светлое дно, и на мини-карте озёра и
  // море выглядели песком. Один раз строим синюю маску по таблице высот (ниже уреза = вода).
  const waterCv=document.createElement('canvas'); waterCv.width=waterCv.height=S;
  { const wc=waterCv.getContext('2d'), im=wc.createImageData(S,S);
    for(let py=0;py<S;py++) for(let px=0;px<S;px++){
      const gx=Math.min(TEX-1,Math.round((px+0.5)/S*TEX)), gy=Math.min(TEX-1,Math.round((py+0.5)/S*TEX));
      if(hArr[gy*TEX+gx]<WATER+0.02){ const o=(py*S+px)*4;
        im.data[o]=63; im.data[o+1]=110; im.data[o+2]=175; im.data[o+3]=225; } }
    wc.putImageData(im,0,0); }
  let tick=0;
  window.__minimapTick=()=>{
    if(++tick%30!==1) return;   // ~2 обновления в секунду — глазу хватает, рендеру не мешает
    ctx.drawImage(groundCvs,0,0,S,S);
    ctx.drawImage(waterCv,0,0);
    for(const l of LM){ const x=w2m(l.x), y=w2m(l.z);
      const cap=l.capital||l.aiCapital;
      ctx.fillStyle = l.capital ? playerCss() : l.aiCapital ? '#c9563e' : 'rgba(240,230,208,0.45)';   // 21.08-15: деревни приглушены («белые точки слишком бросаются в глаза»)
      ctx.beginPath(); ctx.arc(x,y,cap?3.2:1.1,0,6.29); ctx.fill();
      if(cap){ ctx.strokeStyle='#0009'; ctx.lineWidth=1; ctx.stroke(); } }
    const t=controls.target, offX=camera.position.x-t.x, offZ=camera.position.z-t.z;
    const az=Math.atan2(offX,offZ), dist=Math.hypot(offX,camera.position.y-t.y,offZ);
    const half=Math.max(6,dist*0.85)*(S/SIZE);   // грубый охват взгляда: ~дистанции камеры
    ctx.save(); ctx.translate(w2m(t.x),w2m(t.z)); ctx.rotate(-az);
    ctx.strokeStyle='#f4cd7e'; ctx.lineWidth=1.5; ctx.strokeRect(-half,-half*0.72,half*2,half*1.44);
    ctx.restore();
  };
  // 21.08-14 (заказ «гонять мышкой рамку по карте»): не только клик, но и ТАСКАНИЕ —
  // зажал на мини-карте и ведёшь, камера летит следом (pointer capture держит мышь и вне рамки)
  const flyTo=e=>{
    const r=box.getBoundingClientRect();
    const wx=((e.clientX-r.left)/r.width-0.5)*SIZE, wz=((e.clientY-r.top)/r.height-0.5)*SIZE;
    const lim=PLAY-6, cx=Math.max(-lim,Math.min(lim,wx)), cz=Math.max(-lim,Math.min(lim,wz));
    const dx=cx-controls.target.x, dz=cz-controls.target.z;   // цель и камера смещаются вместе — ракурс сохраняется
    camera.position.x+=dx; camera.position.z+=dz; controls.target.x+=dx; controls.target.z+=dz;
    tick=0;   // ближайший кадр перерисует рамку сразу
  };
  let mmDrag=false;
  box.addEventListener('pointerdown',e=>{ mmDrag=true; try{box.setPointerCapture(e.pointerId);}catch(err){} flyTo(e); });
  box.addEventListener('pointermove',e=>{ if(mmDrag) flyTo(e); });
  box.addEventListener('pointerup',()=>{ mmDrag=false; });
  box.addEventListener('pointercancel',()=>{ mmDrag=false; });
})();

// ===== СЧЁТЧИК НАГРУЗКИ (2026-07-12) =====
// Нужен, чтобы честно сравнивать «до/после» при перерисовке визуала: красота почти всегда стоит кадров.
// Включается адресом ?perf=1 — плашка в правом нижнем углу. Данные наружу: window.__perf (для headless-замера).
//   FPS        — кадров в секунду (ниже 30 — заметные подтормаживания);
//   вызовов    — draw calls: сколько раз за кадр дёргается видеокарта (главный расход, режется инстансингом);
//   треуг.     — сколько треугольников в кадре;
//   тексту́ры   — сколько текстур и геометрий держится в памяти видеокарты.
// BUILD объявлен в начале скрипта (22.08-3: меню и настройки строятся раньше этой строки и показывают версию)

const GPU_NAME=(()=>{ try{ const gl=renderer.getContext();
  const ext=gl.getExtension('WEBGL_debug_renderer_info');

let PERF_ON = new URLSearchParams(location.search).get('perf')==='1' || SETTINGS.perf;   // адрес ?perf=1 ИЛИ галочка в настройках
const perf = { fps:0, fpsMin:1e9, calls:0, tris:0, textures:0, geometries:0, loadMs:0, frames:0 };
window.__perf = perf;
let _pfFrames=0, _pfLast=performance.now(), _pfBox=null;
function _pfEnsureBox(){
  if(_pfBox) return;

  else if(_pfBox) _pfBox.style.display='none'; };
// При постобработке кадр состоит из НЕСКОЛЬКИХ внутренних рендеров (сцена, размытия bloom, вывод),
// а renderer.info сбрасывается на каждом — в счётчике оставался последний (1 вызов, 1 треугольник).

renderer.info.autoReset=false;
function perfTick(){
  perf.frames++; _pfFrames++;
  const ri0=renderer.info;

  ri0.reset();
  const now=performance.now(), dt=now-_pfLast;

  const fps=_pfFrames*1000/dt;
  perf.fps=+fps.toFixed(1);
  if(perf.frames>60 && fps<perf.fpsMin) perf.fpsMin=+fps.toFixed(1);   // первые кадры (прогрев) в минимум не берём
  const ri=renderer.info;

    +`вызовов отрисовки ${perf.calls}\n`
    +`треугольников ${perf.tris.toLocaleString('ru')}\n`
    +`текстур ${perf.textures} · геометрий ${perf.geometries}\n`

const PAN_SPEED=0.5, _panFwd=new THREE.Vector3(), _panRight=new THREE.Vector3(), _panMove=new THREE.Vector3();
function applyPan(){

  const stages=[
    {n:'как есть (стандартные материалы + мягкие тени)', on:()=>{}, off:()=>{}},
