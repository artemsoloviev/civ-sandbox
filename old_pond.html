import { portrait, setMood } from './lib/faces.js?v=2';   // живые портреты лидеров (SVG, рисуются кодом)   // v=7: новая шкала эпох (5000 до н.э., равные ходы по плотности событий)

// ========== сеяный генератор ==========
let _s=1;
function srand(seed){ _s = (seed>>>0) || 1; }
function R(){ _s |= 0; _s = _s + 0x6D2B79F5 | 0;

const ssf=(a,b,x)=>{ const t=THREE.MathUtils.clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

// ========== рельеф ==========
// КАРТА УВЕЛИЧЕНА ВЧЕТВЕРО ПО ПЛОЩАДИ (сторона ×2): 84→168, игровое поле 30→60 (2026-07-09).

const SIZE=168, HALF=SIZE/2, TEX=1024, PLAY=60;
// Озёра: прежнее у центра + два новых. Первые новые центры (−46,34) и (44,−40) я поставил
// не глядя — и УТОПИЛ две стартовые деревни: (−40,34) оказалась в 6 единицах от центра озера
// радиусом 11, (42,−36) — в 4.5 от озера радиусом 10. Одна из них досталась сопернику под
// столицу, и та стояла посреди воды. Новые центры выбраны перебором: ≥16 от любой деревни,
// ≥18 от любой горы. Ниже, в addLM, стоит ещё и страховка: поселение не садится на воду.
const PONDS=[{x:6,z:0,r:9.5},{x:-28,z:46,r:10},{x:28,z:-46,r:9}];
const POND=PONDS[0], WATER=-1.5;
// горный массив — НЕСКОЛЬКО смещённых вершин разной высоты (не один гладкий купол-«прыщ»,
// а рваный хребет из нескольких перекрывающихся бугров, как задний декоративный хребет).

// СКЛАДЫВАЮТСЯ, и только так массив дорастает до снеговой линии (снег начинается с h≈5.6,

// перестали перекрываться: max высота упала 9.34 → 6.62, ярко-белых вершин стало НОЛЬ, а горы
// рассыпались на отдельные тёмные бугры. Смещения внутри хребта (×1.1) и радиусы (×1.35)

const MTN_PEAKS=[
  {x:14.0, z:36.0, a:6.48, r:4.86}, {x:10.1, z:33.3, a:4.86, r:4.05}, {x:17.9, z:38.8, a:5.40, r:4.32}, {x:12.9, z:40.4, a:3.96, r:3.65}, {x:18.4, z:33.8, a:3.60, r:3.51},
  {x:-38.0, z:2.0, a:6.48, r:4.86}, {x:-41.9, z:-0.8, a:4.86, r:4.05}, {x:-34.1, z:4.8, a:5.40, r:4.32}, {x:-39.1, z:6.4, a:3.96, r:3.65}, {x:-33.6, z:-0.2, a:3.60, r:3.51},
  {x:38.0, z:18.0, a:6.48, r:4.86}, {x:34.1, z:15.3, a:4.86, r:4.05}, {x:41.9, z:20.8, a:5.40, r:4.32}, {x:36.9, z:22.4, a:3.96, r:3.65}, {x:42.4, z:15.8, a:3.60, r:3.51},
  {x:-14.0, z:-42.0, a:6.48, r:4.86}, {x:-17.9, z:-44.8, a:4.86, r:4.05}, {x:-10.1, z:-39.3, a:5.40, r:4.32}, {x:-15.1, z:-37.6, a:3.96, r:3.65}, {x:-9.6, z:-44.2, a:3.60, r:3.51},
];
function hAt(x,z){
  let h = 1.15*Math.sin(x*0.13)*Math.cos(z*0.11)
        + 0.75*Math.sin(x*0.07+1.5)*Math.sin(z*0.09+0.5)
        + 0.35*Math.sin(x*0.24+0.3)*Math.cos(z*0.20-0.4);
  const rim=Math.max(0,(Math.max(Math.abs(x),Math.abs(z))-PLAY)/24);   // делитель ×2 вместе с картой — вал по краю той же высоты
  h += rim*rim*5.4*(0.9+0.15*Math.sin(x*0.3)+0.15*Math.cos(z*0.27));
  for(const p of PONDS) h -= 3.4*Math.exp(-Math.pow(Math.hypot(x-p.x,z-p.z)/p.r,2));
  for(const p of MTN_PEAKS) h += p.a*Math.exp(-Math.pow(Math.hypot(x-p.x,z-p.z)/p.r,1.2));
  return h;
}
function wetAt(x,z){
  let w=0.5 + 0.32*Math.sin(x*0.08+1.3)*Math.cos(z*0.09-0.6)
            + 0.18*Math.sin(x*0.19-0.4) + 0.12*Math.cos(z*0.16+0.9);
  return THREE.MathUtils.clamp(w,0,1);
}

// ========== ГЕКС-СЕТКА (flat-top, как Civ6) ==========
const HEX=2.0;                                  // радиус гекса (центр→вершина)
const SQ3=Math.sqrt(3);
function axialToWorld(q,r){ return [HEX*1.5*q, HEX*SQ3*(r+q/2)]; }
function worldToAxial(x,z){
  const q=(2/3*x)/HEX, r=(-1/3*x + SQ3/3*z)/HEX;
  // куб-округление
  let cx=q, cz=r, cy=-cx-cz;
  let rx=Math.round(cx), ry=Math.round(cy), rz=Math.round(cz);
  const dx=Math.abs(rx-cx), dy=Math.abs(ry-cy), dz=Math.abs(rz-cz);
  if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return [rx,rz];
}
const HN=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];   // соседи flat-top
// список гексов в игровой зоне
const hexes=[]; const hexIdx=new Map();
const key=(q,r)=>q+','+r;
for(let q=-28;q<=28;q++)for(let r=-28;r<=28;r++){
  const [x,z]=axialToWorld(q,r);
  if(Math.max(Math.abs(x),Math.abs(z))>PLAY-0.5) continue;
  hexIdx.set(key(q,r), hexes.length);
  hexes.push({q,r,x,z,y:hAt(x,z)});
}
const NH=hexes.length;
function hexOfWorld(x,z){ const [q,r]=worldToAxial(x,z); return hexIdx.has(key(q,r))?hexIdx.get(key(q,r)):-1; }
function hexCorners(cx,cz){ const p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i);
  p.push([cx+HEX*Math.cos(a), cz+HEX*Math.sin(a)]); } return p; }

// ========== биомы / стоимость (нижний непрерывный слой) ==========
const B_WATER=0,B_MEADOW=1,B_FOREST=2,B_SWAMP=3,B_SAND=4,B_HILLS=5,B_MOUNTAIN=6;
// B_HILLS (высоты 1.8–3.2) раньше звался B_TUNDRA (и был 2.4–3.2) — метка врала: полярных зон нет,
// это каменистый пояс вокруг вершины. Цвет земли от классификации не зависит (см. groundColor),
// поэтому картинка не изменилась ни на пиксель — изменилось только, ЧЕМ движок считает клетку.
// ГОРА (>3.2) — НЕ КЛЕТКА: без сетки, без подсветки, без зоны, без промыслов (решено 2026-07-09).
const isNoTile=(x,z)=>biomeAt(x,z)===B_MOUNTAIN;
// по ЦЕНТРУ гекса — ровно так же решает, рисовать ли сетку (см. gridGroup), чтобы «нет сетки»
// и «нет подсветки» совпадали клетка в клетку, а не дёргались у края скалы
const isNoTileHex=i=>i>=0 && biomeAt(hexes[i].x,hexes[i].z)===B_MOUNTAIN;
const biome=new Uint8Array(TEX*TEX);
const cost =new Float32Array(TEX*TEX);
const blocked=new Uint8Array(TEX*TEX);
const baseCol=new Uint8ClampedArray(TEX*TEX*3);
const cw=SIZE/TEX;
const cxi=w=>Math.floor((w+HALF)/SIZE*TEX);
const BCOST={[B_MEADOW]:1.0,[B_HILLS]:2.2,[B_SAND]:3.2,[B_SWAMP]:40.0,[B_FOREST]:55.0,[B_MOUNTAIN]:70.0};
function classify(wx,wz,h){
  if(h<WATER+0.18) return B_WATER;
  const wet=wetAt(wx,wz);
  if(h>3.2) return B_MOUNTAIN;                 // выше — скальная шапка: НЕ клетка (ни сетки, ни подсветки, ни зоны)
  if(h<-0.2) return wet>0.68 ? B_SWAMP : B_SAND;
  if(wet<0.30 && h<1.6) return B_SAND;
  if(wet>0.55 && h<2.0) return B_FOREST;       // лес важнее холма: роща на пологом склоне остаётся рощей
  // ХОЛМЫ: каменистый пояс 1.8–3.2 вокруг вершины. Порог 1.8, а не прежние 2.4 — проверено на карте:
  // при 2.4 холмов всего 8 клеток на 333 и каменоломню ставить почти негде. При 1.8 доступность камня
  // ровно та же, что была у гор (4 поселения из 6 видят камень в осмотре) — старое правило воспроизведено.
  if(h>1.8) return B_HILLS;
  return B_MEADOW;
}
const _sand=new THREE.Color(0xcdb98a),_g1=new THREE.Color(0x6f9f49),_g2=new THREE.Color(0x8fbb5f),
      _rock=new THREE.Color(0x8a8f96),_snow=new THREE.Color(0xeef2f6),
      _forest=new THREE.Color(0x3f6b33),_swamp=new THREE.Color(0x4fa652),_swampWet=new THREE.Color(0x2a8a8a),_tundra=new THREE.Color(0xb3b8ac),
      _lakebed=new THREE.Color(0xbfae86);   // ровное светлое песчаное дно под водой (мягкая отмель, без чёрного ободка) — без болота/леса/травы
const _c=new THREE.Color();
function groundColor(wx,wz,h){
  const wet=wetAt(wx,wz);
  if(h < WATER+0.05){ return _c.copy(_lakebed); }   // клетка под уровнем воды → ровное дно, никаких биомов (запрет местности под озером)
  if(h<-0.5)      _c.copy(_sand).lerp(_g1, ssf(-1.5,-0.5,h));
  else if(h<1.2)  _c.copy(_g1).lerp(_g2, ssf(-0.5,1.2,h));
  else if(h<3.0)  _c.copy(_g2).lerp(_rock, ssf(1.2,3.0,h));
  else            _c.copy(_rock).lerp(_snow, ssf(5.6,8.2,h));
  const midBand=ssf(-0.4,0.0,h)*ssf(2.4,1.8,h);
  _c.lerp(_forest, 0.72*ssf(0.5,0.66,wet)*midBand);
  _c.lerp(_sand,   0.7*ssf(0.36,0.18,wet)*ssf(1.9,1.1,h));
  const low=ssf(0.05,-0.25,h);          // узкая полоса вокруг порога classify() (h<-0.2) — не «растекается» на луг
  const swF=low*ssf(0.64,0.72,wet);     // узкая полоса вокруг порога classify() (wet>0.68)
  _c.lerp(_swamp, 0.85*swF);            // яркая зелень (болото Civ6 — не грязь, а сочная трава с водой)
  if(swF>0.1){                                    // неск. пятен воды на болотный тайл — не растекаются за его границы (как в Civ6)
    const hi=hexOfWorld(wx,wz);
    if(hi>=0){
      const hx=hexes[hi];
      const rnd0=(Math.sin(hx.q*127.1+hx.r*311.7)*43758.5453)%1;
      const ang0=(rnd0<0?rnd0+1:rnd0)*Math.PI*2;
      // много пятен на тайл — пусть сливаются, воды должно быть заметно больше
      const SPREAD=[[0.0, 41.9,17.1,1.7,2.3,-0.9,1.1, 0.60,0.38,0.20],
                    [1.35,9.3,53.1,3.1,-1.4,2.7,0.6,  0.55,0.34,0.18],
                    [2.6, 71.3,29.7,-1.9,3.3,1.3,-2.1,0.62,0.32,0.20],
                    [3.9, 19.1,61.3,2.2,-0.7,1.9,-1.3,0.58,0.30,0.16],
                    [5.1, 37.7,11.9,-2.6,1.1,-1.7,2.4, 0.64,0.28,0.18],
                    [0.7, 53.9,83.1,1.3,2.9,-2.3,0.8,  0.28,0.30,0.15]];
      let poolMax=0;
      for(const [dAng,s3,s4,w1,w2,w3,w4,offR,radBase,radVar] of SPREAD){
        const ang=ang0+dAng+0.5*Math.sin(hx.q*s3+hx.r*s4);   // разброс угла, чтобы не были идеально ровным треугольником
        const rad=radBase+radVar*Math.abs(Math.sin(hx.q*s3*0.7+hx.r*s4*0.7));
        const ox=hx.x+Math.cos(ang)*offR, oz=hx.z+Math.sin(ang)*offR;
        const dx=wx-ox, dz=wz-oz, d=Math.hypot(dx,dz);
        const pang=Math.atan2(dz,dx);
        const wob=1 + 0.35*Math.sin(pang*3+hx.q*w1+hx.r*w2) + 0.2*Math.sin(pang*5-hx.q*w3+hx.r*w4);
        const poolT=1-ssf(rad*0.5*wob,rad*wob,d);
        if(poolT>poolMax) poolMax=poolT;
      }
      _c.lerp(_swampWet, 0.85*swF*poolMax);
    }
  }
  _c.lerp(_sand,   0.6*low*ssf(0.6,0.4,wet));
  if(h>2.4) _c.lerp(_tundra, 0.5*ssf(2.4,3.0,h)*(1-ssf(3.0,3.6,h)));
  return _c;
}
const hashrnd=(s)=>{const x=Math.sin(s*127.1+13.7)*43758.5;return x-Math.floor(x);};
function clamp255(v){ return v<0?0:v>255?255:v; }
// value-noise (не сумма синусов — та даёт клетчатый муар) — для блеска воды и рельефа камня в текстуре.
function noiseHash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function valueNoise2(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const sm=t=>t*t*(3-2*t);
  const u=sm(xf), v=sm(yf);
  const a=noiseHash2(xi,yi), b=noiseHash2(xi+1,yi), c=noiseHash2(xi,yi+1), d=noiseHash2(xi+1,yi+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm2(x,y,octaves){
  let total=0, amp=0.55, freq=1;
  for(let o=0;o<octaves;o++){ total += valueNoise2(x*freq, y*freq)*amp; amp*=0.52; freq*=2.13; }
  return total;
}
function makeNormalMapFromHeight(size, heightFn, strength){
  const h = new Float32Array(size*size);

function pickGoal(not){

  let tot=0; const w=new Array(LM.length);
  for(let i=0;i<LM.length;i++){
    if(i===not){ w[i]=0; continue; }
    const lm=LM[i]; let dist=8; if(from){ dist=Math.hypot(lm.x-from.x, lm.z-from.z); }
    w[i]= lm.size / (dist*dist + 25); tot+=w[i];
  }
  if(tot<=0) return (not+1)%LM.length;
  let r=R()*tot;
  for(let i=0;i<LM.length;i++){ r-=w[i]; if(r<=0 && w[i]>0) return i; }

    for(let i=0;i<lim;i++){ const a=P[i], b=P[(i+1)%n];
      const aox=a.x+a.nx*W, aoz=a.z+a.nz*W, box=b.x+b.nx*W, boz=b.z+b.nz*W;          // старт: внутренний край линии
      const aix=a.x+a.nx*(W+FADE), aiz=a.z+a.nz*(W+FADE);                            // конец: сходит на нет
      const bix=b.x+b.nx*(W+FADE), biz=b.z+b.nz*(W+FADE);
      push(aox,aoz,A0); push(box,boz,A0); push(bix,biz,0);
      push(aox,aoz,A0); push(bix,biz,0);  push(aix,aiz,0);
    } });
  if(gp.length){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(gp,3));
    g.setAttribute('color',   new THREE.Float32BufferAttribute(gc,4));   // 4-й канал = прозрачность вершины
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,
      depthWrite:false,side:THREE.DoubleSide}));
    m.renderOrder=6; zoneGrp.add(m);
  }

  // 4) ТОНКАЯ ЛЕНТА — сама линия границы, по ТОЙ ЖЕ сглаженной кривой, поверх градиента.
  //    Кромки отступают от кривой на ±W вдоль нормали вершины, поэтому на изгибах нет щелей.
  const pos=[];
  const y=(x,z)=>hAt(x,z)+0.20;
  const P3=(x,z)=>pos.push(x,y(x,z),z);
  loops.forEach(L=>{ const P=L.pts, n=P.length, lim=L.closed?n:n-1;
    for(let i=0;i<lim;i++){ const a=P[i], b=P[(i+1)%n];
      const a1x=a.x-a.nx*W, a1z=a.z-a.nz*W, a2x=a.x+a.nx*W, a2z=a.z+a.nz*W;
      const b1x=b.x-b.nx*W, b1z=b.z-b.nz*W, b2x=b.x+b.nx*W, b2z=b.z+b.nz*W;
      P3(a1x,a1z); P3(a2x,a2z); P3(b1x,b1z);
      P3(a2x,a2z); P3(b2x,b2z); P3(b1x,b1z);
    } });
  if(pos.length){
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    // Линия приглушена (2026-07-10): цвет державы, но тусклее — насыщенность −0.18, яркость −0.06,
    // прозрачность 0.85→0.5. Раньше лента «резала» глаз ярче самого градиента.
    const lc=new THREE.Color(col).offsetHSL(0,-0.18,-0.06);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:lc,transparent:true,opacity:0.5,depthWrite:false,side:THREE.DoubleSide}));
    m.renderOrder=7; zoneGrp.add(m);
  }
}

function trySpawn(){
  if(!spawnEnabled || LM.length>=28) return;   // ×2 вместе с картой (площадь ×4, но плотность пусть будет пореже)
  if(spawnGap>0){ spawnGap--; return; }               // ещё не «созрело» новое поселение
  // зона контроля столицы: гекс столицы + радиус (как радиус осмотра +1) — внутри новые деревни НЕ возникают
  const cap=LM.find(l=>l.capital); let capH=-1, capCtrl=0;
  if(cap){ capH=hexOfWorld(cap.x,cap.z); capCtrl=capitalCtrlRadius(cap); }
  const ac=aiCap(); let aiH=-1, aiCtrl=0;                       // зона соперника — тоже занята
  if(ac){ aiH=hexOfWorld(ac.x,ac.z); aiCtrl=capitalCtrlRadius(ac); }
  let bi=-1,bt=0.92;                                  // выше порог — клетка должна быть сильно натоптана
  for(let i=0;i<NH;i++){ if(hexTr[i]<bt) continue;
    const hx=hexes[i].x, hz=hexes[i].z;
    if(biomeAt(hx,hz)===B_MOUNTAIN) continue;           // на горах поселения не возникают
    if(occupiedHex.has(i)) continue;                    // не селимся ПРЯМО на угодье игрока
    if(capH>=0 && hexDist(hexes[capH],hexes[i])<=capCtrl) continue;   // не внутри зоны контроля столицы
    if(aiH >=0 && hexDist(hexes[aiH ],hexes[i])<=aiCtrl ) continue;   // и не внутри зоны соперника
    // буфер в ДВЕ клетки вокруг любого поля игрока (вариант «В»): деревня не лезет вплотную к пашне
    let onField=false;
    for(let dq=-2;dq<=2&&!onField;dq++) for(let dr=Math.max(-2,-dq-2); dr<=Math.min(2,-dq+2); dr++){
      const nk=key(hexes[i].q+dq,hexes[i].r+dr);
      if(hexIdx.has(nk)&&occupiedHex.has(hexIdx.get(nk))){ onField=true; break; } }
    if(onField) continue;
    let near=false;
    for(const lm of LM){ if(Math.hypot(lm.x-hx,lm.z-hz)<13){near=true;break;} }   // дальше от соседей
    if(near) continue; bt=hexTr[i]; bi=i;
  }
  if(bi>=0){ addLM(hexes[bi].x, hexes[bi].z, 1.0); spawnGap=9; }   // ~3 хода паузы после рождения
}

function hash2(x,z){ const s=Math.sin(x*12.9898+z*78.233)*43758.5453; return s-Math.floor(s); }

function ribbon(pts, halfW, mat, lift){
  const n=pts.length, v=[], idx=[];
  for(let i=0;i<n;i++){
    const a=pts[i], p=pts[Math.min(i+1,n-1)], q=pts[Math.max(i-1,0)];
    let dx=p[0]-q[0], dz=p[2]-q[2]; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const wob=0.86+0.28*hash2(a[0]*1.7+i*0.3, a[2]*1.7);   // 0.86..1.14 — лёгкая неровность краёв
    const hw=halfW*wob, px=-dz*hw, pz=dx*hw;
    v.push(a[0]+px, a[1]+lift, a[2]+pz,  a[0]-px, a[1]+lift, a[2]-pz);
  }
  for(let i=0;i<n-1;i++){ const o=i*2; idx.push(o,o+1,o+2, o+1,o+3,o+2); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  g.setIndex(idx); g.computeVertexNormals();

  const m=new THREE.Mesh(g,mm); m.receiveShadow=true; return m;

// Сдвинуть полилинию вбок по локальной нормали на off (для колей), посадив на рельеф.
function offsetPoly(pts, off){
  const out=[], n=pts.length;
  for(let i=0;i<n;i++){
    const p=pts[Math.min(i+1,n-1)], q=pts[Math.max(i-1,0)];
    let dx=p[0]-q[0], dz=p[2]-q[2]; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const x=pts[i][0]+(-dz)*off, z=pts[i][2]+dx*off;

// Сглаживание Чайкина: срезаем углы, РАССЛАБЛЯЯ ломаную (не проходим через каждую точку) —
// убирает «пилу» и зигзаги, в отличие от сплайна, который вильнувшую цепочку раздувал в петли.
function chaikin(pts, iters){
  let p=pts;
  for(let k=0;k<iters;k++){
    const out=[p[0]];
    for(let i=0;i<p.length-1;i++){
      const a=p[i], b=p[i+1];
      out.push([a[0]*0.75+b[0]*0.25, 0, a[2]*0.75+b[2]*0.25]);
      out.push([a[0]*0.25+b[0]*0.75, 0, a[2]*0.25+b[2]*0.75]);
    }
    out.push(p[p.length-1]); p=out;
  }

}
// Плавная линия дороги через центры гексов цепочки, посаженная на рельеф.
function smoothChain(hexSeq){
  if(hexSeq.length<2) return null;
  let pts=hexSeq.map(n=>[hexes[n].x,0,hexes[n].z]);
  const n=pts.length;
  if(n>=3){                                              // пологая «змейка» вдоль пути — не «линейка»
    const seed=hash2(pts[0][0],pts[0][2]);
    const amp=0.40*(0.6+seed);                           // поперечный размах (меньше гекса)
    const ph=seed*6.283, freq=1.4+seed*1.6;              // 1.4..3 мягких волны на перегон
    for(let k=1;k<n-1;k++){
      const a=pts[k+1], b=pts[k-1]; let dx=a[0]-b[0], dz=a[2]-b[2]; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
      const u=k/(n-1);
      const env=Math.sin(u*Math.PI);                     // затухание у обоих концов — к поселению подходит чисто
      const w=Math.sin(u*Math.PI*2*freq+ph)*amp*env;
      pts[k]=[pts[k][0]+(-dz)*w, 0, pts[k][2]+dx*w];
    }

// Собрать «горячие» рёбра (hot[e]) в непрерывные цепочки; отдаём и рёбра цепочки (для толщины).
function traceChains(hot){
  const adj=new Map();
  const push=(n,o,e)=>{ if(!adj.has(n))adj.set(n,[]); adj.get(n).push({o,e}); };
  for(let e=0;e<NE;e++){ if(!hot[e]) continue; push(edges[e].i,edges[e].j,e); push(edges[e].j,edges[e].i,e); }
  const deg=n=>adj.has(n)?adj.get(n).length:0;

    if(used.has(first.e)) return;
    const seq=[start], es=[]; let cur=start, ne=first;
    while(ne && !used.has(ne.e)){
      used.add(ne.e); es.push(ne.e); seq.push(ne.o); cur=ne.o; ne=null;
      if(deg(cur)===2){ for(const nb of adj.get(cur)) if(!used.has(nb.e)){ ne=nb; break; } }
    }
    if(seq.length>=2) chains.push({seq,es});

// --- маршрутизация: чистый путь наименьшей стоимости по гексам (обходит лес/воду) ---
const hexAdj=Array.from({length:NH},()=>[]);
for(let e=0;e<NE;e++){ hexAdj[edges[e].i].push(edges[e].j); hexAdj[edges[e].j].push(edges[e].i); }

for(let i=0;i<NH;i++){                                   // усредняем по 7 точкам — лес честно дорогой
  const cx=hexes[i].x, cz=hexes[i].z; let s=costAt(cx,cz);
  for(let k=0;k<6;k++){ const a=Math.PI/3*k; s+=costAt(cx+Math.cos(a)*HEX*0.62, cz+Math.sin(a)*HEX*0.62); }

function edgeW(i,j){ const c=(hexBaseCost[i]+hexBaseCost[j])*0.5; const use=(hexTr[i]+hexTr[j])*0.5;
  const disc = c>6 ? 0.12 : 0.5;                          // лес/болото натоптанность почти не дешевит

  // сливаются в один ствол вместо двух параллельных троп. На лесу почти не прилипаем (rdisc мал),

const _dist=new Float64Array(NH), _prev=new Int32Array(NH), _done=new Uint8Array(NH);

    for(let i=0;i<NH;i++) if(!_done[i]&&_dist[i]<bd){bd=_dist[i];u=i;}

// Остовное дерево (MST, алгоритм Крускала): соединяем ВСЕ поселения минимально нужным числом

// в принципе: сеть — чистое ветвящееся дерево (ствол → ветки → веточки к деревушкам).
function roadPairs(){
  const n=LM.length; if(n<2) return [];
  const cand=[];

  cand.sort((p,q)=>p[0]-q[0]);                            // от самых коротких пар к длинным
  const par=Array.from({length:n},(_,i)=>i);             // «кто мой корень» (union-find)
  const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };

    const ra=find(a), rb=find(b);

// (использование ~0.68 при зарастании 0.88, ✅ измерено ход 100) дорастают до нормальной дороги.
// Ратчет: только растёт (если карта перегонит эталон), не даёт дорогам «толстеть скачком». Сброс в newWorld.
const ROAD_REF=0.65; let roadRefMax=ROAD_REF;
function growRoads(){                                    // ВЫЗЫВАТЬ раз в ход
  _flow.fill(0);
  for(const [a,b] of roadPairs()){
    const sa=hexOfWorld(LM[a].x,LM[a].z), sb=hexOfWorld(LM[b].x,LM[b].z);
    if(sa<0||sb<0||sa===sb) continue;
    const path=dijkstra(sa,sb); if(!path||path.length<2) continue;
    const dist=Math.hypot(LM[a].x-LM[b].x,LM[a].z-LM[b].z);
    const g=LM[a].size*LM[b].size/(dist*dist+40);        // большие+близкие города = сильнее
    for(let n=0;n<path.length-1;n++){ const e=edgeOf(path[n],path[n+1]); if(e>=0) _flow[e]+=g; }
  }
  for(let e=0;e<NE;e++) roadUse[e]=roadUse[e]*0.88 + _flow[e];   // растёт где ездят, брошенное зарастает за ~25 ходов (было 0.97 ≈ 100)
  let mx=1e-6; for(let e=0;e<NE;e++) if(roadUse[e]>mx) mx=roadUse[e];
  roadUseMax=mx;                                         // для прилипания на следующем ходу
  if(mx>roadRefMax) roadRefMax=mx;                       // эталон толщины ратчетом растёт, если карта перегнала
  hexRoad.fill(0);
  for(let e=0;e<NE;e++){ const v=roadUse[e]/mx;
    if(v>hexRoad[edges[e].i]) hexRoad[edges[e].i]=v;
    if(v>hexRoad[edges[e].j]) hexRoad[edges[e].j]=v; }
}
// Стартовые тропинки: между уже стоящими деревнями протаптываем тонкую сеть ЕЩЁ ДО первого хода.
// Это те же дороги-маршруты (MST + Дейкстра), просто «наезженные» на несколько ходов вперёд —
// поэтому без дублей и развязок (дерево!), а форма/обход леса те же, что у обычного алгоритма.
// Люди сразу тянутся к ним (hexRoad), новые деревни достраиваются нашим алгоритмом поверх.
function seedStarterRoads(){ for(let k=0;k<8;k++) growRoads(); }
// Провести штрих кистью по точкам px (в пикселях текстуры).
function strokePath(px, w, style){
  if(px.length<2) return;
  groundCtx.lineWidth=Math.max(0.6,w); groundCtx.strokeStyle=style;
  groundCtx.beginPath(); groundCtx.moveTo(px[0][0],px[0][1]);
  for(let k=1;k<px.length;k++) groundCtx.lineTo(px[k][0],px[k][1]);
  groundCtx.stroke();
}
// Дороги = ВЫТОПТАННАЯ ЗЕМЛЯ, нарисованная прямо в текстуре грунта (кистью). Каждый ход:
// кладём чистый грунт baseIm, поверх рисуем свежие тропы → они врастают в землю, а не лежат лентой.
function rebuildRoads(){
  groundCtx.putImageData(baseIm,0,0);
  let mx=1e-6; for(let e=0;e<NE;e++) if(roadUse[e]>mx) mx=roadUse[e];
  if(mx>=1e-4){
    const S=TEX/SIZE, ref=roadRefMax, TH=mx*0.05, hot=new Uint8Array(NE);  // порог 5% от текущего макс — слабые «призраки» перекладки не рисуем
    for(let e=0;e<NE;e++) hot[e]= roadUse[e]>=TH ? 1 : 0;
    groundCtx.lineCap='round'; groundCtx.lineJoin='round';
    const toPx=p=>[(p[0]+HALF)*S,(p[2]+HALF)*S];
    for(const ch of traceChains(hot)){
      let f=0; for(const e of ch.es) f+=roadUse[e]; f/=ch.es.length;
      const t=Math.min(1, f/ref);                           // 0..1 — сила дороги ОТНОСИТЕЛЬНО зрелой (не текущей)
      const sm=smoothChain(ch.seq); if(!sm) continue;       // чистая линия, без «червяка»
      const px=sm.map(toPx);
      const core=(0.13+0.62*Math.sqrt(t))*S;                // полная ширина сердцевины (мир·S) — ТОНКО
      strokePath(px, core*1.9, 'rgba(150,126,86,0.18)');    // мягкая обочина (врастает в траву)
      strokePath(px, core,     'rgba(122,98,60,0.85)');     // утоптанная сердцевина
      if(t>=0.6) strokePath(px, core*0.5, 'rgba(96,74,44,0.85)'); // наезженные — тёмное ядро
      // ПРОСЕКА: убрать деревья вдоль тропы, чтобы не «сквозь стоящие деревья»
      const clr=Math.max(0.85, core/S*0.7+0.6);
      for(const p of sm) removeTreesNear(p[0], p[2], clr);
    }
  }
  window.__groundTex.needsUpdate=true;
}

// Держава-соперник рождается ДАЛЕКО от игрока, на другом конце карты, и живёт по своим правилам:
//   1) РАСТЁТ — та же демография по эпохам, что у нас (BIRTH_RATE/DEATH_BASE);
//   2) ТЯНЕТ ЛЮДЕЙ из подчинённых ей деревень (как наш город тянет из своих);
//   3) ПРИСОЕДИНЯЕТ ничейные деревни в пределах досягаемости — раз в несколько ходов, ближайшую.
// Игрок видит его столицу, зону в чужом цвете и запись в летописи о каждом присоединении.

const AI={ active:false, countryId:'fr', colorId:'scarlet', leaderId:'napoleon', capIdx:-1, absorbGap:5, taken:0 };

// соперник выбирает столицу, когда игрок выбрал свою: САМАЯ ДАЛЬНЯЯ деревня (но не ближе 12 клеток)
function aiSpawn(playerCapital){
  aiReset();

  let best=-1, bd=-1;
  LM.forEach((lm,i)=>{ if(lm.capital) return; const hi=hexOfWorld(lm.x,lm.z); if(hi<0) return;
    const d=hexDist(hexes[hi], hexes[pc]); if(d>bd){ bd=d; best=i; } });
  if(best<0 || bd<12) return;                       // слишком тесно — соперника не заводим (не должно случаться на большой карте)
  AI.countryId = PLAYER.countryId==='ru' ? 'fr' : 'ru';
  const free=paletteFor(AI.countryId, TAKEN_COLORS);
  AI.colorId = free.length ? free[0].id : 'scarlet';
  TAKEN_COLORS=[...TAKEN_COLORS, AI.colorId];
  const ls=LEADERS[AI.countryId]; AI.leaderId=ls[(Math.random()*ls.length)|0].id;
  const lm=LM[best]; lm.aiCapital=true; lm.founded=turn; lm._startSize=lm.size;
  lm.name=takeCityName(AI.countryId);                 // столица соперника — древнейший город его нации
  AI.capIdx=best; AI.active=true;

// ход соперника: рост столицы, приток из своих деревень, присоединение ничейной деревни
function aiTurn(idx, yr){
  const cap=aiCap(); if(!cap) return;
  let pop=popOf(cap.size);
  const by=BIRTH_RATE[idx]/100, dy=DEATH_BASE[idx]/100;                 // сытый город — без штрафа «кладбища», как у нас
  for(let y=0;y<yr;y++) pop=Math.max(10, pop*(1+by-dy));
  let mig=0;                                                            // приток из ПОДЧИНЁННЫХ деревень
  LM.forEach(v=>{ if(!v.aiOwned || v.aiCapital) return;
    const dist=Math.hypot(v.x-cap.x, v.z-cap.z);
    const flow=MIG_BASE*CITY_PULL*(1/(1+0.035*dist))*0.7;               // без дорог соперника — поток скромнее нашего
    const take=Math.max(0, Math.min(flow, popOf(v.size)*(1-VILLAGE_FLOOR)));
    v.size=sizeOfPop(Math.max(10, popOf(v.size)-take)); mig+=take; });
  const before=popOf(cap.size);
  cap.size=sizeOfPop(pop+mig); cap._growLast=popOf(cap.size)-before; cap._migrants=Math.round(mig);
  // ПРИСОЕДИНЕНИЕ. Держава тянется не только от столицы, а от ВСЕЙ своей границы: расстояние до
  // ничейной деревни меряем от ближайшего своего поселения. Взяв деревню, соперник получает новый
  // рубеж и оттуда дотягивается дальше — так государство и расползается по карте.
  // В зону нашей столицы соперник не лезет: наш ближний круг за нами (силовой захват — это §12).
  if(--AI.absorbGap<=0){
    const mine=LM.filter(v=>v.aiCapital||v.aiOwned).map(v=>hexOfWorld(v.x,v.z)).filter(h=>h>=0);
    const R=capitalCtrlRadius(cap)+6;                                   // рубеж дотягивания от границы державы
    const pc=LM.find(l=>l.capital); const ph=pc?hexOfWorld(pc.x,pc.z):-1;
    const pR=pc?capitalCtrlRadius(pc):0;
    let best=-1, bd=1e9;
    LM.forEach((v,i)=>{ if(v.capital||v.aiCapital||v.aiOwned) return;
      const hi=hexOfWorld(v.x,v.z); if(hi<0) return;
      if(ph>=0 && hexDist(hexes[hi],hexes[ph])<=pR) return;              // деревня в нашей зоне — не трогает
      let d=1e9; mine.forEach(mh=>{ const dd=hexDist(hexes[hi],hexes[mh]); if(dd<d) d=dd; });
      if(d<bd){ bd=d; best=i; } });
    if(best>=0 && bd<=R){
      LM[best].aiOwned=true; AI.taken++; AI.absorbGap=7;
      if(window.__glog) window.__glog(`${COUNTRIES[AI.countryId].flag} Держава ${COUNTRIES[AI.countryId].gen} присоединила деревню «${LM[best].name}»`);
    } else AI.absorbGap=3;                                              // некого брать — попробуем через 3 хода
  }
}

  // Было 1.2 = ровно 40 чел. у всех. Чем больше людей на карте — тем есть кого переселять в город.
  STARTS_RAW.forEach(([x,z])=>addLM(x,z,sizeOfPop(85+Math.round(trnd()*15))));
  mkAgents(+$('count').value);
  seedStarterRoads();                                    // между стартовыми деревнями уже есть тонкие тропинки
  syncSettlements(); rebuildRoads(); updateBoard(); refreshTime();
  pickingCapital=true;
  if(window.__capital) window.__capital.onReset();       // показать плашку-подсказку внизу, спрятать маркер
  if(window.__science) window.__science.onReset();       // сбросить выбор первой науки на новой карте
  if(window.__survey) window.__survey.onReset();         // убрать контуры осмотра со старой карты
  money=100; sci=0; updateStats();                       // казна и наука с нуля на новой карте
  hud.setState('');
}
// незакрытые обязательные дела текущего хода: пока есть — «Конец хода» не проводит ход,
// а ведёт к незакрытому делу (подсказка + подсветка), как просил пользователь. Расширяемо:
// добавляем сюда новые обязательные действия (основать столицу, назначить и т.п.).
function pendingTask(){
  if(pickingCapital) return { remind(){ if(window.__capital) window.__capital.nudge(); } };
  const firstInd = window.__survey && window.__survey.firstNeeded && window.__survey.firstNeeded();
  if((pickingSurvey||pickingIndustry) && firstInd)   // держим ход только пока не заложен ПЕРВЫЙ промысел; повторный осмотр — по желанию
    return { remind(){ if(window.__survey) window.__survey.nudge(); } };
  if(pickingScience) return { remind(){ if(window.__science) window.__science.nudge(); } };
  return null;
}
function endTurn(){
  if(running) return;
  const pt=pendingTask(); if(pt){ pt.remind(); return; }  // есть незакрытое дело → к нему, ход не начинаем
  if(window.__survey && window.__survey.cancelPick) window.__survey.cancelPick();  // необязательный (повторный) осмотр не начат/не завершён → отменяем, ход идёт
  if(animate){ running=true; remaining=stepsPerTurn; perFrame=Math.max(1, Math.ceil(stepsPerTurn/72));
    hud.setBusy(true); hud.setState('идёт ход…');
  }else{ for(let s=0;s<stepsPerTurn;s++) oneSubstep();
    turn++; advanceEconomy(); growRoads(); syncSettlements(); rebuildRoads(); updateBoard(); refreshTime(); hud.setState('мир замер'); }
}

(function initHover(){
  const BINFO={
    [B_WATER]:['Вода','#3f79c8','гладь'],
    [B_MEADOW]:['Луг','#7fae54','идти легко'],
    [B_FOREST]:['Лес','#3f6b33','почти непроходимо'],
    [B_SWAMP]:['Болото','#4fa652','топко, вязко'],
    [B_SAND]:['Пески','#d7c184','идти тяжело'],
    [B_HILLS]:['Холмы','#9aa08f','камень и щебень'],
    [B_MOUNTAIN]:['Горы','#8a8f96','почти непроходимо'],
  };
  const st=document.createElement('style'); st.textContent=`
    #g-tip{position:fixed;z-index:20;pointer-events:none;min-width:134px;max-width:212px;
      background:#12233af5;color:#eef4fb;border-radius:12px;box-shadow:0 8px 22px #0008;

      transform:translateY(4px);transition:opacity .12s, transform .12s;overflow:hidden}
    #g-tip.on{opacity:1;transform:translateY(0)}

    #g-tip .in{padding:8px 12px 10px}
    #g-tip .ttl{font-size:14px;font-weight:700;letter-spacing:.2px}
    #g-tip .sub{font-size:11.5px;opacity:.72;margin-top:1px}
    #g-tip .row{display:flex;justify-content:space-between;gap:16px;margin-top:5px}
    #g-tip .row .k{opacity:.64} #g-tip .row .v{font-weight:600}
  `;
  const tip=document.createElement('div'); tip.id='g-tip';
  document.head.appendChild(st); document.body.appendChild(tip);

  // подсветка гекса под курсором — шестиугольник, ПРОДРАПИРОВАННЫЙ по рельефу (углы и центр
  // сидят на реальной высоте земли), поэтому закрашивается вся клетка, а не только её низ.
  const hlGeo=new THREE.BufferGeometry();
  hlGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(6*3*3),3));
  const hl=new THREE.Mesh(hlGeo, new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,
    opacity:0.30,depthWrite:false,side:THREE.DoubleSide}));
  hl.renderOrder=4; hl.visible=false; scene.add(hl);
  const _hp=hlGeo.attributes.position.array;
  function drapeHex(i){
    const cx=hexes[i].x, cz=hexes[i].z, lift=0.12;
    const cs=hexCorners(cx,cz), cH=hAt(cx,cz)+lift;
    let o=0;
    for(let k=0;k<6;k++){ const a=cs[k], b=cs[(k+1)%6];
      _hp[o++]=0;       _hp[o++]=cH;                  _hp[o++]=0;
      _hp[o++]=a[0]-cx; _hp[o++]=hAt(a[0],a[1])+lift; _hp[o++]=a[1]-cz;
      _hp[o++]=b[0]-cx; _hp[o++]=hAt(b[0],b[1])+lift; _hp[o++]=b[1]-cz;
    }
    hlGeo.attributes.position.needsUpdate=true; hl.position.set(cx,0,cz);
  }
  // тип местности по БОЛЬШИНСТВУ клетки (а не по одной точке-центру) — метка совпадает с картинкой
  function hexBiome(i){
    const cx=hexes[i].x, cz=hexes[i].z, cnt={};
    const add=(x,z)=>{ const b=biomeAt(x,z); cnt[b]=(cnt[b]||0)+1; };
    add(cx,cz);
    for(let k=0;k<6;k++){ const a=Math.PI/3*k; add(cx+Math.cos(a)*HEX*0.6, cz+Math.sin(a)*HEX*0.6); }
    let best=B_MEADOW, bc=-1; for(const b in cnt) if(cnt[b]>bc){ bc=cnt[b]; best=+b; }
    return best;
  }
  // на клетке РЕАЛЬНО стоит дерево? (точное попадание дерева в этот же гекс) — тогда это лес,
  // даже если по площади большинство луговое; иначе метка «Луг» под торчащим деревом врёт.
  function hexHasTree(i){
    for(const t of TREES){ if(!t.removed && hexOfWorld(t.x,t.z)===i) return true; }
    return false;
  }

  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  function hide(){ tip.classList.remove('on'); hl.visible=false; }
  const dom=renderer.domElement;
  dom.addEventListener('pointerleave', hide);
  dom.addEventListener('pointermove', ev=>{
    ndc.x=(ev.clientX/innerWidth)*2-1; ndc.y=-(ev.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc,camera);
    const hit=ray.intersectObject(terrain,false)[0];
    if(!hit){ hide(); return; }
    const i=hexOfWorld(hit.point.x, hit.point.z);
    if(i<0){ hide(); return; }
    if(isNoTileHex(i)){ hide(); return; }                       // ГОРА — не клетка: ни подсветки, ни подсказки
    drapeHex(i); hl.visible=true;
    let b=hexBiome(i);
    if(b!==B_FOREST && b!==B_WATER && hexHasTree(i)) b=B_FOREST;   // торчит дерево → лес
    const [bn,bc,bd]=BINFO[b]||BINFO[B_MEADOW];
    const lm=LM.find(l=>hexOfWorld(l.x,l.z)===i);
    if(lm){
      const stage=STAGES[stageIdxH(lm)];
      tip.innerHTML=`<div class="strip" style="background:#caa25a"></div><div class="in">
        <div class="ttl">${lm.name||stage}</div><div class="sub">${stage}${lm.capital?' · столица':''}</div>
        <div class="row"><span class="k">Население</span><span class="v">${fmtPop(popOf(lm.size))}</span></div>
        <div class="row"><span class="k">Местность</span><span class="v">${bn}</span></div></div>`;
    } else {
      tip.innerHTML=`<div class="strip" style="background:${bc}"></div><div class="in">
        <div class="ttl">${bn}</div><div class="sub">${bd}</div></div>`;
    }
    tip.classList.add('on');
    const pad=15; let x=ev.clientX+pad, y=ev.clientY+pad;
    const r=tip.getBoundingClientRect();
    if(x+r.width>innerWidth-6) x=ev.clientX-pad-r.width;
    if(y+r.height>innerHeight-6) y=ev.clientY-pad-r.height;
    tip.style.left=Math.max(6,x)+'px'; tip.style.top=Math.max(6,y)+'px';
  });
})();

// ===== ОСМОТР округи (СЛОЙ 1): после основания столицы — напоминание, по клику показываем =====
// ресурсные пятна контуром. Пятна ищем flood-fill'ом по типу клетки (biomeAt) в радиусе 4 колец;
// контур — LineSegments по граничным рёбрам, в осветлённом цвете самой местности. Клик по пятну →
// дорога/здание — следующий слой. (DECISIONS 2026-07-06)
(function initSurvey(){
  const SCAN=4;
  const EDGEC=[[0,1],[3,4],[1,2],[4,5],[5,0],[2,3]];   // рёбра гекса (пары углов) по индексу соседа в HN
  const bright=(hex,t)=>{ const r=hex>>16&255,g=hex>>8&255,b=hex&255;   // осветлить цвет к белому
    return (Math.round(r+(255-r)*t)<<16)|(Math.round(g+(255-g)*t)<<8)|Math.round(b+(255-b)*t); };
  const RES={ [B_FOREST]  :{key:'forest',col:0x1f7a1f},    // яркие РАЗНЫЕ оттенки, чтобы контуры не сливались (лес — густо-зелёный)
              [B_WATER]   :{key:'water', col:0x1587e0},    // вода — синий
              [B_HILLS]   :{key:'hills', col:0xe08a1e},    // холмы — янтарно-оранжевый (не путать с зеленью); сама ГОРА — не клетка
              [B_MEADOW]  :{key:'meadow',col:0x9ede1f} };  // луг — лаймовый (жёлто-зелёный)
  const grp=new THREE.Group(); grp.renderOrder=6; scene.add(grp);
  let foundPatches=[], capHexI=-1, curPatch=null;         // слой 2: найденные угодья, гекс столицы, текущее превью
  let selInd=null, curBld=null, placeX=0, placeZ=0, placeRot=0;   // выбранный промысел + место/разворот здания (для лугового выбора пашня/скот)
  const INDUSTRIES=[];                                    // реестр заложенных промыслов города
  const STORE={};                                         // СКЛАД города: шерсть/шкуры/камень/древесина (еда считается отдельно)
  const built=new THREE.Group(); scene.add(built);        // постоянные 3D-здания промыслов (не стираются превью)
  const hlg=new THREE.Group(); scene.add(hlg);            // подсветка клеток промысла (пока панель открыта)
  function clear(){ while(grp.children.length){ const o=grp.children[grp.children.length-1];
    if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); grp.remove(o); } }
  const hdist=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs(a.q+a.r-b.q-b.r))/2;

  // после основания — только напоминание, контуры пока НЕ рисуем (держим ход)
  function onCapitalFounded(){
    clear(); pickingSurvey=true;
    if(window.__capital){ window.__capital.setTask({
        body:'Мудрый советник склонился пред тобою: «Дозволь, Правитель, обойти окрестные земли — сочту, где чащи для ловчих, где вода для рыбарей, где камень для зодчих».',
        cta:'осмотреть округу', ctaKind:'button' });
      window.__capital.showBanner(); }
  }
  // по клику на напоминание — осмотр: находим пятна и обводим контуром
  function reveal(){
    if(!pickingSurvey) return;
    clear();
    const cap=LM.find(l=>l.capital); if(!cap) return;
    const ci=hexOfWorld(cap.x,cap.z); if(ci<0) return;
    const c0=hexes[ci];
    const PATCHMAX=7;                                     // предел тайлов на один ресурсный кусок — крупные режем
    const SCANR=capitalCtrlRadius(cap);                   // осмотр = ровно зона досягаемости (кольца тела города + 4), один источник правды
    const taken=new Set(); INDUSTRIES.forEach(r=>r.cells.forEach(c=>taken.add(c)));   // уже занятые угодья повторно не предлагаем
    const distC=i=>hdist(hexes[i], c0);                   // расстояние тайла от города (в гексах)
    const typeOf=new Map();
    hexes.forEach((h,i)=>{ if(hdist(h,c0)<=1) return; if(hdist(h,c0)>SCANR) return; if(taken.has(i)) return;   // ближний ряд свободен под застройку; занятые угодья пропускаем
      const r=RES[biomeAt(h.x,h.z)]; if(r) typeOf.set(i,r); });
    const sameNbr=(j,r)=>{ const hj=hexes[j], out=[];    // соседи того же ресурса в зоне осмотра
      HN.forEach(([dq,dr])=>{ const nk=key(hj.q+dq,hj.r+dr); if(!hexIdx.has(nk)) return;
        const ni=hexIdx.get(nk); const nr=typeOf.get(ni); if(nr&&nr.key===r.key) out.push(ni); }); return out; };
    const seen=new Set(), patches=[];
    typeOf.forEach((r,i)=>{ if(seen.has(i)) return;
      const comp=[], st=[i]; seen.add(i);               // 1) связная компонента одного типа
      while(st.length){ const j=st.pop(); comp.push(j);
        sameNbr(j,r).forEach(ni=>{ if(!seen.has(ni)){ seen.add(ni); st.push(ni); } }); }
      // Режем компоненту на РАВНЫЕ КОМПАКТНЫЕ СВЯЗНЫЕ поля, КАЖДОЕ ≤PATCHMAX клеток. (Переписано 2026-07-09:
      // прежний Вороной+балансировка давал ~22% полей-ГАНТЕЛЕЙ — комок+перешеек+комок; пользователь: «поля кучнее».)
      // splitInto(k): 1) k зёрен дальней выборкой; 2) ВОРОНОЙ (клетка к ближнему зерну) — РАВНЫЕ компактные куски
      //   плотно у семёрки; 3) починка связности (крупнейший блок полю, оторванные → соседу = один остров); 4)
      //   балансировка до равных, но ход, рождающий ГАНТЕЛЬ у любого поля, ЗАПРЕЩЁН (это и держит поля кучными);
      //   5) «разжать гантель» — остаточную гантель распускаем, меньшую долю за перешейком отдаём соседу. Затем: если
      //   поле всё же >PATCHMAX — увеличиваем k и режем заново.
      // Проверено node-моделью (scratchpad/field_model.mjs) на 3000 форм: гантелей 0.9% (было 22.2%), 0 разрывов,
      // 0 полей>7, средний размер поля 5.9 (у семёрки), разброс 0.6 (равные).
      const n=comp.length, cells=[...comp];
      const SN=j=>sameNbr(j,r);                              // соседи того же угодья
      const conn=arr=>{ if(arr.length<=1) return true; const set=new Set(arr),seen=new Set([arr[0]]),st=[arr[0]];
        while(st.length){ const c=st.pop(); SN(c).forEach(ni=>{ if(set.has(ni)&&!seen.has(ni)){ seen.add(ni); st.push(ni); } }); } return seen.size===arr.length; };
      const dumb=arr=>{ if(arr.length<4) return false; const set=new Set(arr);   // гантель: есть клетка-перешеек, разрыв которой даёт две доли по ≥2 клетки
        for(const cut of arr){ const rest=arr.filter(x=>x!==cut); const vis=new Set(),blocks=[];
          for(const s0 of rest){ if(vis.has(s0)) continue; const cc=[],q=[s0]; vis.add(s0);
            while(q.length){ const c=q.pop(); cc.push(c); SN(c).forEach(ni=>{ if(set.has(ni)&&ni!==cut&&!vis.has(ni)){ vis.add(ni); q.push(ni); } }); } blocks.push(cc); }
          blocks.sort((a,b)=>b.length-a.length); if(blocks.length>=2&&blocks[1].length>=2) return true; } return false; };
      const splitInto=(k)=>{
        // 1) k зёрен дальней выборкой (разнесены по пятну)
        const seeds=[]; { let s=cells[0],bd=-1; cells.forEach(j=>{ const d=distC(j); if(d>bd){ bd=d; s=j; } }); seeds.push(s); }
        while(seeds.length<k){ let s=-1,bd=-1; cells.forEach(j=>{ let md=Infinity; seeds.forEach(sd=>{ const d=hdist(hexes[j],hexes[sd]); if(d<md)md=d; }); if(md>bd){ bd=md; s=j; } }); seeds.push(s); }
        // 2) ВОРОНОЙ: каждая клетка к БЛИЖНЕМУ зерну → равные компактные куски, плотно у семёрки (как нравилось пользователю).
        const owner=new Map(); cells.forEach(j=>{ let bi=0,bd=Infinity; seeds.forEach((sd,si)=>{ const d=hdist(hexes[j],hexes[sd]); if(d<bd){ bd=d; bi=si; } }); owner.set(j,bi); });
        const pc=si=>cells.filter(j=>owner.get(j)===si);
        // 3) ПОЧИНКА связности: у поля крупнейший блок — своё, оторванные под-блоки → соседу (каждое поле один остров).
        const repair=()=>{ for(let pass=0; pass<n+2; pass++){ let dirty=false;
            for(let si=0; si<k; si++){ const mine=pc(si); if(mine.length<=1) continue; const seen=new Set(),comps=[];
              for(const s0 of mine){ if(seen.has(s0)) continue; const cc=[],st=[s0]; seen.add(s0);
                while(st.length){ const j=st.pop(); cc.push(j); SN(j).forEach(ni=>{ if(owner.get(ni)===si&&!seen.has(ni)){ seen.add(ni); st.push(ni); } }); } comps.push(cc); }
              if(comps.length<=1) continue; dirty=true; comps.sort((a,b)=>b.length-a.length);
              for(let c=1;c<comps.length;c++){ const orph=comps[c]; let tgt=-1;
                for(const j of orph){ for(const ni of SN(j)){ const o=owner.get(ni); if(o!==si){ tgt=o; break; } } if(tgt>=0) break; }
                if(tgt<0) tgt=si; orph.forEach(j=>owner.set(j,tgt)); } }
            if(!dirty) break; } };
        const stays=(j,oj)=>conn(pc(oj).filter(x=>x!==j));
        repair();
        // 4) БАЛАНСИРОВКА до равных, но ход, рождающий гантель у любого поля, — ЗАПРЕЩЁН (это и держит поля кучными).
        for(let it=0; it<n*8 && k>1; it++){ const c=cells.reduce((a,j)=>(a[owner.get(j)]++,a),new Array(k).fill(0));
          const order=[...c.keys()].sort((a,b)=>c[a]-c[b]); const big=order[order.length-1];
          if(c[big]-c[order[0]]<=1) break; let moved=false;
          for(const sm of order){ if(c[sm]>=c[big]) break;
            for(const j of cells){ const oj=owner.get(j); if(oj===sm||c[oj]<=c[sm]+1) continue;
              if(!SN(j).some(ni=>owner.get(ni)===sm)||!stays(j,oj)) continue;
              if(dumb([...pc(sm),j])||dumb(pc(oj).filter(x=>x!==j))) continue;
              owner.set(j,sm); moved=true; break; }
            if(moved) break; }
          if(!moved) break; }
        repair();
        // 5) РАЗЖАТЬ ГАНТЕЛЬ: у гантельного поля меньшую долю за перешейком отдаём примыкающему соседу (если тот ≤PATCHMAX и не станет гантелью).
        for(let pass=0; pass<3; pass++){ let fixed=false;
          for(let si=0; si<k; si++){ const piece=pc(si); if(!dumb(piece)) continue;
            let give=null; const set=new Set(piece);
            for(const cut of piece){ const rest=piece.filter(x=>x!==cut); const vis=new Set(),blocks=[];
              for(const s0 of rest){ if(vis.has(s0)) continue; const cc=[],q=[s0]; vis.add(s0);
                while(q.length){ const c2=q.pop(); cc.push(c2); SN(c2).forEach(ni=>{ if(set.has(ni)&&ni!==cut&&!vis.has(ni)){ vis.add(ni); q.push(ni); } }); } blocks.push(cc); }
              blocks.sort((a,b)=>b.length-a.length); if(blocks.length>=2&&blocks[1].length>=2){ give=blocks[blocks.length-1]; break; } }
            if(!give) continue; const gset=new Set(give);
            const tc=new Map(); give.forEach(j=>SN(j).forEach(ni=>{ const o=owner.get(ni); if(o!==si&&!gset.has(ni)) tc.set(o,(tc.get(o)||0)+1); }));
            let tgt=-1,bt=0; tc.forEach((v,o)=>{ if(v>bt){ bt=v; tgt=o; } }); if(tgt<0) continue;
            const tAfter=[...pc(tgt),...give]; if(tAfter.length>PATCHMAX||dumb(tAfter)||!conn(tAfter)) continue;
            const gAfter=piece.filter(j=>!gset.has(j)); if(gAfter.length&&!conn(gAfter)) continue;
            give.forEach(j=>owner.set(j,tgt)); fixed=true; }
          if(!fixed) break; }
        const pieces=Array.from({length:k},()=>[]); owner.forEach((v,j)=>pieces[v].push(j)); return pieces;
      };
      // ЖАДНАЯ НАБИВКА (2026-07-10). Вороной делит пятно «поровну», и на тонком вьющемся луге-ЗМЕЙКЕ (а настоящие
      // луга между лесом и горами именно такие) куски вылезают за 7 → k растёт → вместо 3 полей по ~6 выходит 4 по ~4.
      // Здесь растим поле-блоб от края внутрь, добирая соседа с максимальной связью с блобом, до цели
      // target=ceil(остаток/ceil(остаток/7)): полей всегда минимум (ceil(n/7)), и они не «7,7,3», а ровные 6,6,5.
      const greedyFit=()=>{
        const un=new Set(cells), out=[];
        while(un.size){
          const rem=un.size, target=Math.ceil(rem/Math.max(1,Math.ceil(rem/PATCHMAX)));
          let cq=0,cr=0; un.forEach(j=>{ cq+=hexes[j].q; cr+=hexes[j].r; }); const ct={q:cq/rem,r:cr/rem};
          let seed=-1,bd=-1; un.forEach(j=>{ const d=hdist(hexes[j],ct); if(d>bd){ bd=d; seed=j; } });   // зерно = крайняя клетка остатка (растём от края внутрь — остаток не рвётся)
          const blob=new Set([seed]); un.delete(seed);
          while(blob.size<target){
            const cand=new Set(); blob.forEach(j=>SN(j).forEach(ni=>{ if(un.has(ni)) cand.add(ni); }));
            if(!cand.size) break;                            // блоб упёрся в тупик (узкое место змейки) — остаток пойдёт в следующее поле
            let bq=0,br=0; blob.forEach(j=>{ bq+=hexes[j].q; br+=hexes[j].r; }); const bc={q:bq/blob.size,r:br/blob.size};
            let bj=-1,bnb=-1,bd2=Infinity;                   // берём соседа с макс. связью (заполняем вырезы), при равенстве — ближе к центру блоба (кучность)
            cand.forEach(j=>{ const nb=SN(j).filter(ni=>blob.has(ni)).length, d=hdist(hexes[j],bc);
              if(nb>bnb||(nb===bnb&&d<bd2)){ bnb=nb; bd2=d; bj=j; } });
            blob.add(bj); un.delete(bj);
          }
          out.push([...blob]);
        }
        return out;
      };
      // УПАКОВКА (2026-07-09). Обе нарезки выше промахиваются мимо МИНИМУМА полей ceil(n/7) на вытянутых кусках:
      // Вороной лезет за потолок → k++ → лишнее поле; жадная набивка ПЕРЕКУСЫВАЕТ остаток пополам → хвосты 7+4+3.
      // Пользователь на скрине: кусок луга 14 клеток вышел 3+5+6 вместо 7+7. Здесь поле растёт из ТУПИКА (клетка
      // с наименьшим числом соседей по остатку) и клетка НЕ берётся, если после неё остаток распадается на части;
      // затем соседние поля сливаются, пока сумма ≤7, а одиночная клетка пристраивается к соседу (но НЕ выше потолка).
      // Проверено node (scratchpad/hybrid3.mjs, 3000 лугов): лишнее поле/потерянная клетка 4.8%→0.2% на компактных
      // и 7.8%→0.4% на змейках; брошенных клеток почти ноль; гантелей 9.4%→10.8%; полей >7 нет.
      const packFit=()=>{
        const un=new Set(cells), out=[];
        const nbrIn=(j,set)=>SN(j).filter(ni=>set.has(ni));
        while(un.size){
          const rem=un.size, target=Math.min(PATCHMAX, Math.ceil(rem/Math.max(1,Math.ceil(rem/PATCHMAX))));
          let seed=-1,bn=99; un.forEach(j=>{ const d=nbrIn(j,un).length; if(d<bn){ bn=d; seed=j; } });   // зерно — самая «глухая» клетка
          const blob=new Set([seed]); un.delete(seed);
          while(blob.size<target && un.size){
            const cand=[]; blob.forEach(j=>nbrIn(j,un).forEach(ni=>{ if(!cand.includes(ni)) cand.push(ni); }));
            if(!cand.length) break;
            const safe=cand.filter(j=>{ const rest=[...un].filter(x=>x!==j); return !rest.length||conn(rest); });  // не рвать остаток
            let pool=safe.length?safe:cand;
            const nice=pool.filter(j=>!dumb([...blob,j])); if(nice.length) pool=nice;                              // не рождать гантель
            let bq=0,br=0; blob.forEach(j=>{ bq+=hexes[j].q; br+=hexes[j].r; }); const bc={q:bq/blob.size,r:br/blob.size};
            let bj=-1,bnb=-1,bd=Infinity;                    // сосед с макс. связью, при равенстве — ближе к центру блоба
            pool.forEach(j=>{ const nb=nbrIn(j,blob).length, d=hdist(hexes[j],bc);
              if(nb>bnb||(nb===bnb&&d<bd)){ bnb=nb; bd=d; bj=j; } });
            blob.add(bj); un.delete(bj);
          }
          out.push([...blob]);
        }
        const adjac=(a,b)=>a.some(j=>SN(j).some(ni=>b.includes(ni)));
        for(let merged=true; merged;){ merged=false; out.sort((a,b)=>a.length-b.length);   // слить соседей, пока влезает в потолок
          outer: for(let i=0;i<out.length;i++) for(let k2=i+1;k2<out.length;k2++){
            const sum=out[i].concat(out[k2]);
            if(sum.length<=PATCHMAX && adjac(out[i],out[k2]) && !dumb(sum)){ out[i]=sum; out.splice(k2,1); merged=true; break outer; } } }
        for(let i=out.length-1;i>=0;i--){ if(out[i].length>=2) continue;                    // одиночку — соседу, но не выше потолка
          const cell=out[i][0]; let tgt=-1,best=99;
          out.forEach((f,k2)=>{ if(k2===i||f.length>=PATCHMAX||!f.some(j=>SN(j).includes(cell))) return;
            const sc=f.length+(dumb([...f,cell])?100:0); if(sc<best){ best=sc; tgt=k2; } });
          if(tgt>=0){ out[tgt].push(cell); out.splice(i,1); } }
        return out;
      };
      // Берём ЛУЧШУЮ из ТРЁХ нарезок: меньше полей → меньше брошенных клеток → меньше гантелей → ровнее размеры.
      // Проверено node-моделью (scratchpad/field_model.mjs, 3000 форм каждого класса): на змейках лишних полей 0.9%
      // (было 37%), средний размер 5.69 при теоретическом пределе 5.77; на компактных пятнах 5.94 при пределе 5.95,
      // гантелей 1%. Ноль потерянных клеток, ноль полей >7, ноль разрывов — в обоих классах форм.
      const scoreOf=pl=>{ const real=pl.filter(p=>p.length>=2), sz=real.map(p=>p.length);
        return { real, fields:real.length, lost:pl.reduce((s,p)=>s+(p.length<2?p.length:0),0),
                 dumb:real.filter(p=>dumb(p)).length, spread:sz.length?Math.max(...sz)-Math.min(...sz):0 }; };
      let k=Math.max(1,Math.ceil(n/PATCHMAX)), A=splitInto(k);
      while(k<n && Math.max(0,...A.map(p=>p.length))>PATCHMAX){ k++; A=splitInto(k); }   // поле вылезло за потолок → больше полей
      const better=(x,y)=>(x.fields!==y.fields ? (x.fields<y.fields) : x.lost!==y.lost ? (x.lost<y.lost)
                : x.dumb!==y.dumb ? (x.dumb<y.dumb) : x.spread<=y.spread) ? x : y;
      const win=better(better(scoreOf(A), scoreOf(greedyFit())), scoreOf(packFit()));
      win.real.forEach(pc=>patches.push({r,cells:pc}));
    });
    const W=0.30;                                        // полуширина ленты-контура (мировые ед.) — «жирная» линия вместо тонкой
    patches.forEach(p=>{
      const set=new Set(p.cells), pos=[];
      const y=(x,z)=>hAt(x,z)+0.16;
      const ribbon=(ax,az,bx,bz)=>{                      // плоская лента по ребру: смещаем концы ±перпендикуляр в плоскости XZ
        let px=-(bz-az), pz=(bx-ax); const pl=Math.hypot(px,pz)||1; px=px/pl*W; pz=pz/pl*W;
        const a1x=ax+px,a1z=az+pz, a2x=ax-px,a2z=az-pz, b1x=bx+px,b1z=bz+pz, b2x=bx-px,b2z=bz-pz;
        pos.push(a1x,y(a1x,a1z),a1z, a2x,y(a2x,a2z),a2z, b1x,y(b1x,b1z),b1z,   // 2 треугольника = квад-полоска
                 a2x,y(a2x,a2z),a2z, b2x,y(b2x,b2z),b2z, b1x,y(b1x,b1z),b1z);
      };
      p.cells.forEach(j=>{ const hj=hexes[j], cor=hexCorners(hj.x,hj.z);

          const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]];
          ribbon(A[0],A[1],B[0],B[1]); }); });
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      const rib=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:p.r.col,transparent:true,opacity:0.92,depthTest:false,side:THREE.DoubleSide}));
      rib.renderOrder=7; grp.add(rib);
    });
    // сохранить пятна для слоя 2 (клик по угодью → выбор промысла)
    foundPatches=patches.map(p=>{ const set=new Set(p.cells);
      let target=p.cells[0], bd=Infinity;                 // целевая клетка = ближняя к городу ПО ПРЯМОЙ (не по гекс-дистанции:
      p.cells.forEach(j=>{ const dx=hexes[j].x-cap.x, dz=hexes[j].z-cap.z;   // среди равных по гексам выбирает реально ближнюю → хижина у ближнего края, дорога короче)
        const d=dx*dx+dz*dz; if(d<bd){ bd=d; target=j; } });
      return { r:p.r, cells:p.cells, set, target, cx:hexes[target].x, cz:hexes[target].z }; });

    if(window.__glog) window.__glog(`Округа осмотрена: найдено ${patches.length} ${plural(patches.length,'угодье','угодья','угодий')}`);

    if(window.__capital) window.__capital.setTask({

      cta:'кликни по угодью', ctaKind:'prompt' });

  function laborPool(){ const c=LM.find(l=>l.capital); return c?Math.round(popOf(c.size)*0.5):0; }   // рабочие руки = ~половина населения
  function allocWorkers(){ const pool=laborPool();                                                    // раздаём по ёмкости угодий

    // ходов. Демография считает по ЦЕЛЫМ годам с накоплением, поэтому округляем явно (иначе `y<yr` молча
    // округлял вверх: при 39.5 крутил 40 шагов, при 14.93 — 15).
    const idx=epIdxNow(), yr=Math.max(1, Math.round(yearsPerTurn(turn)));
    // — еда с учётом доставки (потери + лаг); амбар копит излишек и отдаёт в голод —
    const need=capNeed(); let food=foodDeliveredPerTurn();
    if(cap._hasGranary){ const cp=Math.max(1,need*5);
      if(food>need){ cap._store=Math.min(cp,(cap._store||0)+(food-need)*0.5); }
      else if((cap._store||0)>0){ const draw=Math.min(cap._store, need-food); cap._store-=draw; food+=draw; } }
    const hunger=need>0?Math.max(0,Math.min(1,(need-food)/need)):0;
    const attract=need>0?Math.max(0,Math.min(1,(food-need)/need)):0;
    cap._food=food; cap._need=need; cap._hunger=hunger; cap._attract=attract;
    // — миграция из деревень + их собственная демография (закон сохранения: сколько пришло — столько убыло) —
    let migrants=0; const log=[];
    const vby=(BIRTH_RATE[idx]+VILLAGE_BIRTH_ADD)/100, vdy=(DEATH_BASE[idx]/100);
    const pull=Math.max(CITY_PULL, attract);                      // город манит и без избытка еды: ремесло, обмен, защита за стенами
    LM.forEach(v=>{ if(v.capital||v.aiCapital) return;              // чужая столица живёт своей жизнью
      const vpop=popOf(v.size); let flow=0;
      if(!decreeClosed && !v.aiOwned){                               // деревня соперника людей нам не отдаёт
        v._news=Math.min(1,(v._news||0)+0.34);                    // «узнать о городе» — разгон за ~3 хода
        const d=Math.hypot(v.x-cap.x, v.z-cap.z);
        const rq=0.40+natGrade(edgeAvgTr(hexOfWorld(v.x,v.z)))*0.12;   // качество дороги для миграции: пол 0.30→0.40 (ранняя целина/тропа не так душит приток)
        flow=MIG_BASE*pull*v._news*(1/(1+0.035*d))*rq;                 // штраф расстояния мягче (0.05→0.035): дальние деревни тоже питают столицу
        flow=Math.max(0, Math.min(flow, vpop*(1-VILLAGE_FLOOR)));  // дробную долю НЕ округляем — копим точно, деревня не пустеет ниже пола
      } else v._news=0;

      vp=Math.max(10, vp-flow);                                   // и отток в столицу
      v.size=Math.min(capVillageOf(v), sizeOfPop(vp));            // свой потолок: ближние хиреют, дальние дорастают до города
      // сохраняем демографию деревни за ПОСЛЕДНИЙ ход — показывается в карточке по клику (2026-07-09)
      v._births=Math.round(vb); v._deaths=Math.round(vd); v._out=Math.round(flow);
      v._outTo=flow>=0.5 ? (cap.name||'столица') : null;
      v._growLast=popOf(v.size)-vpop;
      if(flow>=0.01){ migrants+=flow; const nr=Math.round(flow); if(nr>0) log.push({name:v.name||'деревня',n:nr}); }
    });
    // — демография столицы (компаундинг по годам) —
    const by=(BIRTH_RATE[idx]/100)*sciMods.birth;
    // «СЫТЫЙ ГОРОД В НУЛЕ» (2026-07-09): пока еды хватает, штраф «городского кладбища» не берём — свой прирост
    // города выходит около нуля (+0.04%/год), и приток мигрантов НАКАПЛИВАЕТСЯ, а не проедается. Начался голод —
    // штраф возвращается и город снова вымирает. Раньше штраф висел всегда → −0.11%/год, и все приезжие уходили в землю.
    const pen=hunger>0 ? CITY_DEATH_PEN[idx] : 0;
    const dy=((DEATH_BASE[idx]+pen+hunger*3)/100)*sciMods.death;   // +голод к смертности
    const before=popOf(cap.size); let p=before, births=0, deaths=0;
    for(let y=0;y<yr;y++){ const bb=p*by, dd=p*dy; births+=bb; deaths+=dd; p=Math.max(10, p+bb-dd); }
    p=Math.max(10, p+migrants);                                   // потолок CAP СНЯТ — путь к мегаполису
    cap.size=sizeOfPop(p);
    cap._births=Math.round(births); cap._deaths=Math.round(deaths); cap._migrants=Math.round(migrants);
    cap._growLast=popOf(cap.size)-before;
    if(!cap._migLog) cap._migLog=[];
    log.forEach(e=>cap._migLog.push({name:e.name,n:e.n,turn}));
    cap._migLog=cap._migLog.filter(e=>e.turn>turn-3);            // держим последние 3 хода

    refreshPanels(); }

      const a1x=ax+px,a1z=az+pz,a2x=ax-px,a2z=az-pz,b1x=bx+px,b1z=bz+pz,b2x=bx-px,b2z=bz-pz;

    cityP.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ cityTab=el.dataset.t; renderCity(); });
    cityP.querySelectorAll('.cbtn').forEach(el=>el.onclick=()=>{ const a=el.dataset.a;
      if(a==='granary'){ if(money>=40){ money-=40; cap._hasGranary=true; cap._store=0; updateStats(); if(window.__glog)window.__glog('Построен амбар — запас еды на голодные ходы'); } else if(window.__glog) window.__glog('Не хватает казны на амбар (нужно 40)'); }
      else if(a==='decree'){ decreeClosed=!decreeClosed; if(window.__glog)window.__glog(decreeClosed?'Указ: приём новых жителей ограничен':'Ограничение приёма снято'); }
      renderCity(); });
    cityP.querySelectorAll('.prom').forEach(el=>el.onclick=()=>{ const r=INDUSTRIES[+el.dataset.i];
      if(window.__capital) window.__capital.focusOn(r.bx,hAt(r.bx,r.bz),r.bz); openRes(r); });
    const rb=cityP.querySelector('.rescan'); if(rb) rb.onclick=rescan; }
  function refreshPanels(){ if(cityP.classList.contains('on')) renderCity(); if(curRes&&resP.classList.contains('on')) openRes(curRes);
    renderVillage(); drawCapitalZone(); }     // карточка деревни и рамка зоны обновляются вместе с панелями

  // — клик по карте вне режимов выбора: столица → панель города, угодье промысла → панель промысла —
  dom.addEventListener('pointerup', e=>{
    if(pickingCapital||pickingScience||pickingSurvey||pickingIndustry) return;
    if(Math.abs(e.clientX-dX)+Math.abs(e.clientY-dY)>6) return;   // перетаскивание камеры — не клик
    ndc2.x=(e.clientX/innerWidth)*2-1; ndc2.y=-(e.clientY/innerHeight)*2+1; ray2.setFromCamera(ndc2,camera);
    // 1) СПЕРВА по самим домам: высокие здания перехватывают луч раньше земли — раньше клик по городу «не срабатывал»
    const grps=LM3D.map(r=>r&&r.group).filter(Boolean);
    const gh=grps.length?ray2.intersectObjects(grps,true)[0]:null;
    const hit=ray2.intersectObject(terrain,false)[0];
    if(gh && (!hit || gh.distance<=hit.distance+0.2)){
      let o=gh.object; while(o.parent && grps.indexOf(o)<0) o=o.parent;
      const li=LM3D.findIndex(r=>r&&r.group===o);
      if(li>=0){ if(LM[li].capital) openCity(); else openVillage(li); return; }
    }
    if(!hit) return;
    const hi=hexOfWorld(hit.point.x,hit.point.z);
    const cap=LM.find(l=>l.capital);
    if(cap && hi>=0 && hexOfWorld(cap.x,cap.z)===hi){ openCity(); return; }
    // 2) клик по земле рядом с поселением — тоже открывает его карточку (радиус тела кластера)
    const li2=LM.findIndex(l=>Math.hypot(l.x-hit.point.x, l.z-hit.point.z)<2.2);
    if(li2>=0){ if(LM[li2].capital) openCity(); else openVillage(li2); return; }
    let rec=INDUSTRIES.find(r=>r.set.has(hi));
    if(!rec){ let bd=4; INDUSTRIES.forEach(r=>{ const dx=hit.point.x-r.bx,dz=hit.point.z-r.bz,d=dx*dx+dz*dz; if(d<bd){ bd=d; rec=r; } }); }
    if(rec) openRes(rec); });

  // — КРАСОТА: изгородь по контуру пастбища + борозды-пашня на каждой клетке поля (в постоянную группу built) —
  // ПАХОТА (2026-07-09, правка): не сплошная коричневая заливка (на ней терялись ростки), а БОРОЗДЫ —
  // тёмные валики через ряд. Между ними видна трава, поле читается и ростки на нём заметны.
  // Один InstancedMesh на всё поле (правило инстансинга).
  const FURROW_ROWS=(h,j,cb)=>{                             // обход точек внутри гекса j: (wx,wz,a,b)
    for(let b=-6;b<=6;b++) for(let a=-6;a<=6;a++){
      const wz=h.z+b*0.30, wx=h.x+a*0.32+(b&1?0.16:0);
      if(hexOfWorld(wx,wz)!==j) continue;                   // строго внутри своей клетки
      cb(wx,wz,a,b); } };
  function decoSoil(rec, parent=built){                     // борозды (валики вспаханной земли)
    const brown=new THREE.MeshStandardMaterial({color:0x5a4030,roughness:1});
    const ridgeG=new THREE.BoxGeometry(0.34,0.055,0.17), UP=new THREE.Vector3(0,1,0);
    const M=[], q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), pos=new THREE.Vector3(), tmp=new THREE.Vector3();
    rec.cells.forEach(j=>{ const h=hexes[j];
      FURROW_ROWS(h,j,(wx,wz,a,b)=>{ if(b&1) return;        // валик через ряд — между ними борозда с травой
        const nx=hAt(wx-0.4,wz)-hAt(wx+0.4,wz), nz=hAt(wx,wz-0.4)-hAt(wx,wz+0.4);
        q.setFromUnitVectors(UP, tmp.set(nx,1.6,nz).normalize());
        pos.set(wx, hAt(wx,wz)+0.045, wz);
        M.push(new THREE.Matrix4().compose(pos,q,sc)); }); });
    const inst=new THREE.InstancedMesh(ridgeG, brown, Math.max(1,M.length));
    M.forEach((m,i)=>inst.setMatrixAt(i,m)); inst.instanceMatrix.needsUpdate=true; inst.receiveShadow=true;
    parent.add(inst); return inst; }
  function decoFence(rec, parent=built){ const g=new THREE.Group();   // изгородь: жерди и сваи — по ОДНОМУ InstancedMesh на тип (2 вызова отрисовки на всю ограду, сколько бы её ни было)
    const woodM=new THREE.MeshStandardMaterial({color:0x6b4a2b,roughness:1});
    const postG=new THREE.CylinderGeometry(0.05,0.05,0.62,5), railG=new THREE.BoxGeometry(1,0.05,0.05);
    const rails=[], posts=[], seen=new Set();
    const q=new THREE.Quaternion(), sc=new THREE.Vector3(), pos=new THREE.Vector3(), UP=new THREE.Vector3(0,1,0), I=new THREE.Quaternion(), ONE=new THREE.Vector3(1,1,1);
    rec.cells.forEach(j=>{ const hj=hexes[j], cor=hexCorners(hj.x,hj.z);
      HN.forEach(([dq,dr],d)=>{ const nk=key(hj.q+dq,hj.r+dr); if(hexIdx.has(nk)&&rec.set.has(hexIdx.get(nk))) return;   // только ВНЕШНИЕ рёбра пятна
        const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]];
        const mx=(A[0]+B[0])/2, mz=(A[1]+B[1])/2, len=Math.hypot(B[0]-A[0],B[1]-A[1]), ang=Math.atan2(-(B[1]-A[1]),B[0]-A[0]);
        q.setFromAxisAngle(UP,ang); sc.set(len,1,1);
        [0.42,0.22].forEach(hy=>{ pos.set(mx,hAt(mx,mz)+hy,mz); rails.push(new THREE.Matrix4().compose(pos,q,sc)); });   // жердь = единичный бокс, длина через масштаб по X
        [A,B].forEach(P=>{ const kk=Math.round(P[0]*8)+'_'+Math.round(P[1]*8); if(seen.has(kk))return; seen.add(kk);
          pos.set(P[0],hAt(P[0],P[1])+0.31,P[1]); posts.push(new THREE.Matrix4().compose(pos,I,ONE)); }); }); });
    const im=(geo,mats)=>{ const m=new THREE.InstancedMesh(geo,woodM,Math.max(1,mats.length)); mats.forEach((mx,i)=>m.setMatrixAt(i,mx)); m.instanceMatrix.needsUpdate=true; m.castShadow=true; g.add(m); };
    im(railG,rails); im(postG,posts);
    rec.deco=g; parent.add(g); return g; }
  function decoCrops(rec, parent=built){   // ПАШНЯ = ростки РЯДАМИ по гребням борозд. ОДИН InstancedMesh на ростки
    const green=new THREE.MeshStandardMaterial({color:0x6fbf3f,roughness:0.85});   // ярче прежнего 0x4f8f34
    const bladeG=new THREE.ConeGeometry(0.06,0.42,4), UP=new THREE.Vector3(0,1,0); // выше прежнего (0.26)
    const M=[], q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), pos=new THREE.Vector3(), tmp=new THREE.Vector3();
    rec.cells.forEach(j=>{ const h=hexes[j];
      FURROW_ROWS(h,j,(wx,wz,a,b)=>{ if(b&1) return;         // ростки — на валиках, как в поле
        const nx=hAt(wx-0.4,wz)-hAt(wx+0.4,wz), nz=hAt(wx,wz-0.4)-hAt(wx,wz+0.4);           // уклон земли → нормаль
        q.setFromUnitVectors(UP, tmp.set(nx,1.6,nz).normalize());                            // наклон по склону тайла
        q.multiply(new THREE.Quaternion().setFromAxisAngle(UP, a+b*1.7));                    // лёгкий разворот вокруг своей оси
        pos.set(wx, hAt(wx,wz)+0.24, wz);                                                    // на гребне валика
        M.push(new THREE.Matrix4().compose(pos,q,sc)); }); });
    const soil=decoSoil(rec, parent);                       // сперва борозды, ростки поверх них
    const inst=new THREE.InstancedMesh(bladeG, green, Math.max(1,M.length));
    M.forEach((m,i)=>inst.setMatrixAt(i,m)); inst.instanceMatrix.needsUpdate=true; inst.castShadow=true;
    rec.deco=inst; parent.add(inst); return {soil,inst}; }

  // ===== УКРАШЕНИЕ ДЕРЕВЕНЬ (2026-07-09) =====
  // У деревни, рядом с центром которой есть луг: одна клетка под пастбище, одна под пашню. Есть вода — ещё причал.
  // Это ЧИСТО декорация, не настоящее угодье: когда деревня становится нашей (столица/присоединение),
  // всё это ИСЧЕЗАЕТ — иначе игрок примет украшение за готовый промысел. (Прямое требование пользователя.)
  const VDECO=[];                                            // VDECO[i] = группа декора деревни i
  function clearVillageDecorInner(i){
    const g=VDECO[i]; if(!g) return;
    scene.remove(g); g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); VDECO[i]=null;
  }
  function villageDecorAll(){
    for(let i=0;i<LM.length;i++){
      const lm=LM[i];
      if(lm.capital||lm.aiCapital){ clearVillageDecorInner(i); continue; }  // столица — украшения долой
      // если игрок заложил промысел ПОВЕРХ клеток декора — снести декор и нарисовать заново (вариант «А»)
      if(VDECO[i] && (VDECO[i].userData.cells||[]).some(c=>occupiedHex.has(c))) clearVillageDecorInner(i);
      if(VDECO[i]) continue;                                  // уже нарисовано
      const ci=hexOfWorld(lm.x,lm.z); if(ci<0) continue;
      const h0=hexes[ci], meadow=[], water=[];
      HN.forEach(([dq,dr])=>{ const nk=key(h0.q+dq,h0.r+dr); if(!hexIdx.has(nk)) return;
        const ni=hexIdx.get(nk); if(occupiedHex.has(ni)) return;      // на НАШЕЙ пашне декор не рисуем
        const hh=hexes[ni], b=biomeAt(hh.x,hh.z);
        if(b===B_MEADOW) meadow.push(ni); else if(b===B_WATER) water.push(ni); });
      if(!meadow.length && !water.length) continue;
      const g=new THREE.Group(); scene.add(g); VDECO[i]=g;
      g.userData.cells=[meadow[0],meadow[1],water[0]].filter(c=>c!==undefined);
      if(meadow[0]!==undefined){                              // 1 клетка — пастбище (изгородь)
        const cells=[meadow[0]]; decoFence({cells,set:new Set(cells)}, g); }
      if(meadow[1]!==undefined){                              // 1 клетка — пашня (пахота + ростки)
        const cells=[meadow[1]]; decoCrops({cells,set:new Set(cells)}, g); }
      if(water[0]!==undefined){                               // причал у воды: тот же, что у промысла рыбарей
        const wh=hexes[water[0]], b=IND.fish.build();
        b.position.set((wh.x+lm.x)/2, hAt((wh.x+lm.x)/2,(wh.z+lm.z)/2), (wh.z+lm.z)/2);
        b.rotation.y=Math.atan2(wh.x-lm.x, wh.z-lm.z); b.scale.setScalar(0.6); g.add(b); }
    }
    for(let i=LM.length;i<VDECO.length;i++) clearVillageDecorInner(i);   // сброс мира
  }
  function clearAllVillageDecor(){ for(let i=0;i<VDECO.length;i++) clearVillageDecorInner(i); VDECO.length=0; }

  // — повторный осмотр («Советник осмотрит округу ещё раз») + отмена необязательного осмотра —
  function firstNeeded(){ return INDUSTRIES.length===0; }   // держим ход только пока не заложен ПЕРВЫЙ промысел
  function rescan(){ if(pickingCapital||pickingScience||pickingSurvey||pickingIndustry) return;
    cityP.classList.remove('on'); resP.classList.remove('on'); curRes=null; clearHL(); clearDash();
    pickingSurvey=true; reveal(); }
  function cancelPick(){ if(pickingSurvey||pickingIndustry){ pickingSurvey=false; pickingIndustry=false; clear(); clearPreview(); closePanel();
    if(window.__capital) window.__capital.hideBanner(); } }

  window.__survey={ onCapitalFounded, reveal, nudge, onReset, tick, firstNeeded, rescan, cancelPick, decoFence, decoCrops,
                    villageDecorAll, clearVillageDecor:clearVillageDecorInner, clearAllVillageDecor };
})();

    g('g-m-cols').querySelectorAll('.col').forEach(el=>el.onclick=()=>{ pickCol=el.dataset.id; drawColors(); });
  }
  g('g-m-start').onclick=()=>{ m.classList.add('setup'); setTimeout(()=>g('g-m-name').focus(),40); };
  g('g-m-back').onclick=()=>m.classList.remove('setup');
  g('g-m-ctys').querySelectorAll('.cty').forEach(el=>el.onclick=()=>{
    pickId=el.dataset.id; g('g-m-ctys').querySelectorAll('.cty').forEach(x=>x.classList.toggle('sel',x===el));
    pickCol=null; pickLeader=null; drawColors(); drawLeaders(); });   // сменил страну → её родные цвета и её правители
  drawColors(); drawLeaders();
  g('g-m-exit').onclick=()=>{ try{window.close();}catch(e){}
    m.innerHTML=`<div class="box"><div class="crown">♔</div><h1 class="title" style="font-size:34px;letter-spacing:4px">До встречи!</h1><div class="sub">можно закрыть вкладку</div></div>`; };
  function start(){
    const nm=(g('g-m-name').value||'').trim()||'Правитель';
    PLAYER.name=nm; PLAYER.countryId=pickId; PLAYER.colorId=pickCol||'blue';
    PLAYER.leaderId=pickLeader||LEADERS[pickId][0].id;
    TAKEN_COLORS=[PLAYER.colorId];                         // цвет занят: соперникам достанутся оставшиеся
    try{ localStorage.setItem('grad_player_name', nm); }catch(e){}
    m.classList.add('off');
    if(document.activeElement) document.activeElement.blur();
    newWorld();
    if(window.__glog){ const L=leaderById(PLAYER.leaderId);
      window.__glog(`${COUNTRIES[pickId].flag} ${nm} — держава ${COUNTRIES[pickId].name} · ${colorById(PLAYER.colorId).name}`);
      window.__glog(`Правит ${L.name} ${L.epi} — ${L.trait.toLowerCase()}`); window.__glog('Игра начата'); }
  }
  g('g-m-go').onclick=start;
  g('g-m-name').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); start(); } });
  window.__startGame=start;                               // для headless-проверки
})();

window.__step=(turns)=>{ for(let k=0;k<turns;k++){ for(let s=0;s<stepsPerTurn;s++) oneSubstep(); growRoads(); turn++; }
  syncSettlements(); rebuildRoads(); updateBoard(); refreshTime(); hud.setState('мир замер'); };
window.__roadStats=()=>{ let mx=0,cnt=0,sum=0; for(let e=0;e<NE;e++){ if(roadUse[e]>mx)mx=roadUse[e]; if(roadUse[e]>0){cnt++;sum+=roadUse[e];} } return {mx,cnt,avg:cnt?sum/cnt:0,NE}; };
// служебный журнал (левый-верхний узкий блок со скроллом): новые строки сверху
window.__glog=(msg)=>{ const l=document.getElementById('g-log'); if(!l) return;
  const d=document.createElement('div'); d.textContent=msg; l.insertBefore(d, l.firstChild);
  while(l.childElementCount>80) l.removeChild(l.lastChild); };

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});

// --- панорамирование камеры клавишами (стрелки + WASD) ---
const panKeys={ArrowUp:0,ArrowDown:0,ArrowLeft:0,ArrowRight:0,KeyW:0,KeyA:0,KeyS:0,KeyD:0};
const _typing=el=>el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA');
addEventListener('keydown',e=>{ if(e.code in panKeys && !_typing(e.target)){ panKeys[e.code]=1; e.preventDefault(); } });
addEventListener('keyup',  e=>{ if(e.code in panKeys) panKeys[e.code]=0; });
const PAN_SPEED=0.5, _panFwd=new THREE.Vector3(), _panRight=new THREE.Vector3(), _panMove=new THREE.Vector3();
function applyPan(){
  let dx=(panKeys.ArrowRight||panKeys.KeyD)-(panKeys.ArrowLeft||panKeys.KeyA);
  let dz=(panKeys.ArrowDown||panKeys.KeyS)-(panKeys.ArrowUp||panKeys.KeyW);
  if(!dx && !dz) return;
  camera.getWorldDirection(_panFwd); _panFwd.y=0; _panFwd.normalize();
  _panRight.crossVectors(_panFwd, camera.up).normalize();
  _panMove.set(0,0,0).addScaledVector(_panFwd,-dz*PAN_SPEED).addScaledVector(_panRight,dx*PAN_SPEED);
  camera.position.add(_panMove); controls.target.add(_panMove);
}

let boardTick=0, roadTick=0;
(function loop(){
  requestAnimationFrame(loop);
  if(running){
    const n=Math.min(perFrame, remaining);
    for(let s=0;s<n;s++) oneSubstep();
    remaining-=n; syncSettlements();
    if(remaining<=0){ running=false; turn++; advanceEconomy(); hud.setBusy(false); growRoads(); rebuildRoads(); updateBoard(); refreshTime(); hud.setState('мир замер'); }
  } else if(autoTurns){ endTurn(); }
  drawAgents();
  updateLabels();
  if(++boardTick%20===0) updateBoard();
  applyPan();
  controls.update();
  {
    const t=waterClock.getElapsedTime();
    waterNmap.offset.set(t*0.009, t*0.006);   // спокойная бегущая рябь (озёра — помедленнее; река/океан позже отдельным типом можно быстрее)
    for(const c of CLOUDS){
      c.obj.position.x=cloudWrap(c.x0+Math.cos(c.dir)*c.speed*t);
      c.obj.position.z=cloudWrap(c.z0+Math.sin(c.dir)*c.speed*t);
      c.obj.position.y=c.y0+Math.sin(t*0.15+c.bobPh)*0.4;
    }
    for(const b of BIRDS){
      const th=t*b.speed+b.phase;
      b.obj.position.set(b.cx+Math.cos(th)*b.r, b.y+Math.sin(t*0.6+b.phase)*0.3, b.cz+Math.sin(th)*b.r);
      b.obj.rotation.y=-th;
      const flap=Math.sin(t*b.flap+b.phase)*0.5;
      b.obj.userData.wingR.rotation.z=flap; b.obj.userData.wingL.rotation.z=-flap;
    }
  }
  renderer.render(scene,camera);
})();
window.__ready=true;
</script>
</body>
