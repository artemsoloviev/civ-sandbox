  // зуме видеокарта не красит десятки тысяч дальних пучков.
  const patchWindFade=(m)=>{
    m.onBeforeCompile=(sh)=>{
      sh.uniforms.uTime=labGrassUniforms.uTime;
      sh.vertexShader=sh.vertexShader
        .replace('#include <begin_vertex>',
`#include <begin_vertex>
{
  vec4 wp = instanceMatrix * vec4(0.0,0.0,0.0,1.0);
  float df = 1.0 - smoothstep(34.0, 56.0, distance(cameraPosition, wp.xyz));
  transformed *= df;
  float ph = wp.x*0.35 + wp.z*0.41;
  float sw = sin(uTime*1.6+ph)*0.5 + sin(uTime*0.53+ph*1.7)*0.5;
  transformed.x += sw * 0.10 * position.y * df;
  transformed.z += cos(uTime*1.3+ph) * 0.06 * position.y * df;
}`)
        .replace('void main() {','uniform float uTime;\nvoid main() {');
    };
  };
  // ОДИН материал на всю траву (текстур нет — сплошные вершинные цвета) + ТРИ варианта геометрии
  // пучка; строятся ОДИН раз — пересборка их переиспользует.
  const grassMat=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:1,metalness:0});
  patchWindFade(grassMat);
  const GRASS_SETS=[mkTuftGeo(), mkTuftGeo(), mkTuftGeo()];
  // -- размещение: луга (и нижний пояс холмов), не в воде, не у стартов --
  // ПЕРЕСБОРКА НА ЛЕТУ (панель настроек): __rebuildGrass(множитель 0..2) сеет заново с тем же
  // зерном и подменяет InstancedMesh — ползунок «густота травы» работает без перезагрузки.
  let spots=[], grassIMs=[];
  window.__rebuildGrass=(mult)=>{
    for(const im of grassIMs){ scene.remove(im); im.dispose(); }
    grassIMs=[]; spots=[]; gseed=987654321;   // то же зерно: при равном множителе трава детерминирована
    let n=0,tries=0;
    const GRASS_N=Math.min(160000,Math.round((Q==='high'?72000:Q==='mid'?48000:24000)*mult*SZ*SZ));   // v3 «гуще ×2» + ползунок
    // предохранитель от «клоков»: пики шумового поля при равномерных попытках собирали
    // по 1000-1600 пучков на клетку 8×8 м (яркие кляксы на скринах B6/B7) — плотность режем сверху
    const CCELL=4, CGRID=Math.ceil(SIZE/CCELL)+1, CMAX=84, cellN=new Uint16Array(CGRID*CGRID);
    const cellIx=(x,z)=>(((x+HHALF)/CCELL)|0)*CGRID+(((z+HHALF)/CCELL)|0);
    while(n<GRASS_N && tries<3500000){ tries++;
      const x=(grnd()-0.5)*(SIZE-4), z=(grnd()-0.5)*(SIZE-4);
      // сеем по ВИЗУАЛЬНОЙ маске травы (grassAmtArr — где земля НАРИСОВАНА травяной), а не по
      // игровому биому: «луга» как клеток мало, а травянисто выглядит и лес без деревьев, и низ холмов
      const gi=cxi(z)*TEX+cxi(x);
      if(!(grassAmtArr[gi]>0.55)) continue;
      const b=biomeAt(x,z);
      if(b===B_WATER||b===B_SAND||b===B_SWAMP||b===B_MOUNTAIN) continue;
      if(b===B_FOREST && grnd()<0.72) continue;   // под пологом леса — заметно реже (при 0.45 лес выглядел заросшим кустами)
      if(inWater(x,z)) continue;
      // клочковатость МЯГКОЙ вероятностью: шумовое поле задаёт плотность (густо↔редко↔пусто
      // плавно). Порог 0.36 при среднем шума ~0.42 глушил почти всю карту (ковёр не рос),
      // поэтому у вероятности есть ПОЛ 0.22 — на любом лугу трава есть, шум лишь сгущает
      const gmask=fbm2(x*0.055+5.2, z*0.055+2.8, 2);
      if(grnd()>0.26+0.74*ssf(0.38,0.70,gmask)) continue;   // v3 «ровнее»: пол 0.26 — ковёр с редкими прогалинами (при 0.11 были кучки на голой земле)
      if(cellN[cellIx(x,z)]>=CMAX) continue;
      let near=false; for(const [sx,sz] of STARTS_RAW){ if(Math.hypot(x-sx,z-sz)<7){near=true;break;} }
      if(near) continue;
      // куртинка: 3-5 пучков кучкой, разброс шире — куртинки сливаются в ковёр, а не стоят островками
      const k=3+(grnd()*3|0);
      for(let j=0;j<k && n<GRASS_N;j++){
        const ox=x+(grnd()-0.5)*2.0, oz=z+(grnd()-0.5)*2.0;
        if(inWater(ox,oz)) continue;
        spots.push({x:ox, z:oz, y:hAt(ox,oz), rotY:grnd()*6.28, s:(0.50+grnd()*0.30)*(0.72+0.7*(TS-0.6))});   // v3: разброс размеров уже (крупные пучки читались кустами); ×TS вслед за деревьями
        cellN[cellIx(ox,oz)]++;
        n++;
      }
    }
    // КУСКИ 6×6 (v4): пучки группируются по квадратам карты (28×28 м), у каждого куска свой
    // центр/радиус — цикл кадра выключает дальние куски целиком (трава всё равно растворена
    // дальше 56 м от камеры, гонять её вершины по всей карте незачем). Вариант геометрии
    // пучка — по номеру куска, соседние куски не близнецы.
    const _p=new THREE.Vector3(), _q=new THREE.Quaternion(), _s=new THREE.Vector3(),
          _up=new THREE.Vector3(0,1,0), _m=new THREE.Matrix4(), _col=new THREE.Color();
    const MIDG=[0.42,0.52,0.30];   // «средняя» зелень раскраски — точка отсчёта для оттенка пучка
    const tint=(v,m)=>Math.max(0.72,Math.min(1.05,(v/255)/m));   // оттенок земли; потолок 1.05 — вершинные цвета v4 сами светлые, на тёплой земле кончики белели
    const CH=Math.max(6,Math.round(6*SZ)), CW=SIZE/CH;   // кусок травы ~28 м при любом размере карты (культлинг по кускам)
    const chunks=new Map();
    spots.forEach(t=>{
      const cx=Math.min(CH-1,Math.max(0,((t.x+HALF)/CW)|0)), cz=Math.min(CH-1,Math.max(0,((t.z+HALF)/CW)|0));
      const k=cx*CH+cz; let a=chunks.get(k); if(!a){ a=[]; chunks.set(k,a); } a.push(t);
    });
    for(const [ck,gr] of chunks){
      const im=new THREE.InstancedMesh(GRASS_SETS[ck%3], grassMat, gr.length);
      im.castShadow=false; im.receiveShadow=true;
      im.frustumCulled=false;   // границы ИНСТАНСОВ three сам не считает — видимостью рулит цикл кадра
      let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
      gr.forEach((t,idx)=>{
        _q.setFromAxisAngle(_up,t.rotY); _s.set(t.s,t.s*(0.85+((idx*37)%23)/23*0.4),t.s);
        _m.compose(_p.set(t.x,t.y,t.z),_q,_s); im.setMatrixAt(idx,_m);
        const gx=cxi(t.x), gy=cxi(t.z), ii=(gy*TEX+gx)*4;
        _col.setRGB(tint(baseIm.data[ii],MIDG[0]), tint(baseIm.data[ii+1],MIDG[1]), tint(baseIm.data[ii+2],MIDG[2]));
        im.setColorAt(idx,_col);
        if(t.x<mnx)mnx=t.x; if(t.x>mxx)mxx=t.x; if(t.z<mnz)mnz=t.z; if(t.z>mxz)mxz=t.z;
      });
      im.userData.gc={x:(mnx+mxx)/2, z:(mnz+mxz)/2, r:Math.hypot(mxx-mnx,mxz-mnz)/2+1};
      im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true;
      scene.add(im); grassIMs.push(im);
    }
    // цветочки пересобираются вместе с травой (их точки — каждый 34-й пучок)
    const fspots=spots.filter((_,i)=>i%34===0);
    if(fspots.length){
      const fim=new THREE.InstancedMesh(fgeo, flowerMat, fspots.length);
      fim.castShadow=false; fim.receiveShadow=true; fim.frustumCulled=false;
      fspots.forEach((t,idx)=>{
        _q.setFromAxisAngle(_up,t.rotY+0.7); const fs=t.s*0.55; _s.set(fs,fs,fs);
        _m.compose(_p.set(t.x+0.4,t.y,t.z+0.3),_q,_s); fim.setMatrixAt(idx,_m);
      });
      fim.instanceMatrix.needsUpdate=true;
      scene.add(fim); grassIMs.push(fim);   // цветы выключаются на дальнем зуме вместе с травой
    }
    window.__labGrassIMs=grassIMs;   // мостик для переключателя видимости в цикле кадра (трава только на ближнем зуме)
    window.__labGrass={count:spots.length, sample:spots.filter((_,i)=>i%6000===0).map(t=>[t.x|0,t.z|0])};   // отладка распределения
    applyGrassCut();   // выкос под пашню повторяется после пересева (ползунок густоты сеет заново)
  };
  // ВЫКОС ПОД ПАШНЮ (2026-07-18, заказ пользователя): на клетках, где заложена пашня, траву
  // (и цветочки) убираем — инстанс схлопывается в точку, тем же приёмом, что деревья на просеке.
  // Клетки копятся в наборе: пересев травы (__rebuildGrass) сеет заново — выкос применяется снова.
  window.__grassCutCells=window.__grassCutCells||new Set();
  function applyGrassCut(){
    if(!window.__grassCutCells.size) return;
    for(const im of grassIMs){
      const arr=im.instanceMatrix.array; let dirty=false;
      for(let i=0;i<im.count;i++){
        const o=i*16;
        if(arr[o]===0 && arr[o+5]===0) continue;               // уже скошен
        const j=hexOfWorld(arr[o+12], arr[o+14]);
        if(j>=0 && window.__grassCutCells.has(j)){
          arr[o]=0;arr[o+1]=0;arr[o+2]=0;arr[o+4]=0;arr[o+5]=0;arr[o+6]=0;arr[o+8]=0;arr[o+9]=0;arr[o+10]=0;

        }

  const FS=64;
  const fcv=document.createElement('canvas'); fcv.width=fcv.height=FS;
  const f2=fcv.getContext('2d');
  const FCOL=['#f2ede0','#f0d668','#c9a0d8'];
  for(let k=0;k<7;k++){
    const x=FS*0.5+(trnd()-0.5)*FS*0.6, y=FS*(0.15+trnd()*0.45), r=2.2+trnd()*2.4;
    f2.fillStyle=FCOL[(trnd()*FCOL.length)|0];
    f2.beginPath(); f2.arc(x,y,r,0,Math.PI*2); f2.fill();
    f2.strokeStyle='rgba(70,110,50,0.9)'; f2.lineWidth=1.4;
    f2.beginPath(); f2.moveTo(x,y+r); f2.lineTo(x+(trnd()-0.5)*4,FS); f2.stroke();
  }
  const flowerTex=new THREE.CanvasTexture(fcv); flowerTex.colorSpace=THREE.SRGBColorSpace;
  const flowerMat=new THREE.MeshStandardMaterial({map:flowerTex,alphaTest:0.4,side:THREE.DoubleSide,roughness:1});
  patchWindFade(flowerMat);   // цветочки качаются и растворяются по зуму вместе с травой
  const mkPlane=rot=>{ const p=new THREE.PlaneGeometry(1.45,0.62); p.translate(0,0.31,0); p.rotateY(rot); return p; };   // для точек-соцветий крестик из двух плашек достаточен
  const fgeo=mergeGeometries([mkPlane(0),mkPlane(Math.PI/2)]);
  window.__rebuildGrass(SETTINGS.grassD);   // первая посадка — с сохранённой густотой
}
// «просека»: убрать деревья вдоль дороги — вместо scene.remove() схлопываем инстанс в точку
// (масштаб 0) в его InstancedMesh; убранное дерево уже не восстанавливается (как и раньше).
function removeTreesNear(x,z,r){
  const touched=new Set(), zeroM=new THREE.Matrix4().makeScale(0,0,0);
  const c0x=Math.floor((x-r)/TG_CELL), c1x=Math.floor((x+r)/TG_CELL),
        c0z=Math.floor((z-r)/TG_CELL), c1z=Math.floor((z+r)/TG_CELL);
  for(let cx=c0x;cx<=c1x;cx++)for(let cz=c0z;cz<=c1z;cz++){
    const a=TREE_GRID.get(cx+'|'+cz); if(!a) continue;
    for(const t of a){
      if(t.removed || Math.hypot(t.x-x,t.z-z)>=r) continue;
      t.removed=true;
      for(const p of t.parts){ p.im.setMatrixAt(p.idx, zeroM); touched.add(p.im); }
    }
  }
  for(const im of touched) im.instanceMatrix.needsUpdate=true;
}

// Настоящие горы — ТОЛЬКО сам рельеф (MTN_PEAKS в hAt(), кластер смещённых вершин, гладкая сетка

// --- облака: настоящие 3D-модели (KayKit, взяты из старой архивной демки rich.html), плывут над картой ---
const CLOUD_RANGE = HALF+14;                       // за этой границей облако телепортируется на противоположный край (замкнутый цикл)
function cloudWrap(v){ const s=CLOUD_RANGE*2; return ((v+CLOUD_RANGE)%s+s)%s - CLOUD_RANGE; }
const CLOUDS=[];
{
  const gltf=new GLTFLoader();
  const load=(name)=>new Promise(res=>gltf.load('models/'+name+'.glb',
    g=>{ g.scene.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=false; } }); res(g.scene); },
    undefined, ()=>res(null)));
  Promise.all([load('cloud_big'), load('cloud_small')]).then(([big,small])=>{
    const models=[big,small].filter(Boolean);
    if(!models.length) return;
    for(let i=0;i<14;i++){

      CLOUDS.push({obj:o, x0,z0,y0, dir:Math.random()*Math.PI*2, speed:0.25+Math.random()*0.35, bobPh:Math.random()*10});
    }
  });
}

// --- ДОРОГИ: форма = чистый МАРШРУТ между городами; ПРОЯВЛЯЮТСЯ и толстеют от хода к ходу ---

// «использование» рёбер roadUse (растёт где ездят, гаснет где забросили). Форма чистая (без

const roadGroup=new THREE.Group(); scene.add(roadGroup);

function hash2(x,z){ const s=Math.sin(x*12.9898+z*78.233)*43758.5453; return s-Math.floor(s); }

function ribbon(pts, halfW, mat, lift){
  const n=pts.length, v=[], idx=[];
  for(let i=0;i<n;i++){
    const a=pts[i], p=pts[Math.min(i+1,n-1)], q=pts[Math.max(i-1,0)];
    let dx=p[0]-q[0], dz=p[2]-q[2]; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const wob=0.86+0.28*hash2(a[0]*1.7+i*0.3, a[2]*1.7);   // 0.86..1.14 — лёгкая неровность краёв
    const hw=halfW*wob, px=-dz*hw, pz=dx*hw;
    v.push(a[0]+px, a[1]+lift, a[2]+pz,  a[0]-px, a[1]+lift, a[2]-pz);
  }
  for(let i=0;i<n-1;i++){ const o=i*2; idx.push(o,o+1,o+2, o+1,o+3,o+2); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  g.setIndex(idx); g.computeVertexNormals();
  const mm=mat.clone(); mm.side=THREE.DoubleSide;
  const m=new THREE.Mesh(g,mm); m.receiveShadow=true; return m;
}
// Сдвинуть полилинию вбок по локальной нормали на off (для колей), посадив на рельеф.
function offsetPoly(pts, off){
  const out=[], n=pts.length;
  for(let i=0;i<n;i++){
    const p=pts[Math.min(i+1,n-1)], q=pts[Math.max(i-1,0)];
    let dx=p[0]-q[0], dz=p[2]-q[2]; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const x=pts[i][0]+(-dz)*off, z=pts[i][2]+dx*off;

// Сглаживание Чайкина: срезаем углы, РАССЛАБЛЯЯ ломаную (не проходим через каждую точку) —
// убирает «пилу» и зигзаги, в отличие от сплайна, который вильнувшую цепочку раздувал в петли.
function chaikin(pts, iters){
  let p=pts;
  for(let k=0;k<iters;k++){
    const out=[p[0]];
    for(let i=0;i<p.length-1;i++){
      const a=p[i], b=p[i+1];
      out.push([a[0]*0.75+b[0]*0.25, 0, a[2]*0.75+b[2]*0.25]);
      out.push([a[0]*0.25+b[0]*0.75, 0, a[2]*0.25+b[2]*0.75]);
    }
    out.push(p[p.length-1]); p=out;
  }

}
// Плавная линия дороги через центры гексов цепочки, посаженная на рельеф.
function smoothChain(hexSeq){
  if(hexSeq.length<2) return null;
  let pts=hexSeq.map(n=>[hexes[n].x,0,hexes[n].z]);
  const n=pts.length;
  if(n>=3){                                              // пологая «змейка» вдоль пути — не «линейка»
    const seed=hash2(pts[0][0],pts[0][2]);
    const amp=0.40*(0.6+seed);                           // поперечный размах (меньше гекса)
    const ph=seed*6.283, freq=1.4+seed*1.6;              // 1.4..3 мягких волны на перегон
    for(let k=1;k<n-1;k++){
      const a=pts[k+1], b=pts[k-1]; let dx=a[0]-b[0], dz=a[2]-b[2]; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
      const u=k/(n-1);
      const env=Math.sin(u*Math.PI);                     // затухание у обоих концов — к поселению подходит чисто
      const w=Math.sin(u*Math.PI*2*freq+ph)*amp*env;
      pts[k]=[pts[k][0]+(-dz)*w, 0, pts[k][2]+dx*w];
    }
  }
  if(n>2) pts=chaikin(pts,3);
  return pts.map(p=>[p[0], hAt(p[0],p[2]), p[2]]);

// Собрать «горячие» рёбра (hot[e]) в непрерывные цепочки; отдаём и рёбра цепочки (для толщины).
function traceChains(hot){
  const adj=new Map();
  const push=(n,o,e)=>{ if(!adj.has(n))adj.set(n,[]); adj.get(n).push({o,e}); };
  for(let e=0;e<NE;e++){ if(!hot[e]) continue; push(edges[e].i,edges[e].j,e); push(edges[e].j,edges[e].i,e); }
  const deg=n=>adj.has(n)?adj.get(n).length:0;

  const cx=hexes[i].x, cz=hexes[i].z; let s=costAt(cx,cz);

  // ребра → пройти сквозь поле ~в 8 раз дороже луга, но не стена (если поле перекрыло единственный коридор — пройдёт).

const _dist=new Float64Array(NH), _prev=new Int32Array(NH), _done=new Uint8Array(NH);

// Остовное дерево (MST, алгоритм Крускала): соединяем ВСЕ поселения минимально нужным числом

// в принципе: сеть — чистое ветвящееся дерево (ствол → ветки → веточки к деревушкам).
function roadPairs(){
  const n=LM.length; if(n<2) return [];
  const cand=[];
  for(let a=0;a<n;a++) for(let b=a+1;b<n;b++)
    cand.push([(LM[a].x-LM[b].x)**2+(LM[a].z-LM[b].z)**2, a, b]);
  cand.sort((p,q)=>p[0]-q[0]);                            // от самых коротких пар к длинным
  const par=Array.from({length:n},(_,i)=>i);             // «кто мой корень» (union-find)
  const find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };

// накопитель «использования» рёбер (растёт от хода к ходу) + поле дорог для притяжения людей
const roadUse=new Float32Array(NE), hexRoad=new Float32Array(NH);
const _flow=new Float32Array(NE);
let roadUseMax=1e-6;                                     // макс. использования (для нормировки прилипания)
// Эталон толщины дороги: рисуем ширину ОТНОСИТЕЛЬНО «зрелой» дороги, а не текущего максимума.
// Тогда стартовые тропинки (использование ~0.03) выходят тонкой ниточкой, а к зрелости
// (использование ~0.68 при зарастании 0.88, ✅ измерено ход 100) дорастают до нормальной дороги.
// Ратчет: только растёт (если карта перегонит эталон), не даёт дорогам «толстеть скачком». Сброс в newWorld.
const ROAD_REF=0.65; let roadRefMax=ROAD_REF;
function growRoads(){                                    // ВЫЗЫВАТЬ раз в ход
  _flow.fill(0);
  for(const [a,b] of roadPairs()){
    const sa=hexOfWorld(LM[a].x,LM[a].z), sb=hexOfWorld(LM[b].x,LM[b].z);
    if(sa<0||sb<0||sa===sb) continue;
    const path=dijkstra(sa,sb); if(!path||path.length<2) continue;
    const dist=Math.hypot(LM[a].x-LM[b].x,LM[a].z-LM[b].z);
    const g=LM[a].size*LM[b].size/(dist*dist+40);        // большие+близкие города = сильнее
    for(let n=0;n<path.length-1;n++){ const e=edgeOf(path[n],path[n+1]); if(e>=0) _flow[e]+=g; }
  }
  for(let e=0;e<NE;e++) roadUse[e]=roadUse[e]*0.88 + _flow[e];   // растёт где ездят, брошенное зарастает за ~25 ходов (было 0.97 ≈ 100)
  let mx=1e-6; for(let e=0;e<NE;e++) if(roadUse[e]>mx) mx=roadUse[e];
  roadUseMax=mx;                                         // для прилипания на следующем ходу
  if(mx>roadRefMax) roadRefMax=mx;                       // эталон толщины ратчетом растёт, если карта перегнала
  hexRoad.fill(0);
  for(let e=0;e<NE;e++){ const v=roadUse[e]/mx;
    if(v>hexRoad[edges[e].i]) hexRoad[edges[e].i]=v;
    if(v>hexRoad[edges[e].j]) hexRoad[edges[e].j]=v; }
}
// Стартовые тропинки: между уже стоящими деревнями протаптываем тонкую сеть ЕЩЁ ДО первого хода.
// Это те же дороги-маршруты (MST + Дейкстра), просто «наезженные» на несколько ходов вперёд —
// поэтому без дублей и развязок (дерево!), а форма/обход леса те же, что у обычного алгоритма.
// Люди сразу тянутся к ним (hexRoad), новые деревни достраиваются нашим алгоритмом поверх.
function seedStarterRoads(){ for(let k=0;k<8;k++) growRoads(); }
// Провести штрих кистью по точкам px (в пикселях текстуры).
function strokePath(px, w, style){
  if(px.length<2) return;
  groundCtx.lineWidth=Math.max(0.6,w); groundCtx.strokeStyle=style;
  groundCtx.beginPath(); groundCtx.moveTo(px[0][0],px[0][1]);
  for(let k=1;k<px.length;k++) groundCtx.lineTo(px[k][0],px[k][1]);
  groundCtx.stroke();
}
// Дороги = ВЫТОПТАННАЯ ЗЕМЛЯ, нарисованная прямо в текстуре грунта (кистью). Каждый ход:
// кладём чистый грунт baseIm, поверх рисуем свежие тропы → они врастают в землю, а не лежат лентой.
function rebuildRoads(){
  groundCtx.drawImage(baseCvs,0,0);
  let mx=1e-6; for(let e=0;e<NE;e++) if(roadUse[e]>mx) mx=roadUse[e];
  if(mx>=1e-4){
    const S=TEX/SIZE, ref=roadRefMax, TH=mx*0.05, hot=new Uint8Array(NE);  // порог 5% от текущего макс — слабые «призраки» перекладки не рисуем
    for(let e=0;e<NE;e++) hot[e]= roadUse[e]>=TH ? 1 : 0;
    groundCtx.lineCap='round'; groundCtx.lineJoin='round';
    const toPx=p=>[(p[0]+HALF)*S,(p[2]+HALF)*S];
    for(const ch of traceChains(hot)){
      let f=0; for(const e of ch.es) f+=roadUse[e]; f/=ch.es.length;
      const t=Math.min(1, f/ref);                           // 0..1 — сила дороги ОТНОСИТЕЛЬНО зрелой (не текущей)
      const sm=smoothChain(ch.seq); if(!sm) continue;       // чистая линия, без «червяка»
      const px=sm.map(toPx);
      const core=(0.13+0.62*Math.sqrt(t))*S;                // полная ширина сердцевины (мир·S) — ТОНКО
      strokePath(px, core*1.9, 'rgba(150,126,86,0.18)');    // мягкая обочина (врастает в траву)
      strokePath(px, core,     'rgba(122,98,60,0.85)');     // утоптанная сердцевина
      if(t>=0.6) strokePath(px, core*0.5, 'rgba(96,74,44,0.85)'); // наезженные — тёмное ядро
      // ПРОСЕКА: убрать деревья вдоль тропы, чтобы не «сквозь стоящие деревья»
      const clr=Math.max(0.85, core/S*0.7+0.6);
      for(const p of sm) removeTreesNear(p[0], p[2], clr);
    }
  }
  window.__groundTex.needsUpdate=true;
}

const LM3D=[];
// Декор деревень живёт в модуле initSurvey (там IND/decoFence/decoCrops) — снаружи зовём через __survey.
function clearVillageDecor(i){ const s=window.__survey; if(s&&s.clearVillageDecor) s.clearVillageDecor(i); }

// ТЕРРАСА (2026-07-12). Поселение ставится в ОДНУ точку — высоту центра клетки, — поэтому на склоне
// половина домов висела в воздухе (видно на скринах у реки). Подкладываем насыпь: плоская площадка на
// уровне поселения и стенка, уходящая вниз до самой низкой земли под пятном. Так люди и строили на
// склоне — срезали и подсыпали. На ровном месте (перепад мал) терраса не нужна и не создаётся.
const TER_MAT=new THREE.MeshStandardMaterial({color:0x8f7a55, roughness:1});
function terraceFor(lm, sz){
  const R=1.35+0.32*sz;                                   // площадка чуть шире пятна построек
  let lo=lm.y;
  for(let a=0;a<12;a++){ const th=a*Math.PI/6;
    const h=hAt(lm.x+Math.cos(th)*R, lm.z+Math.sin(th)*R); if(h<lo) lo=h; }
  const drop=lm.y-lo;
  if(drop<0.35) return null;                              // ровно — терраса ни к чему
  const dep=drop+0.45;                                    // стенка уходит ниже земли, чтобы не было щели
  const m=new THREE.Mesh(new THREE.CylinderGeometry(R, R*0.94, dep, 24), TER_MAT);
  m.position.y = -dep/2 + 0.06;                           // верх площадки — вровень с поселением (группа уже на lm.y)
  m.receiveShadow=true; m.castShadow=true;
  return m;
}
const CL_SCALE=0.34;   // «вариант 1»: поселение целиком в одном тайле (2026-07-15, tg 1102)
// ВОРОТА К ДОРОГЕ (просьба пользователя 2026-07-15): посёлок разворачивается воротами
// (местная ось +z кластера — там ворота ограды и входы зданий) к самой наезженной дороге
// у своей клетки. Дорог рядом нет — прежний псевдослучайный угол. Пересчитывается при
// (пере)сборке кластера, т.е. при основании и каждом росте — посёлки не крутятся на глазах.
function gateRot(lm, i){
  const h=hexOfWorld(lm.x,lm.z);
  let best=0, bx=0, bz=0;
  if(h>=0) for(const [dq,dr] of HN){
    const jk=key(hexes[h].q+dq, hexes[h].r+dr); if(!hexIdx.has(jk)) continue;
    const j=hexIdx.get(jk), e=edgeOf(h,j); if(e<0) continue;
    if(roadUse[e]>best){ best=roadUse[e]; bx=hexes[j].x-lm.x; bz=hexes[j].z-lm.z; }
  }
  if(best < (roadUseMax||1e-6)*0.05 || (bx===0&&bz===0)) return (i*2.399)%6.28;  // рядом нет заметной дороги
  return Math.atan2(bx,bz);   // rotation.y=rot разворачивает местную +z в (sin·rot, cos·rot) — на дорогу
}
function syncSettlements(){
  for(let i=0;i<LM.length;i++){
    const lm=LM[i], si=stageIdxH(lm);
    const ep=archFor(si,turn), sz=si+1, kind=kindOf(lm), col=lmColor(lm);
    const key=ep+'|'+sz+'|'+kind+'|'+(kind==='capital'?col:0);
    if(!LM3D[i]){ LM3D[i]={key:null,group:null}; }
    const rec=LM3D[i];
    if(rec.key!==key){
      if(rec.group){ scene.remove(rec.group); rec.group.traverse(c=>{ if(c.geometry) c.geometry.dispose(); }); }
      const rot=gateRot(lm, i);
      // МАСШТАБ ПОСЕЛЕНИЯ = ОДИН ТАЙЛ (выбор пользователя 2026-07-15, «вариант 1», tg 1102):
      // застройка ×0.34 — весь кластер, включая ограду, помещается в гекс r=2.0.
      // ?clscale=N — служебная примерка другого масштаба поверх.
      const _cls=+(new URLSearchParams(location.search).get('clscale'))||CL_SCALE;
      const g=LAB_ARCH[ep] ? labCluster(ep,sz,{kind,color:col,at:{x:lm.x,z:lm.z,rot,scl:_cls}})
                           : cluster(ep,sz,{onPad:false,kind,color:col});   // v2-силуэты ранних эпох

      if(LAB_ARCH[ep]) mergeClusterMeshes(g);   // §T1: слить кластер в горстку мешей (после enrichCluster — тона уже розданы)
      g.scale.setScalar(_cls);
      g.position.set(lm.x, lm.y, lm.z); g.rotation.y=rot; scene.add(g);
      const ter=terraceFor(lm, sz); if(ter) g.add(ter);       // насыпь-терраса, если поселение стоит на склоне

  drawCapitalZone();
}

function pendingTask(){

}

  document.head.appendChild(st); document.body.appendChild(tip);

  // подсветка гекса под курсором — шестиугольник, ПРОДРАПИРОВАННЫЙ по рельефу (углы и центр
  // сидят на реальной высоте земли), поэтому закрашивается вся клетка, а не только её низ.
  const hlGeo=new THREE.BufferGeometry();
  hlGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(6*3*3),3));
  const hl=new THREE.Mesh(hlGeo, new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,
    opacity:0.30,depthWrite:false,side:THREE.DoubleSide}));

  const _hp=hlGeo.attributes.position.array;
  function drapeHex(i){
    const cx=hexes[i].x, cz=hexes[i].z, lift=0.12;

    for(let k=0;k<6;k++){ const a=cs[k], b=cs[(k+1)%6];

      _hp[o++]=b[0]-cx; _hp[o++]=hAt(b[0],b[1])+lift; _hp[o++]=b[1]-cz;

    const add=(x,z)=>{ const b=biomeAt(x,z); cnt[b]=(cnt[b]||0)+1; };
    add(cx,cz);
    for(let k=0;k<6;k++){ const a=Math.PI/3*k; add(cx+Math.cos(a)*HEX*0.6, cz+Math.sin(a)*HEX*0.6); }

  // клетка зовётся «Река». Глубина/брод оцениваются по полуширине hww: у истока река узкая и мелкая
  // (дорога там и переправляется — тот же принцип, что в стоимости riverCross), к устью — широкая и глубокая.
  function riverNear(x,z){

      const rv=(b!==B_WATER && riverHex.has(i)) ? riverNear(hit.point.x,hit.point.z) : null;

        // ручей у истока мелкий, к устью полноводно. У стволов/вытока aw нет — прежняя оценка по ширине.
        const a=rv.aw>=0 ? rv.aw : (rv.hw<0.40 ? 0.2 : rv.hw<0.80 ? 0.5 : 0.9);

      const depth = WATER - hit.point.y;

  function reveal(){

    const SCANR=capitalCtrlRadius(cap);                   // осмотр = ровно зона досягаемости (кольца тела города + 4), один источник правды
    const taken=new Set(); INDUSTRIES.forEach(r=>r.cells.forEach(c=>taken.add(c)));   // уже занятые угодья повторно не предлагаем
    const distC=i=>hdist(hexes[i], c0);                   // расстояние тайла от города (в гексах)
    const typeOf=new Map();
    hexes.forEach((h,i)=>{ if(hdist(h,c0)<=1) return; if(hdist(h,c0)>SCANR) return; if(taken.has(i)) return;   // ближний ряд свободен под застройку; занятые угодья пропускаем
      if(riverHex.has(i)) return;                         // клетка РУСЛА — не угодье: пашня обрубала ленту реки (план №5, скрин 15.08 16:24)
      const r=RES[biomeAt(h.x,h.z)]; if(r) typeOf.set(i,r); });
    const sameNbr=(j,r)=>{ const hj=hexes[j], out=[];    // соседи того же ресурса в зоне осмотра
      HN.forEach(([dq,dr])=>{ const nk=key(hj.q+dq,hj.r+dr); if(!hexIdx.has(nk)) return;
        const ni=hexIdx.get(nk); const nr=typeOf.get(ni); if(nr&&nr.key===r.key) out.push(ni); }); return out; };
    const seen=new Set(), patches=[];
    typeOf.forEach((r,i)=>{ if(seen.has(i)) return;
      const comp=[], st=[i]; seen.add(i);               // 1) связная компонента одного типа
      while(st.length){ const j=st.pop(); comp.push(j);
        sameNbr(j,r).forEach(ni=>{ if(!seen.has(ni)){ seen.add(ni); st.push(ni); } }); }
      // Режем компоненту на РАВНЫЕ КОМПАКТНЫЕ СВЯЗНЫЕ поля, КАЖДОЕ ≤PATCHMAX клеток. (Переписано 2026-07-09:
      // прежний Вороной+балансировка давал ~22% полей-ГАНТЕЛЕЙ — комок+перешеек+комок; пользователь: «поля кучнее».)
      // splitInto(k): 1) k зёрен дальней выборкой; 2) ВОРОНОЙ (клетка к ближнему зерну) — РАВНЫЕ компактные куски
      //   плотно у семёрки; 3) починка связности (крупнейший блок полю, оторванные → соседу = один остров); 4)
      //   балансировка до равных, но ход, рождающий ГАНТЕЛЬ у любого поля, ЗАПРЕЩЁН (это и держит поля кучными);
      //   5) «разжать гантель» — остаточную гантель распускаем, меньшую долю за перешейком отдаём соседу. Затем: если
      //   поле всё же >PATCHMAX — увеличиваем k и режем заново.
      // Проверено node-моделью (scratchpad/field_model.mjs) на 3000 форм: гантелей 0.9% (было 22.2%), 0 разрывов,
      // 0 полей>7, средний размер поля 5.9 (у семёрки), разброс 0.6 (равные).
      const n=comp.length, cells=[...comp];
      const SN=j=>sameNbr(j,r);                              // соседи того же угодья
      const conn=arr=>{ if(arr.length<=1) return true; const set=new Set(arr),seen=new Set([arr[0]]),st=[arr[0]];
        while(st.length){ const c=st.pop(); SN(c).forEach(ni=>{ if(set.has(ni)&&!seen.has(ni)){ seen.add(ni); st.push(ni); } }); } return seen.size===arr.length; };
      const dumb=arr=>{ if(arr.length<4) return false; const set=new Set(arr);   // гантель: есть клетка-перешеек, разрыв которой даёт две доли по ≥2 клетки
        for(const cut of arr){ const rest=arr.filter(x=>x!==cut); const vis=new Set(),blocks=[];
          for(const s0 of rest){ if(vis.has(s0)) continue; const cc=[],q=[s0]; vis.add(s0);
            while(q.length){ const c=q.pop(); cc.push(c); SN(c).forEach(ni=>{ if(set.has(ni)&&ni!==cut&&!vis.has(ni)){ vis.add(ni); q.push(ni); } }); } blocks.push(cc); }
          blocks.sort((a,b)=>b.length-a.length); if(blocks.length>=2&&blocks[1].length>=2) return true; } return false; };
      const splitInto=(k)=>{
        // 1) k зёрен дальней выборкой (разнесены по пятну)
        const seeds=[]; { let s=cells[0],bd=-1; cells.forEach(j=>{ const d=distC(j); if(d>bd){ bd=d; s=j; } }); seeds.push(s); }
        while(seeds.length<k){ let s=-1,bd=-1; cells.forEach(j=>{ let md=Infinity; seeds.forEach(sd=>{ const d=hdist(hexes[j],hexes[sd]); if(d<md)md=d; }); if(md>bd){ bd=md; s=j; } }); seeds.push(s); }
        // 2) ВОРОНОЙ: каждая клетка к БЛИЖНЕМУ зерну → равные компактные куски, плотно у семёрки (как нравилось пользователю).
        const owner=new Map(); cells.forEach(j=>{ let bi=0,bd=Infinity; seeds.forEach((sd,si)=>{ const d=hdist(hexes[j],hexes[sd]); if(d<bd){ bd=d; bi=si; } }); owner.set(j,bi); });
        const pc=si=>cells.filter(j=>owner.get(j)===si);
        // 3) ПОЧИНКА связности: у поля крупнейший блок — своё, оторванные под-блоки → соседу (каждое поле один остров).
        const repair=()=>{ for(let pass=0; pass<n+2; pass++){ let dirty=false;
            for(let si=0; si<k; si++){ const mine=pc(si); if(mine.length<=1) continue; const seen=new Set(),comps=[];
              for(const s0 of mine){ if(seen.has(s0)) continue; const cc=[],st=[s0]; seen.add(s0);
                while(st.length){ const j=st.pop(); cc.push(j); SN(j).forEach(ni=>{ if(owner.get(ni)===si&&!seen.has(ni)){ seen.add(ni); st.push(ni); } }); } comps.push(cc); }
              if(comps.length<=1) continue; dirty=true; comps.sort((a,b)=>b.length-a.length);
              for(let c=1;c<comps.length;c++){ const orph=comps[c]; let tgt=-1;
                for(const j of orph){ for(const ni of SN(j)){ const o=owner.get(ni); if(o!==si){ tgt=o; break; } } if(tgt>=0) break; }
                if(tgt<0) tgt=si; orph.forEach(j=>owner.set(j,tgt)); } }
            if(!dirty) break; } };
        const stays=(j,oj)=>conn(pc(oj).filter(x=>x!==j));
        repair();
        // 4) БАЛАНСИРОВКА до равных, но ход, рождающий гантель у любого поля, — ЗАПРЕЩЁН (это и держит поля кучными).
        for(let it=0; it<n*8 && k>1; it++){ const c=cells.reduce((a,j)=>(a[owner.get(j)]++,a),new Array(k).fill(0));
          const order=[...c.keys()].sort((a,b)=>c[a]-c[b]); const big=order[order.length-1];
          if(c[big]-c[order[0]]<=1) break; let moved=false;
          for(const sm of order){ if(c[sm]>=c[big]) break;
            for(const j of cells){ const oj=owner.get(j); if(oj===sm||c[oj]<=c[sm]+1) continue;
              if(!SN(j).some(ni=>owner.get(ni)===sm)||!stays(j,oj)) continue;
              if(dumb([...pc(sm),j])||dumb(pc(oj).filter(x=>x!==j))) continue;
              owner.set(j,sm); moved=true; break; }
            if(moved) break; }
          if(!moved) break; }
        repair();
        // 5) РАЗЖАТЬ ГАНТЕЛЬ: у гантельного поля меньшую долю за перешейком отдаём примыкающему соседу (если тот ≤PATCHMAX и не станет гантелью).
        for(let pass=0; pass<3; pass++){ let fixed=false;
          for(let si=0; si<k; si++){ const piece=pc(si); if(!dumb(piece)) continue;
            let give=null; const set=new Set(piece);
            for(const cut of piece){ const rest=piece.filter(x=>x!==cut); const vis=new Set(),blocks=[];
              for(const s0 of rest){ if(vis.has(s0)) continue; const cc=[],q=[s0]; vis.add(s0);
                while(q.length){ const c2=q.pop(); cc.push(c2); SN(c2).forEach(ni=>{ if(set.has(ni)&&ni!==cut&&!vis.has(ni)){ vis.add(ni); q.push(ni); } }); } blocks.push(cc); }
              blocks.sort((a,b)=>b.length-a.length); if(blocks.length>=2&&blocks[1].length>=2){ give=blocks[blocks.length-1]; break; } }
            if(!give) continue; const gset=new Set(give);
            const tc=new Map(); give.forEach(j=>SN(j).forEach(ni=>{ const o=owner.get(ni); if(o!==si&&!gset.has(ni)) tc.set(o,(tc.get(o)||0)+1); }));
            let tgt=-1,bt=0; tc.forEach((v,o)=>{ if(v>bt){ bt=v; tgt=o; } }); if(tgt<0) continue;
            const tAfter=[...pc(tgt),...give]; if(tAfter.length>PATCHMAX||dumb(tAfter)||!conn(tAfter)) continue;
            const gAfter=piece.filter(j=>!gset.has(j)); if(gAfter.length&&!conn(gAfter)) continue;
            give.forEach(j=>owner.set(j,tgt)); fixed=true; }
          if(!fixed) break; }
        const pieces=Array.from({length:k},()=>[]); owner.forEach((v,j)=>pieces[v].push(j)); return pieces;
      };
      // ЖАДНАЯ НАБИВКА (2026-07-10). Вороной делит пятно «поровну», и на тонком вьющемся луге-ЗМЕЙКЕ (а настоящие
      // луга между лесом и горами именно такие) куски вылезают за 7 → k растёт → вместо 3 полей по ~6 выходит 4 по ~4.
      // Здесь растим поле-блоб от края внутрь, добирая соседа с максимальной связью с блобом, до цели
      // target=ceil(остаток/ceil(остаток/7)): полей всегда минимум (ceil(n/7)), и они не «7,7,3», а ровные 6,6,5.
      const greedyFit=()=>{
        const un=new Set(cells), out=[];
        while(un.size){
          const rem=un.size, target=Math.ceil(rem/Math.max(1,Math.ceil(rem/PATCHMAX)));
          let cq=0,cr=0; un.forEach(j=>{ cq+=hexes[j].q; cr+=hexes[j].r; }); const ct={q:cq/rem,r:cr/rem};
          let seed=-1,bd=-1; un.forEach(j=>{ const d=hdist(hexes[j],ct); if(d>bd){ bd=d; seed=j; } });   // зерно = крайняя клетка остатка (растём от края внутрь — остаток не рвётся)
          const blob=new Set([seed]); un.delete(seed);
          while(blob.size<target){
            const cand=new Set(); blob.forEach(j=>SN(j).forEach(ni=>{ if(un.has(ni)) cand.add(ni); }));
            if(!cand.size) break;                            // блоб упёрся в тупик (узкое место змейки) — остаток пойдёт в следующее поле
            let bq=0,br=0; blob.forEach(j=>{ bq+=hexes[j].q; br+=hexes[j].r; }); const bc={q:bq/blob.size,r:br/blob.size};
            let bj=-1,bnb=-1,bd2=Infinity;                   // берём соседа с макс. связью (заполняем вырезы), при равенстве — ближе к центру блоба (кучность)
            cand.forEach(j=>{ const nb=SN(j).filter(ni=>blob.has(ni)).length, d=hdist(hexes[j],bc);
              if(nb>bnb||(nb===bnb&&d<bd2)){ bnb=nb; bd2=d; bj=j; } });
            blob.add(bj); un.delete(bj);
          }
          out.push([...blob]);
        }
        return out;
      };
      // УПАКОВКА (2026-07-09). Обе нарезки выше промахиваются мимо МИНИМУМА полей ceil(n/7) на вытянутых кусках:
      // Вороной лезет за потолок → k++ → лишнее поле; жадная набивка ПЕРЕКУСЫВАЕТ остаток пополам → хвосты 7+4+3.
      // Пользователь на скрине: кусок луга 14 клеток вышел 3+5+6 вместо 7+7. Здесь поле растёт из ТУПИКА (клетка
      // с наименьшим числом соседей по остатку) и клетка НЕ берётся, если после неё остаток распадается на части;
      // затем соседние поля сливаются, пока сумма ≤7, а одиночная клетка пристраивается к соседу (но НЕ выше потолка).
      // Проверено node (scratchpad/hybrid3.mjs, 3000 лугов): лишнее поле/потерянная клетка 4.8%→0.2% на компактных
      // и 7.8%→0.4% на змейках; брошенных клеток почти ноль; гантелей 9.4%→10.8%; полей >7 нет.
      const packFit=()=>{
        const un=new Set(cells), out=[];
        const nbrIn=(j,set)=>SN(j).filter(ni=>set.has(ni));
        while(un.size){
          const rem=un.size, target=Math.min(PATCHMAX, Math.ceil(rem/Math.max(1,Math.ceil(rem/PATCHMAX))));
          let seed=-1,bn=99; un.forEach(j=>{ const d=nbrIn(j,un).length; if(d<bn){ bn=d; seed=j; } });   // зерно — самая «глухая» клетка
          const blob=new Set([seed]); un.delete(seed);
          while(blob.size<target && un.size){
            const cand=[]; blob.forEach(j=>nbrIn(j,un).forEach(ni=>{ if(!cand.includes(ni)) cand.push(ni); }));
            if(!cand.length) break;
            const safe=cand.filter(j=>{ const rest=[...un].filter(x=>x!==j); return !rest.length||conn(rest); });  // не рвать остаток
            let pool=safe.length?safe:cand;
            const nice=pool.filter(j=>!dumb([...blob,j])); if(nice.length) pool=nice;                              // не рождать гантель
            let bq=0,br=0; blob.forEach(j=>{ bq+=hexes[j].q; br+=hexes[j].r; }); const bc={q:bq/blob.size,r:br/blob.size};
            let bj=-1,bnb=-1,bd=Infinity;                    // сосед с макс. связью, при равенстве — ближе к центру блоба
            pool.forEach(j=>{ const nb=nbrIn(j,blob).length, d=hdist(hexes[j],bc);
              if(nb>bnb||(nb===bnb&&d<bd)){ bnb=nb; bd=d; bj=j; } });
            blob.add(bj); un.delete(bj);
          }
          out.push([...blob]);
        }
        const adjac=(a,b)=>a.some(j=>SN(j).some(ni=>b.includes(ni)));
        for(let merged=true; merged;){ merged=false; out.sort((a,b)=>a.length-b.length);   // слить соседей, пока влезает в потолок
          outer: for(let i=0;i<out.length;i++) for(let k2=i+1;k2<out.length;k2++){
            const sum=out[i].concat(out[k2]);
            if(sum.length<=PATCHMAX && adjac(out[i],out[k2]) && !dumb(sum)){ out[i]=sum; out.splice(k2,1); merged=true; break outer; } } }
        for(let i=out.length-1;i>=0;i--){ if(out[i].length>=2) continue;                    // одиночку — соседу, но не выше потолка
          const cell=out[i][0]; let tgt=-1,best=99;
          out.forEach((f,k2)=>{ if(k2===i||f.length>=PATCHMAX||!f.some(j=>SN(j).includes(cell))) return;
            const sc=f.length+(dumb([...f,cell])?100:0); if(sc<best){ best=sc; tgt=k2; } });
          if(tgt>=0){ out[tgt].push(cell); out.splice(i,1); } }
        return out;
      };
      // Берём ЛУЧШУЮ из ТРЁХ нарезок: меньше полей → меньше брошенных клеток → меньше гантелей → ровнее размеры.
      // Проверено node-моделью (scratchpad/field_model.mjs, 3000 форм каждого класса): на змейках лишних полей 0.9%
      // (было 37%), средний размер 5.69 при теоретическом пределе 5.77; на компактных пятнах 5.94 при пределе 5.95,
      // гантелей 1%. Ноль потерянных клеток, ноль полей >7, ноль разрывов — в обоих классах форм.
      const scoreOf=pl=>{ const real=pl.filter(p=>p.length>=2), sz=real.map(p=>p.length);
        return { real, fields:real.length, lost:pl.reduce((s,p)=>s+(p.length<2?p.length:0),0),
                 dumb:real.filter(p=>dumb(p)).length, spread:sz.length?Math.max(...sz)-Math.min(...sz):0 }; };
      let k=Math.max(1,Math.ceil(n/PATCHMAX)), A=splitInto(k);
      while(k<n && Math.max(0,...A.map(p=>p.length))>PATCHMAX){ k++; A=splitInto(k); }   // поле вылезло за потолок → больше полей
      const better=(x,y)=>(x.fields!==y.fields ? (x.fields<y.fields) : x.lost!==y.lost ? (x.lost<y.lost)
                : x.dumb!==y.dumb ? (x.dumb<y.dumb) : x.spread<=y.spread) ? x : y;
      const win=better(better(scoreOf(A), scoreOf(greedyFit())), scoreOf(packFit()));
      win.real.forEach(pc=>patches.push({r,cells:pc}));
    });
    const W=0.30;                                        // полуширина ленты-контура (мировые ед.) — «жирная» линия вместо тонкой
    patches.forEach(p=>{
      const set=new Set(p.cells), pos=[];
      const y=(x,z)=>hAt(x,z)+0.16;
      const ribbon=(ax,az,bx,bz)=>{                      // плоская лента по ребру: смещаем концы ±перпендикуляр в плоскости XZ
        let px=-(bz-az), pz=(bx-ax); const pl=Math.hypot(px,pz)||1; px=px/pl*W; pz=pz/pl*W;
        const a1x=ax+px,a1z=az+pz, a2x=ax-px,a2z=az-pz, b1x=bx+px,b1z=bz+pz, b2x=bx-px,b2z=bz-pz;
        pos.push(a1x,y(a1x,a1z),a1z, a2x,y(a2x,a2z),a2z, b1x,y(b1x,b1z),b1z,   // 2 треугольника = квад-полоска
                 a2x,y(a2x,a2z),a2z, b2x,y(b2x,b2z),b2z, b1x,y(b1x,b1z),b1z);
      };
      p.cells.forEach(j=>{ const hj=hexes[j], cor=hexCorners(hj.x,hj.z);
        HN.forEach(([dq,dr],d)=>{ const nk=key(hj.q+dq,hj.r+dr);
          if(hexIdx.has(nk)&&set.has(hexIdx.get(nk))) return;
          const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]];
          ribbon(A[0],A[1],B[0],B[1]); }); });
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
      const rib=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:p.r.col,transparent:true,opacity:0.92,depthTest:false,side:THREE.DoubleSide}));
      rib.renderOrder=7; grp.add(rib);
    });
    // сохранить пятна для слоя 2 (клик по угодью → выбор промысла)
    foundPatches=patches.map(p=>{ const set=new Set(p.cells);
      let target=p.cells[0], bd=Infinity;                 // целевая клетка = ближняя к городу ПО ПРЯМОЙ (не по гекс-дистанции:
      p.cells.forEach(j=>{ const dx=hexes[j].x-cap.x, dz=hexes[j].z-cap.z;   // среди равных по гексам выбирает реально ближнюю → хижина у ближнего края, дорога короче)
        const d=dx*dx+dz*dz; if(d<bd){ bd=d; target=j; } });
      return { r:p.r, cells:p.cells, set, target, cx:hexes[target].x, cz:hexes[target].z }; });
    capHexI=ci;
    if(window.__glog) window.__glog(`Округа осмотрена: найдено ${patches.length} ${plural(patches.length,'угодье','угодья','угодий')}`);
    if(patches.length===0){                               // редкий случай — обводить нечего, ход не держим
      pickingSurvey=false; pickingIndustry=false;
      if(window.__capital){ window.__capital.setTask({ body:'Советник воротился ни с чем: годных угодий вкруг города не высмотрел. Что ж, вершим ход, Правитель.' }); window.__capital.hideBanner(); }
      return;
    }
    pickingSurvey=false; pickingIndustry=true;             // осмотр закрыт → держим ход, пока не выбран первый промысел
    if(window.__capital) window.__capital.setTask({
      body:`Советник воротился с обходом: высмотрел <b>${patches.length}</b> ${plural(patches.length,'угодье','угодья','угодий')} под промысел вкруг города. Укажи, Правитель, за какое взяться первым.`,
      cta:'кликни по угодью', ctaKind:'prompt' });
  }

  // ===== СЛОЙ 2: выбор первого промысла кликом по угодью =====
  // виды промысла по биому: польза словами (реальная), сколько людей займёт, 3D-здание из примитивов kit.js
  const IND={
    hunt:{biome:'forest', name:'Охотничий стан', per:4, tint:'#8fe08f',
      desc:'Ловчие бьют зверя и птицу — мясо, шкуры, кость. Первый белок и тёплая одежда для растущего племени.',
      build(){ const g=new THREE.Group(); g.add(tent(1)); const f=fire(); f.position.set(1.15,0,0.95); g.add(f); return g; }},
    fish:{biome:'water', name:'Причал рыбарей', per:3, tint:'#7ec8ff',
      desc:'Рыбари ставят сети и верши. Вода кормит ровнее охоты — селение крепнет у берега, не страшась голодной зимы.',
      build(){ const g=new THREE.Group();
        const deck=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.16,1.2), new THREE.MeshStandardMaterial({color:0x8a5a34,roughness:1}));
        deck.position.set(0.9,0.5,0); deck.castShadow=true; g.add(deck);
        const pm=new THREE.MeshStandardMaterial({color:0x6b4526,roughness:1});
        [[0,0.5],[1.7,0.5],[0,-0.5],[1.7,-0.5]].forEach(([x,z])=>{ const p=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.0,6),pm); p.position.set(x,0.02,z); p.castShadow=true; g.add(p); });

  const BIOME_IND={ forest:['hunt','lumber'], water:['fish'], hills:['quarry'], meadow:['farm','pasture'] };   // какие промыслы доступны на биоме (в лесу и на лугу — выбор)

  // пунктир-дорога прогноза столица→угодье (dijkstra уже есть; smoothChain сажает на рельеф)

  function renderBuilding(){                               // (пере)поставить здание выбранного промысла на уже посчитанное место

  function preview(p){ curPatch=p; clearPreview(); curBld=null;

      const eps=1.2, gx=hAt(bx+eps,bz)-hAt(bx-eps,bz), gz=hAt(bx,bz+eps)-hAt(bx,bz-eps);
      const L=Math.hypot(gx,gz)||1, step=1.9; bx-=gx/L*step; bz-=gz/L*step;   // −градиент = вниз
    }
    if(p.r.key==='water'){                                 // причал — на БЕРЕГ: где путь к воде пересекает урез (WATER)
      const tmp=roadPoints(p.target,[p.cx,p.cz]);

          const h0=hAt(tmp[k-1][0],tmp[k-1][2]), h1=hAt(tmp[k][0],tmp[k][2]);
          if(h0>WATER && h1<=WATER){ const t=(h0-WATER)/((h0-h1)||1);

  // ===== МОДЕЛЬ «люди → продукция → рост» + ПАНЕЛИ города и промысла (визуализация формул) =====
  // Числа черновые, тюним по ощущению. Наука на выработку пока НЕ влияет (задел «улучшения»).
  function laborPool(){ const c=LM.find(l=>l.capital); return c?Math.round(popOf(c.size)*0.5):0; }   // рабочие руки = ~половина населения
  function allocWorkers(){ const pool=laborPool();                                                    // раздаём по ёмкости угодий

    if(tot<=0){ INDUSTRIES.forEach(r=>r.workers=0); return; }
    if(pool>=tot){ INDUSTRIES.forEach((r,i)=>r.workers=caps[i]); return; }                              // рук хватает на всё — каждый по ёмкости
    const exact=caps.map(c=>pool*c/tot), base=exact.map(Math.floor);                                   // метод наибольших остатков: сумма РОВНО = pool (не больше доступных рук)

  // Y = A·(1−e^−L/C), НОРМИРОВАНО так, чтобы ПОЛНАЯ загрузка давала ровно потолок A (2026-07-09).

  function prirost(){ return Math.round((foodPerTurn()-capNeed())*0.6); }                              // (устар.) чел./ход по профициту еды — оставлен для совместимости
  // ---- модификаторы от НАУКИ (задел, как «улучшения» в ресурсах): наука позже двигает эти множители ----
  const sciMods={ birth:1, death:1, spoil:1 };   // birth×рожд., death×смертн.(лечебницы<1), spoil×потери(ледники/консервы<1)
  let decreeClosed=false;                          // указ «ограничить приём новых жителей» (миграция→0)
  // ---- дорога от города до точки: качество, грейд, время доставки, потери ----
  function edgeAvgTr(destHex){ if(capHexI<0||destHex<0) return 0; const p=dijkstra(capHexI,destHex); if(!p||p.length<2) return 0;
    let t=0,n=0; for(let i=0;i<p.length-1;i++){ const e=edgeOf(p[i],p[i+1]); if(e>=0){ t+=edgeTr[e]; n++; } } return n?t/n:0; }
  function pathLenHex(destHex){ if(capHexI<0||destHex<0) return 1; const p=dijkstra(capHexI,destHex); return p?Math.max(1,p.length-1):1; }

  function roadInfo(destHex, paved){                              // сводка по дороге до клетки
    const avg=edgeAvgTr(destHex), L=pathLenHex(destHex);

    const T=Math.max(1, Math.ceil(L/speed));                     // ходов на доставку
    const rq=Math.min(1, 0.3+grade*0.12);                        // качество 0..1 для расчёта потерь

  function deliv(r){                                              // доставка промысла: {T, eta, frac, ...}

    // города выходит около нуля (+0.04%/год), и приток мигрантов НАКАПЛИВАЕТСЯ, а не проедается. Начался голод —

  function refreshPanels(){ if(cityP.classList.contains('on')) renderCity(); if(curRes&&resP.classList.contains('on')) openRes(curRes);

  // — клик по карте вне режимов выбора: столица → панель города, угодье промысла → панель промысла —
  dom.addEventListener('pointerup', e=>{
    if(pickingCapital||pickingScience||pickingSurvey||pickingIndustry) return;
    if(Math.abs(e.clientX-dX)+Math.abs(e.clientY-dY)>6) return;   // перетаскивание камеры — не клик
    ndc2.x=(e.clientX/innerWidth)*2-1; ndc2.y=-(e.clientY/innerHeight)*2+1; ray2.setFromCamera(ndc2,camera);
    // 1) СПЕРВА по самим домам: высокие здания перехватывают луч раньше земли — раньше клик по городу «не срабатывал»
    const grps=LM3D.map(r=>r&&r.group).filter(Boolean);
    const gh=grps.length?ray2.intersectObjects(grps,true)[0]:null;
    const hit=ray2.intersectObject(terrain,false)[0];
    if(gh && (!hit || gh.distance<=hit.distance+0.2)){
      let o=gh.object; while(o.parent && grps.indexOf(o)<0) o=o.parent;
      const li=LM3D.findIndex(r=>r&&r.group===o);
      if(li>=0){ if(LM[li].capital) openCity(); else openVillage(li); return; }
    }
    if(!hit) return;
    const hi=hexOfWorld(hit.point.x,hit.point.z);
    const cap=LM.find(l=>l.capital);
    if(cap && hi>=0 && hexOfWorld(cap.x,cap.z)===hi){ openCity(); return; }
    // 2) клик по земле рядом с поселением — тоже открывает его карточку (радиус тела кластера)
    const li2=LM.findIndex(l=>Math.hypot(l.x-hit.point.x, l.z-hit.point.z)<2.2);
    if(li2>=0){ if(LM[li2].capital) openCity(); else openVillage(li2); return; }

    if(!rec){ let bd=4; INDUSTRIES.forEach(r=>{ const dx=hit.point.x-r.bx,dz=hit.point.z-r.bz,d=dx*dx+dz*dz; if(d<bd){ bd=d; rec=r; } }); }
    if(rec) openRes(rec); });

  // — КРАСОТА: изгородь по контуру пастбища + борозды-пашня на каждой клетке поля (в постоянную группу built) —
  // ПАХОТА (2026-07-09, правка): не сплошная коричневая заливка (на ней терялись ростки), а БОРОЗДЫ —
  // тёмные валики через ряд. Между ними видна трава, поле читается и ростки на нём заметны.
  // Один InstancedMesh на всё поле (правило инстансинга).
  const FURROW_ROWS=(h,j,cb)=>{                             // обход точек внутри гекса j: (wx,wz,a,b)
    for(let b=-6;b<=6;b++) for(let a=-6;a<=6;a++){
      const wz=h.z+b*0.30, wx=h.x+a*0.32+(b&1?0.16:0);
      if(hexOfWorld(wx,wz)!==j) continue;                   // строго внутри своей клетки
      cb(wx,wz,a,b); } };
  function decoSoil(rec, parent=built){                     // борозды (валики вспаханной земли)
    const brown=new THREE.MeshStandardMaterial({color:0x5a4030,roughness:1});
    const ridgeG=new THREE.BoxGeometry(0.34,0.055,0.17), UP=new THREE.Vector3(0,1,0);
    const M=[], q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), pos=new THREE.Vector3(), tmp=new THREE.Vector3();
    rec.cells.forEach(j=>{ const h=hexes[j];
      FURROW_ROWS(h,j,(wx,wz,a,b)=>{ if(b&1) return;        // валик через ряд — между ними борозда с травой
        const nx=hAt(wx-0.4,wz)-hAt(wx+0.4,wz), nz=hAt(wx,wz-0.4)-hAt(wx,wz+0.4);
        q.setFromUnitVectors(UP, tmp.set(nx,1.6,nz).normalize());
        pos.set(wx, hAt(wx,wz)+0.045, wz);
        M.push(new THREE.Matrix4().compose(pos,q,sc)); }); });
    const inst=new THREE.InstancedMesh(ridgeG, brown, Math.max(1,M.length));
    M.forEach((m,i)=>inst.setMatrixAt(i,m)); inst.instanceMatrix.needsUpdate=true; inst.receiveShadow=true;
    parent.add(inst); return inst; }
  function decoFence(rec, parent=built){ const g=new THREE.Group();   // изгородь: жерди и сваи — по ОДНОМУ InstancedMesh на тип (2 вызова отрисовки на всю ограду, сколько бы её ни было)
    const woodM=new THREE.MeshStandardMaterial({color:0x6b4a2b,roughness:1});
    const postG=new THREE.CylinderGeometry(0.05,0.05,0.62,5), railG=new THREE.BoxGeometry(1,0.05,0.05);
    const rails=[], posts=[], seen=new Set();
    const q=new THREE.Quaternion(), sc=new THREE.Vector3(), pos=new THREE.Vector3(), UP=new THREE.Vector3(0,1,0), I=new THREE.Quaternion(), ONE=new THREE.Vector3(1,1,1);
    const XAX=new THREE.Vector3(1,0,0), dir=new THREE.Vector3();
    rec.cells.forEach(j=>{ const hj=hexes[j], cor=hexCorners(hj.x,hj.z);
      HN.forEach(([dq,dr],d)=>{ const nk=key(hj.q+dq,hj.r+dr); if(hexIdx.has(nk)&&rec.set.has(hexIdx.get(nk))) return;   // только ВНЕШНИЕ рёбра пятна
        const A=cor[EDGEC[d][0]], B=cor[EDGEC[d][1]];
        const yA=hAt(A[0],A[1]), yB=hAt(B[0],B[1]);
        const mx=(A[0]+B[0])/2, mz=(A[1]+B[1])/2;
        // ЖЕРДЬ ИДЁТ ПО СКЛОНУ (2026-07-12): раньше она лежала строго горизонтально, а столбы стояли на разных
        // высотах → на косогоре жердь висела в воздухе или врезалась в землю. Теперь соединяем ВЕРШИНЫ столбов:
        // направление жерди — вектор от A к B с учётом перепада высот, длина — с учётом этого же перепада.
        [0.42,0.22].forEach(hy=>{
          dir.set(B[0]-A[0], yB-yA, B[1]-A[1]);
          const len=dir.length(); dir.normalize();
          q.setFromUnitVectors(XAX, dir); sc.set(len,1,1);
          pos.set(mx,(yA+yB)/2+hy,mz);
          rails.push(new THREE.Matrix4().compose(pos,q,sc)); });
        [A,B].forEach(P=>{ const kk=Math.round(P[0]*8)+'_'+Math.round(P[1]*8); if(seen.has(kk))return; seen.add(kk);
          pos.set(P[0],hAt(P[0],P[1])+0.31,P[1]); posts.push(new THREE.Matrix4().compose(pos,I,ONE)); }); }); });
    const im=(geo,mats)=>{ const m=new THREE.InstancedMesh(geo,woodM,Math.max(1,mats.length)); mats.forEach((mx,i)=>m.setMatrixAt(i,mx)); m.instanceMatrix.needsUpdate=true; m.castShadow=true;
      m.userData.farHide=true; m.visible=!window.__farMode;   // изгородь на дальнем зуме гасим
      g.add(m); };
    im(railG,rails); im(postG,posts);
    rec.deco=g; parent.add(g); return g; }
  function decoCrops(rec, parent=built){   // ПАШНЯ = ростки РЯДАМИ по гребням борозд. ОДИН InstancedMesh на ростки
    const green=new THREE.MeshStandardMaterial({color:0x6fbf3f,roughness:0.85});   // ярче прежнего 0x4f8f34
    const bladeG=new THREE.ConeGeometry(0.06,0.42,4), UP=new THREE.Vector3(0,1,0); // выше прежнего (0.26)
    const M=[], q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), pos=new THREE.Vector3(), tmp=new THREE.Vector3();
    rec.cells.forEach(j=>{ const h=hexes[j];
      FURROW_ROWS(h,j,(wx,wz,a,b)=>{ if(b&1) return;         // ростки — на валиках, как в поле
        const nx=hAt(wx-0.4,wz)-hAt(wx+0.4,wz), nz=hAt(wx,wz-0.4)-hAt(wx,wz+0.4);           // уклон земли → нормаль
        q.setFromUnitVectors(UP, tmp.set(nx,1.6,nz).normalize());                            // наклон по склону тайла
        q.multiply(new THREE.Quaternion().setFromAxisAngle(UP, a+b*1.7));                    // лёгкий разворот вокруг своей оси
        pos.set(wx, hAt(wx,wz)+0.24, wz);                                                    // на гребне валика
        M.push(new THREE.Matrix4().compose(pos,q,sc)); }); });
    if(window.__cutGrassCells) window.__cutGrassCells(rec.cells);   // пашня = трава с клеток выкошена (заказ 2026-07-18)
    const soil=decoSoil(rec, parent);                       // сперва борозды, ростки поверх них
    const inst=new THREE.InstancedMesh(bladeG, green, Math.max(1,M.length));
    M.forEach((m,i)=>inst.setMatrixAt(i,m)); inst.instanceMatrix.needsUpdate=true; inst.castShadow=true;
    inst.userData.farHide=true; inst.visible=!window.__farMode;   // ростки на дальнем зуме гасим (борозды-валики остаются — поле видно)
    rec.deco=inst; parent.add(inst); return {soil,inst}; }

  // ===== УКРАШЕНИЕ ДЕРЕВЕНЬ (2026-07-09) =====
  // У деревни, рядом с центром которой есть луг: одна клетка под пастбище, одна под пашню. Есть вода — ещё причал.
  // Это ЧИСТО декорация, не настоящее угодье: когда деревня становится нашей (столица/присоединение),
  // всё это ИСЧЕЗАЕТ — иначе игрок примет украшение за готовый промысел. (Прямое требование пользователя.)
  const VDECO=[];                                            // VDECO[i] = группа декора деревни i
  function clearVillageDecorInner(i){
    const g=VDECO[i]; if(!g) return;
    scene.remove(g); g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); VDECO[i]=null;
  }
  function villageDecorAll(){
    for(let i=0;i<LM.length;i++){
      const lm=LM[i];
      if(lm.capital||lm.aiCapital){ clearVillageDecorInner(i); continue; }  // столица — украшения долой
      // если игрок заложил промысел ПОВЕРХ клеток декора — снести декор и нарисовать заново (вариант «А»)
      if(VDECO[i] && (VDECO[i].userData.cells||[]).some(c=>occupiedHex.has(c))) clearVillageDecorInner(i);
      if(VDECO[i]) continue;                                  // уже нарисовано
      const ci=hexOfWorld(lm.x,lm.z); if(ci<0) continue;
      const h0=hexes[ci], meadow=[], water=[];
      HN.forEach(([dq,dr])=>{ const nk=key(h0.q+dq,h0.r+dr); if(!hexIdx.has(nk)) return;
        const ni=hexIdx.get(nk); if(occupiedHex.has(ni)) return;      // на НАШЕЙ пашне декор не рисуем
        const hh=hexes[ni], b=biomeAt(hh.x,hh.z);
        if(b===B_MEADOW) meadow.push(ni); else if(b===B_WATER) water.push(ni); });
      if(!meadow.length && !water.length) continue;
      const g=new THREE.Group(); scene.add(g); VDECO[i]=g;
      g.userData.cells=[meadow[0],meadow[1],water[0]].filter(c=>c!==undefined);
      if(meadow[0]!==undefined){                              // 1 клетка — пастбище (изгородь)
        const cells=[meadow[0]]; decoFence({cells,set:new Set(cells)}, g); }
      if(meadow[1]!==undefined){                              // 1 клетка — пашня (пахота + ростки)
        const cells=[meadow[1]]; decoCrops({cells,set:new Set(cells)}, g); }
      if(water[0]!==undefined){                               // причал у воды: тот же, что у промысла рыбарей
        const wh=hexes[water[0]], b=IND.fish.build();
        b.position.set((wh.x+lm.x)/2, hAt((wh.x+lm.x)/2,(wh.z+lm.z)/2), (wh.z+lm.z)/2);
        b.rotation.y=Math.atan2(wh.x-lm.x, wh.z-lm.z); b.scale.setScalar(0.6); g.add(b); }
    }
    for(let i=LM.length;i<VDECO.length;i++) clearVillageDecorInner(i);   // сброс мира
  }
  function clearAllVillageDecor(){ for(let i=0;i<VDECO.length;i++) clearVillageDecorInner(i); VDECO.length=0; }

  // — повторный осмотр («Советник осмотрит округу ещё раз») + отмена необязательного осмотра —
  function firstNeeded(){ return INDUSTRIES.length===0; }   // держим ход только пока не заложен ПЕРВЫЙ промысел
  function rescan(){ if(pickingCapital||pickingScience||pickingSurvey||pickingIndustry) return;
    cityP.classList.remove('on'); resP.classList.remove('on'); curRes=null; clearHL(); clearDash();
    pickingSurvey=true; reveal(); }
  function cancelPick(){ if(pickingSurvey||pickingIndustry){ pickingSurvey=false; pickingIndustry=false; clear(); clearPreview(); closePanel();
    if(window.__capital) window.__capital.hideBanner(); } }

  window.__survey={ onCapitalFounded, reveal, nudge, onReset, tick, firstNeeded, rescan, cancelPick, decoFence, decoCrops,
                    villageDecorAll, clearVillageDecor:clearVillageDecorInner, clearAllVillageDecor };
})();

(function resumeAfterReset(){

    const raw=localStorage.getItem('grad_resume');

      localStorage.removeItem('grad_resume');
      const r=JSON.parse(raw);
      if(r && r.player){
        Object.assign(PLAYER, r.player); TAKEN_COLORS = r.taken || [PLAYER.colorId];
        const menu=document.getElementById('g-menu'); if(menu) menu.classList.add('off');

  while(l.childElementCount>80) l.removeChild(l.lastChild); };

// ===== СЧЁТЧИК НАГРУЗКИ (2026-07-12) =====
// Нужен, чтобы честно сравнивать «до/после» при перерисовке визуала: красота почти всегда стоит кадров.
// Включается адресом ?perf=1 — плашка в правом нижнем углу. Данные наружу: window.__perf (для headless-замера).
//   FPS        — кадров в секунду (ниже 30 — заметные подтормаживания);
//   вызовов    — draw calls: сколько раз за кадр дёргается видеокарта (главный расход, режется инстансингом);
//   треуг.     — сколько треугольников в кадре;
//   тексту́ры   — сколько текстур и геометрий держится в памяти видеокарты.
let PERF_ON = new URLSearchParams(location.search).get('perf')==='1' || SETTINGS.perf;   // адрес ?perf=1 ИЛИ галочка в настройках
const perf = { fps:0, fpsMin:1e9, calls:0, tris:0, textures:0, geometries:0, loadMs:0, frames:0 };
window.__perf = perf;
let _pfFrames=0, _pfLast=performance.now(), _pfBox=null;
function _pfEnsureBox(){
  if(_pfBox) return;
  _pfBox=document.createElement('div');
  _pfBox.style.cssText='position:fixed;right:10px;bottom:10px;z-index:99;background:rgba(10,16,24,.82);color:#cfe6ff;'
    +'font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:8px;border:1px solid rgba(120,170,220,.25);white-space:pre';
  document.body.appendChild(_pfBox);
}
if(PERF_ON) _pfEnsureBox();
// галочка «Показывать FPS» в настройках — включение/выключение плашки без перезагрузки
window.__setPerf=(on)=>{ PERF_ON=on;
  if(on){ _pfEnsureBox(); _pfBox.style.display=''; perf.fpsMin=1e9; }
  else if(_pfBox) _pfBox.style.display='none'; };
// При постобработке кадр состоит из НЕСКОЛЬКИХ внутренних рендеров (сцена, размытия bloom, вывод),
// а renderer.info сбрасывается на каждом — в счётчике оставался последний (1 вызов, 1 треугольник).
// Поэтому автосброс выключен: суммируем за весь кадр, сбрасываем вручную в perfTick.
renderer.info.autoReset=false;
function perfTick(){
  perf.frames++; _pfFrames++;
  const ri0=renderer.info;
  const _calls=ri0.render.calls, _tris=ri0.render.triangles;
  ri0.reset();
  const now=performance.now(), dt=now-_pfLast;
  if(dt<500) return;
  const fps=_pfFrames*1000/dt;
  perf.fps=+fps.toFixed(1);
  if(perf.frames>60 && fps<perf.fpsMin) perf.fpsMin=+fps.toFixed(1);   // первые кадры (прогрев) в минимум не берём
  const ri=renderer.info;
  perf.calls=_calls; perf.tris=_tris;
  perf.textures=ri.memory.textures; perf.geometries=ri.memory.geometries;
  _pfFrames=0; _pfLast=now;
  if(_pfBox && PERF_ON) _pfBox.textContent =
    `FPS ${perf.fps}  (мин ${perf.fpsMin===1e9?'—':perf.fpsMin})\n`
    +`вызовов отрисовки ${perf.calls}\n`
    +`треугольников ${perf.tris.toLocaleString('ru')}\n`
    +`текстур ${perf.textures} · геометрий ${perf.geometries}\n`
    +`загрузка ${perf.loadMs} мс`;
}
addEventListener('load',()=>{ perf.loadMs=Math.round(performance.now()); });

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer){ composer.setSize(innerWidth,innerHeight); }});   // ВИЗУАЛ-ЛАБ (C): буферы постобработки под новый размер

// --- панорамирование камеры клавишами (стрелки + WASD) ---
const panKeys={ArrowUp:0,ArrowDown:0,ArrowLeft:0,ArrowRight:0,KeyW:0,KeyA:0,KeyS:0,KeyD:0};
const _typing=el=>el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA');
addEventListener('keydown',e=>{ if(e.code in panKeys && !_typing(e.target)){ panKeys[e.code]=1; e.preventDefault(); } });
addEventListener('keyup',  e=>{ if(e.code in panKeys) panKeys[e.code]=0; });
const PAN_SPEED=0.5, _panFwd=new THREE.Vector3(), _panRight=new THREE.Vector3(), _panMove=new THREE.Vector3();
function applyPan(){
  let dx=(panKeys.ArrowRight||panKeys.KeyD)-(panKeys.ArrowLeft||panKeys.KeyA);
  let dz=(panKeys.ArrowDown||panKeys.KeyS)-(panKeys.ArrowUp||panKeys.KeyW);
  if(!dx && !dz) return;
  camera.getWorldDirection(_panFwd); _panFwd.y=0; _panFwd.normalize();
  _panRight.crossVectors(_panFwd, camera.up).normalize();
  _panMove.set(0,0,0).addScaledVector(_panFwd,-dz*PAN_SPEED).addScaledVector(_panRight,dx*PAN_SPEED);
  camera.position.add(_panMove); controls.target.add(_panMove);
}


let boardTick=0, roadTick=0, roadsDirty=false;
(function loop(){
  requestAnimationFrame(loop);
  if(running){
    const n=Math.min(perFrame, remaining);
    for(let s=0;s<n;s++) oneSubstep();
    remaining-=n; syncSettlements();
    // rebuildRoads вынесен в СЛЕДУЮЩИЙ кадр (roadsDirty): вместе с финалом хода он давал
    // один кадр-фриз (по профилю 2026-07-15 дороги — самая дорогая часть хода).
    if(remaining<=0){ running=false; turn++; advanceEconomy(); hud.setBusy(false); growRoads(); roadsDirty=true; updateBoard(); refreshTime(); hud.setState('мир замер'); }
  } else if(roadsDirty){ roadsDirty=false; rebuildRoads(); }
  else if(autoTurns){ endTurn(); }
  drawAgents();
  updateLabels();
  if(++boardTick%20===0) updateBoard();
  applyPan();
  controls.update();
  // Камера не ныряет под рельеф (2026-07-12): держим её не ниже земли + запас, иначе вид уходит «внутрь горы».
  { const gy=hAt(camera.position.x, camera.position.z)+3.0;
    if(camera.position.y < gy) camera.position.y = gy;
    // Трава — только на ближнем зуме: выше ~60 м над землёй пучки всё равно растворены
    // дистанционным фейдом шейдера. Плюс v4: у кусков травы есть центр/радиус (userData.gc) —
    // куски дальше 58 м от камеры выключаются, вершины гоняются только вокруг камеры.
    if(window.__labGrassIMs){ const on=camera.position.y-(gy-3.0)<60;
      for(const g of window.__labGrassIMs){
        const gc=g.userData.gc;
        g.visible = on && (!gc || Math.hypot(camera.position.x-gc.x, camera.position.z-gc.z)-gc.r < 58);
      }
      // ЛЕЧЕНИЕ ДАЛЬНЕГО ЗУМА (2026-07-17): в полосе высот 52–68 м полные деревья плавно
      // сжимаются в точку, LOD-силуэты (без теней) вырастают — без щелчка. Мелочь (люди,
      // ростки, изгороди — userData.farHide) гаснет на пороге 60 м: издалека она меньше
      // пикселя, а треугольники и место в карте теней ест.
      const h=camera.position.y-(gy-3.0);
      if(window.__setTreeLod) window.__setTreeLod(Math.min(1,Math.max(0,(h-52)/16)));
      const far=!on;
      if(far!==window.__farMode){ window.__farMode=far;
        scene.traverse(o=>{ if(o.userData.farHide) o.visible=!far; });
      } } }
  {
    const t=waterClock.getElapsedTime();
    waterNmap.offset.set(t*0.009, t*0.006);   // спокойная бегущая рябь (озёра — помедленнее; река/океан позже отдельным типом можно быстрее)
    waterUniforms.uLabT.value=t;              // задание №2: волны в 2 слоя + «дыхание» пены у берега
    labGrassUniforms.uTime.value=t;           // ВИЗУАЛ-ЛАБ (B): ветер в пучках травы
    for(const c of CLOUDS){
      c.obj.position.x=cloudWrap(c.x0+Math.cos(c.dir)*c.speed*t);
      c.obj.position.z=cloudWrap(c.z0+Math.sin(c.dir)*c.speed*t);
      c.obj.position.y=c.y0+Math.sin(t*0.15+c.bobPh)*0.4;
    }
    for(const b of BIRDS){
      const th=t*b.speed+b.phase;
      b.obj.position.set(b.cx+Math.cos(th)*b.r, b.y+Math.sin(t*0.6+b.phase)*0.3, b.cz+Math.sin(th)*b.r);
      b.obj.rotation.y=-th;
      const flap=Math.sin(t*b.flap+b.phase)*0.5;
      b.obj.userData.wingR.rotation.z=flap; b.obj.userData.wingL.rotation.z=-flap;
    }
  }
  if(composer) composer.render(); else renderer.render(scene,camera);   // ВИЗУАЛ-ЛАБ (C): через постобработку (?post=0 — напрямую)
  perfTick();
})();
// всё построено — растворяем заставку загрузки (статичный HTML в начале <body>)
{ const sp=document.getElementById('g-splash');
  if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(), 600); } }
window.__ready=true;
</script>
