<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка видеокарты</title>
<style>
  body{margin:0;background:#0d1521;color:#eaf1fb;font:500 16px/1.7 ui-monospace,Menlo,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
  #r{font-size:20px;font-weight:700;margin:12px 0;color:#f4cd7e}
  #v{font-size:26px;font-weight:800;margin:18px 0;padding:12px 26px;border-radius:12px}
  .ok{background:#1d4d2b;color:#8ff0a4} .bad{background:#5a1d1d;color:#ff9d9d}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.25}
  .d{opacity:.65;font-size:13.5px}
</style>
</head>
<body>
<div>
  <div>ПРОВЕРКА ВИДЕОКАРТЫ В БРАУЗЕРЕ</div>
  <div id="r">…</div>
  <div id="f">меряю скорость (~6 секунд)…</div>
  <div id="v"></div>
  <div class="d" id="d"></div>
  <div class="d">пришли скриншот этой страницы</div>
</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
cv.width=Math.min(1280,innerWidth*devicePixelRatio); cv.height=Math.min(800,innerHeight*devicePixelRatio);
const out=(id,t)=>document.getElementById(id).textContent=t;
document.getElementById('d').textContent=`окно ${innerWidth}×${innerHeight} · dpr ${devicePixelRatio} · ${navigator.userAgent.replace(/Mozilla.*?\) /,'')}`;
const gl=cv.getContext('webgl2',{antialias:true});
if(!gl){ out('r','WebGL2 НЕ СОЗДАЁТСЯ'); document.getElementById('v').textContent='браузер не даёт 3D вовсе'; document.getElementById('v').className='bad'; }
else{
  // имя устройства, которым браузер рисует 3D (главная строка теста)
  let name='(скрыто браузером)';
  try{ const ext=gl.getExtension('WEBGL_debug_renderer_info');
    if(ext) name=gl.getParameter(ext.UNMASKED_RENDERER_WEBGL); }catch(e){}
  out('r','рисует: '+name);
  // стресс: 400×400×2 = 320 тыс. треугольников волнистой сетки на кадр, 6 секунд
  const N=400;
  const vs=`#version 300 es
  uniform float t; out float h;
  void main(){
    int q=gl_VertexID/3, v=gl_VertexID%3;
    int cell=q/2, tri=q%2;
    float cx=float(cell%${N}), cz=float(cell/${N});
    vec2 o=(tri==0)?(v==0?vec2(0,0):v==1?vec2(1,0):vec2(0,1)):(v==0?vec2(1,0):v==1?vec2(1,1):vec2(0,1));
    vec2 p=(vec2(cx,cz)+o)/float(${N})*2.0-1.0;
    h=sin(p.x*21.0+t)*cos(p.y*17.0-t*1.3);
    gl_Position=vec4(p.x, p.y*0.9+h*0.05, 0.0, 1.0);
  }`;
  const fs=`#version 300 es
  precision mediump float; in float h; out vec4 o;
  void main(){ o=vec4(0.2+0.3*h, 0.45, 0.65-0.2*h, 1.0); }`;
  const sh=(t2,s)=>{ const x=gl.createShader(t2); gl.shaderSource(x,s); gl.compileShader(x); return x; };
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  const ut=gl.getUniformLocation(pr,'t');
  const NT=N*N*2*3;
  let frames=0, t0=0;
  function frame(ts){
    if(!t0) t0=ts;
    gl.viewport(0,0,cv.width,cv.height);
    gl.clearColor(0.05,0.08,0.13,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(ut, ts/1000);
    gl.drawArrays(gl.TRIANGLES,0,NT);
    frames++;
    if(ts-t0<6000){ requestAnimationFrame(frame); return; }
    const fps=frames/((ts-t0)/1000);
    out('f',`стресс-тест: ${fps.toFixed(1)} fps на 320 тыс. треугольников/кадр`);
    const v=document.getElementById('v');
    const soft=/soft|swift|llvmpipe|basic render/i.test(name);
    if(soft || fps<25){ v.textContent='ПОХОЖЕ НА ПРОГРАММНУЮ ОТРИСОВКУ — видеокарта не используется'; v.className='bad'; }
    else { v.textContent='видеокарта работает нормально'; v.className='ok'; }
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
