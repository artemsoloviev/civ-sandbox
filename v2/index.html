const R=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(20260928);

const hash=(a,b)=>{let h=(a|0)*374761393+(b|0)*668265263;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967296;};

// ================= ТЕКСТУРЫ =================
function cnv(n){const c=document.createElement('canvas');c.width=c.height=n;return c;}
function tex(c,rep=1){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;return t;}

// плотная трава тайла (детальная, тайлится на плитке)
function grassCanvas(seed,base,dryK){
  const c=cnv(512);const g=c.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(seed);
  g.fillStyle=base;g.fillRect(0,0,512,512);
  for(let i=0;i<180;i++){ // крупные пятна свет/сушь
    g.fillStyle=`hsla(${74+L()*30},${30+L()*22}%,${24+L()*20}%,${0.25+L()*0.3})`;
    g.beginPath();g.ellipse(L()*512,L()*512,14+L()*52,10+L()*36,L()*3,0,7);g.fill();}
  for(let i=0;i<9000;i++){ // травинки
    const x=L()*512,y=L()*512,t0=L();
    g.strokeStyle=`hsla(${70+t0*34},${34+t0*26}%,${20+t0*30}%,0.8)`;
    g.lineWidth=0.8+L()*1.3;g.beginPath();g.moveTo(x,y);
    g.lineTo(x+(L()-0.5)*4,y-3-L()*7);g.stroke();}
  if(dryK)for(let i=0;i<160;i++){ // сухие метёлки
    const x=L()*512,y=L()*512;
    g.strokeStyle=`hsla(${48+L()*14},${40+L()*20}%,${44+L()*20}%,${0.5*dryK})`;
    g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+(L()-0.5)*5,y-6-L()*8);g.stroke();}
  for(let i=0;i<240;i++){ // земля проплешинами
    g.fillStyle=`hsla(${30+L()*12},${26+L()*14}%,${28+L()*14}%,${0.2+L()*0.25})`;
    g.beginPath();g.ellipse(L()*512,L()*512,2+L()*6,1.5+L()*4,L()*3,0,7);g.fill();}
  return c;
}

function dirtCanvas(){

}

function rockCanvas(){

function fieldCanvas(){
  const c=cnv(512);const g=c.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(99);
  g.fillStyle='#6a5335';g.fillRect(0,0,512,512);
  for(let y=0;y<512;y+=18){
    const gr=g.createLinearGradient(0,y,0,y+18);
    gr.addColorStop(0,'#7c6440');gr.addColorStop(0.5,'#5b452a');gr.addColorStop(1,'#443317');

    for(let i=0;i<60;i++){g.fillStyle=`hsla(${32+L()*10},20%,${22+L()*22}%,0.5)`;
      g.beginPath();g.ellipse(L()*512,y+L()*18,1.5+L()*4,1+L()*2.5,0,0,7);g.fill();}}
  for(let i=0;i<130;i++){ // ростки
    g.strokeStyle=`hsla(${80+L()*20},40%,${28+L()*16}%,0.8)`;g.lineWidth=1.2;
    const x=L()*512,y=Math.floor(L()*28)*18+5;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+(L()-0.5)*3,y-4-L()*5);g.stroke();}

function strawCanvas(w,h,frayed){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#b08a3e';g.fillRect(0,0,w,h);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(777+w+h);
  for(let i=0;i<w*3;i++){const x=L()*w, wd=0.8+L()*1.8, v=L();
    g.strokeStyle=`hsl(${34+L()*12} ${30+L()*22}% ${22+v*30}%)`;g.lineWidth=wd;g.beginPath();
    const bow=(L()-0.5)*6;g.moveTo(x,-4);g.quadraticCurveTo(x+bow,h*0.5,x+(L()-0.5)*10,h+4);g.stroke();}
  for(let i=0;i<w/6;i++){const x=L()*w;g.strokeStyle='rgba(60,40,10,0.35)';g.lineWidth=2+L()*3;
    g.beginPath();g.moveTo(x,0);g.lineTo(x+(L()-0.5)*14,h);g.stroke();}
  if(frayed){
    g.globalCompositeOperation='destination-out';
    for(let x=0;x<w;x+=2){const d=h*(0.06+0.10*L());g.fillRect(x,h-d,2,d);}
    g.globalCompositeOperation='source-over';
  }
  return c;
}

function barkCanvas(){
  const c=cnv(256);const g=c.getContext('2d');g.fillStyle='#7d5f3d';g.fillRect(0,0,256,256);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(311);

    g.strokeStyle=`hsl(${24+L()*12} ${20+L()*20}% ${26+L()*22}%)`;g.lineWidth=1+L()*2.5;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+ln,y+(L()-0.5)*8);g.stroke();}
  for(let i=0;i<14;i++){const x=L()*256,y=L()*256,r2=3+L()*6;
    g.fillStyle='#3d2a17';g.beginPath();g.ellipse(x,y,r2,r2*0.7,L(),0,7);g.fill();}
  return c;
}
const barkT=tex(barkCanvas());barkT.rotation=Math.PI/2;barkT.center.set(0.5,0.5);
function ringCanvas(){
  const c=cnv(128);const g=c.getContext('2d');g.fillStyle='#c9a86f';g.beginPath();g.arc(64,64,63,0,7);g.fill();
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(99);
  for(let r2=60;r2>3;r2-=2+L()*4){g.strokeStyle=`hsl(33 ${30+L()*20}% ${34+L()*22}%)`;
    g.lineWidth=1+L();g.beginPath();g.arc(64+(L()-0.5)*5,64+(L()-0.5)*5,r2,0,7);g.stroke();}

const leafC=cnv(128);
{ const lg=leafC.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(606);
  lg.fillStyle='#4e6a30';lg.fillRect(0,0,128,128);

    lg.beginPath();lg.ellipse(L()*128,L()*128,1.5+L()*3.5,1+L()*2.5,L()*3,0,7);lg.fill();}}
const leafT=tex(leafC,2);
// карточка листвы: плотная листовая масса по кластерной маске, рваный край
const leafCardC=cnv(256);
{ const lg=leafCardC.getContext('2d');lg.clearRect(0,0,256,256);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(909);
  // маска кластера: слитые овалы
  const blobs=[];
  for(let b=0;b<6;b++)blobs.push([128+(L()-0.5)*120,128+(L()-0.5)*110,42+L()*38,34+L()*30]);
  const inMask=(x,y)=>blobs.some(([bx,by,rx,ry])=>((x-bx)/rx)**2+((y-by)/ry)**2<1);
  // тёмная подложка массы
  for(const [bx,by,rx,ry] of blobs){
    lg.fillStyle='rgba(28,42,18,0.9)';
    lg.beginPath();lg.ellipse(bx,by,rx*0.92,ry*0.92,0,0,7);lg.fill();}
  // листья: сотни мелких, светлее к краям массы
  for(let i=0;i<2400;i++){
    const x=L()*256,y=L()*256;
    const inside=inMask(x,y);
    if(!inside && L()>0.06) continue;          // редкие листья за маской = рваный край
    lg.fillStyle=`hsla(${78+L()*36},${32+L()*26}%,${22+L()*30}%,${0.8+L()*0.2})`;
    lg.beginPath();lg.ellipse(x,y,1.2+L()*2.6,0.9+L()*2,L()*3,0,7);lg.fill();}
  // блики верхних листьев
  for(let i=0;i<420;i++){
    const x=L()*256,y=L()*256; if(!inMask(x,y)) continue;
    lg.fillStyle=`hsla(${84+L()*26},${40+L()*20}%,${44+L()*18}%,0.75)`;
    lg.beginPath();lg.ellipse(x,y,1+L()*1.8,0.8+L()*1.4,L()*3,0,7);lg.fill();}}
const leafCardT=(()=>{const t=new THREE.CanvasTexture(leafCardC);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const wattleT=(()=>{ const c=cnv(128);const g=c.getContext('2d');g.fillStyle='#7a5c36';g.fillRect(0,0,128,128);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(1234);

// фото-текстуры CC0 (ambientCG): цвет + нормали + затенение пор

function photoMat(id,rep,tint){
  const c=TL.load('../visual2/tex/'+id+'_c.jpg'); c.colorSpace=THREE.SRGBColorSpace;
  c.wrapS=c.wrapT=THREE.RepeatWrapping; c.repeat.set(rep,rep); c.anisotropy=8;

  const ao=TL.load('../visual2/tex/'+id+'_ao.jpg');
  ao.wrapS=ao.wrapT=THREE.RepeatWrapping; ao.repeat.set(rep,rep);
  return new THREE.MeshStandardMaterial({map:c,normalMap:n,aoMap:ao,aoMapIntensity:0.9,
    roughness:1,color:tint||0xffffff});
}
// макро-вариация оттенка (лечит «заливку» фото-травы с высоты)
function addMacro(mat,amp=0.16,scale=1.7){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uMac={value:[amp,scale]};
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform vec2 uMac;')
      .replace('#include <map_fragment>',
        `#include <map_fragment>\n{ vec2 mu=vMapUv*uMac.y;
          float n=sin(mu.x*3.1+mu.y*5.3)*0.5+sin(mu.x*7.7-mu.y*2.9+1.7)*0.3+sin(mu.x*1.3+mu.y*1.1+4.2)*0.6;
          diffuseColor.rgb*=1.0+n*uMac.x*0.5;
          diffuseColor.g*=1.0+sin(mu.x*2.2-mu.y*3.7)*uMac.x*0.35; }`);};
  return mat;
}

// решётка кандидатов: какие центры рядом с (x,z)

        +sin(vWxz.x*0.21+vWxz.y*0.17+4.2)*0.7;

                       :(0.34+0.08*sin(vWxz.x*0.7+vWxz.y*0.55));   // rv1/2: узкая, ширина дышит
        float band=1.0-smoothstep(W,W+0.06,dR);                    // тело реки
        float core=1.0-smoothstep(0.0,W,dR);

        vec3 wcol=mix(vec3(0.155,0.180,0.195),vec3(0.055,0.072,0.092),sqrt(core));

          wcol+=glint*vec3(0.18,0.19,0.19)*core; }                 // рисованная рябь — только в rv2

        float wetR=uRV>3.5?0.28:0.55;                              // rv4: мокрая кромка совсем узкая

      }

function scatterOnHex(g,n,fn,rMax=HEXR*0.72,cx=0,cz=0){
  for(let i=0;i<n;i++){
    const a=R()*Math.PI*2, d=Math.sqrt(R())*rMax;
    const lx=Math.cos(a)*d, lz=Math.sin(a)*d;
    const y=heightAt(cx+lx,cz+lz);
    if(y<-0.32||(RV>0&&riverT(cx+lx,cz+lz)>0.2))continue;  // в воду/русло/нарисованную реку не ставим
    const o=fn(i);o.position.set(lx,y-0.03,lz);
    o.rotation.y=R()*Math.PI*2;g.add(o);}
}

const tuftGeo=(()=>{ const g1=new THREE.PlaneGeometry(0.34,0.26); g1.translate(0,0.12,0);
  const g2=g1.clone(); g2.rotateY(Math.PI/2);
  const g=new THREE.BufferGeometry(); const ps=[],us=[];
  for(const gg of [g1,g2]){ const n=gg.toNonIndexed();
    ps.push(...n.attributes.position.array); us.push(...n.attributes.uv.array); }
  g.setAttribute('position',new THREE.Float32BufferAttribute(ps,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(us,2));
  g.computeVertexNormals(); return g; })();
const tuftTex=(()=>{ const c=cnv(64); const g=c.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(41);
  for(let i=0;i<12;i++){ const x=8+L()*48;   // травинки толще и светлее: тонкие в мипах чернели
    g.strokeStyle=`hsl(${72+L()*30} ${40+L()*22}% ${36+L()*24}%)`;
    g.lineWidth=2.2+L()*2; g.beginPath(); g.moveTo(x,64);
    g.quadraticCurveTo(x+(L()-0.5)*12,32,x+(L()-0.5)*20,5+L()*12); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();

function addTufts(g,n,cx,cz,dryK=0){
  const im=new THREE.InstancedMesh(tuftGeo,tuftMat,n);
  const Mx=new THREE.Matrix4(),Q=new THREE.Quaternion(),E=new THREE.Euler(),C=new THREE.Color();
  let put=0;
  for(let i=0;i<n;i++){
    const a=R()*Math.PI*2, d=Math.sqrt(R())*HEXR*0.86;
    const lx=Math.cos(a)*d, lz=Math.sin(a)*d;
    const ty2=heightAt(cx+lx,cz+lz); if(ty2<-0.32||(RV>0&&riverT(cx+lx,cz+lz)>0.2))continue;
    E.set(0,R()*Math.PI,0); Q.setFromEuler(E);
    Mx.compose(new THREE.Vector3(lx,ty2+0.02,lz),Q,
      new THREE.Vector3(rr(0.7,1.4),rr(0.6,1.4),1));
    im.setMatrixAt(put,Mx);
    C.setHSL(0.22+rr(-0.03,0.03)-dryK*0.115,rr(0.35,0.55)+dryK*0.1,rr(0.44,0.6)+dryK*0.09,THREE.SRGBColorSpace);
    im.setColorAt(put,C); put++; }
  im.count=put; g.add(im);
}

    scatterOnHex(g,6,()=>{const rk=mkRock(rr(0.35,0.8));
      rk.material=M.rock; return rk;},HEXR*0.8,cx,cz);
    return g; },
  desert(cx,cz){ const g=new THREE.Group();
    scatterOnHex(g,2,()=>mkRock(rr(0.3,0.55)),HEXR*0.72,cx,cz);
    addTufts(g,6,cx,cz,1);                       // редкая выгоревшая поросль
    return g; },
  snow(cx,cz){ const g=new THREE.Group();
    scatterOnHex(g,2,()=>{const rk=mkRock(rr(0.3,0.5));
      rk.material=new THREE.MeshStandardMaterial({color:0xd9dde2,roughness:0.95}); return rk;},HEXR*0.7,cx,cz);
    if(R()<0.7)scatterOnHex(g,2,()=>mkPine(rr(0.53,0.75)),HEXR*0.65,cx,cz);
    return g; },
  water(){ return null; },                    // впадина рельефа + общая гладь
  tundra(cx,cz){ const g=new THREE.Group();
    scatterOnHex(g,3,()=>{const rk=mkRock(rr(0.25,0.5));
      rk.material=new THREE.MeshStandardMaterial({color:0x9aa0a2,roughness:1});return rk;},HEXR*0.72,cx,cz);
    if(R()<0.8)scatterOnHex(g,2,()=>mkPine(rr(0.3,0.45)),HEXR*0.66,cx,cz);  // карликовые ёлочки
    addTufts(g,10,cx,cz,0.5);
    return g; },
  marsh(cx,cz){ const g=new THREE.Group();
    addReeds(g,34,cx,cz);
    scatterOnHex(g,3,()=>mkSnag(rr(0.7,1.1)),HEXR*0.62,cx,cz);   // коряги
    for(let i=0;i<6;i++){ // кочки над жижей
      const a=R()*Math.PI*2, d=Math.sqrt(R())*HEXR*0.7;
      const lx=Math.cos(a)*d, lz=Math.sin(a)*d;
      const y=heightAt(cx+lx,cz+lz); if(y<-0.42||y>0.05)continue;
      const k2=new THREE.Mesh(new THREE.SphereGeometry(rr(0.16,0.3),8,6),
        new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.24,0.35,0.2,THREE.SRGBColorSpace),roughness:1}));
      k2.scale.y=0.42;k2.position.set(lx,y+0.03,lz);k2.castShadow=true;g.add(k2);}
    addTufts(g,12,cx,cz);
    return g; },
  jungle(cx,cz){ const g=new THREE.Group();   // сомкнутый полог широколиственных
    scatterOnHex(g,19,()=>mkTree(rr(0.6,1.05)),HEXR*0.78,cx,cz);
    for(let i=0;i<3;i++){ // пальмы только на кромке, у воды
      const a=R()*Math.PI*2;
      const lx=Math.cos(a)*HEXR*rr(0.82,0.95), lz=Math.sin(a)*HEXR*rr(0.82,0.95);
      const y=heightAt(cx+lx,cz+lz);
      if(y<-0.32||y>0.35||(RV>0&&riverT(cx+lx,cz+lz)>0.2))continue; // кромка = низко у воды
      const p=mkPalm(rr(0.9,1.25));p.position.set(lx,y-0.03,lz);
      p.rotation.y=R()*Math.PI*2;g.add(p);}
    addTufts(g,24,cx,cz);                     // густой тёмный подлесок
    return g; },
  savanna(cx,cz){ const g=new THREE.Group();
    scatterOnHex(g,2,()=>mkAcacia(rr(0.9,1.3)),HEXR*0.66,cx,cz);
    scatterOnHex(g,2,()=>mkRock(rr(0.25,0.4)),HEXR*0.7,cx,cz);
    addTufts(g,16,cx,cz,1);
    return g; },
  village(cx,cz){ const g=new THREE.Group();
    // плоская площадка: вся деревня на одной высоте
    const hV=flatHeight({x:cx,z:cz,type:'village'});
    g.position.y=hV;
    // деревня собрана лицом к камере (+z = юг, к зрителю); НЕ крутится
    const hut=mkHut(1);hut.position.set(-0.15,0,-0.9);hut.rotation.y=-0.15;g.add(hut); // дверь на юг
    const cab=mkCabin(1);cab.position.set(1.75,0,-0.1);cab.rotation.y=-0.55;g.add(cab);
    const cab2=mkCabin(0.85);cab2.position.set(-1.85,0,0.15);cab2.rotation.y=0.5;g.add(cab2);
    const f=mkFire();f.position.set(0.25,0,1.15);g.add(f);          // двор на юге, виден
    const hd=mkHide();hd.position.set(1.5,0,1.05);hd.rotation.y=-0.2;g.add(hd);
    const wp=mkWoodpile();wp.position.set(-1.25,0,1.35);wp.rotation.y=1.25;g.add(wp);
    for(const [bx,bz,bs] of [[0.85,1.6,1],[-0.5,1.75,0.8]]){
      const bk=mkBasket(bs);bk.position.set(bx,0,bz);g.add(bk);}
    // частокол дугой на севере, ЗА домами (+ связующая жердь из эталона)
    const stakes=[];
    for(let i=0;i<13;i++){const a=(202+i*10.5)*Math.PI/180;
      const h2=rr(0.55,0.8);
      const px=Math.cos(a)*(HEXR*0.72), pz=Math.sin(a)*(HEXR*0.72);
      const py=heightAt(cx+px,cz+pz)-hV;      // частокол уже на склоне площадки
      const k2=new THREE.Mesh(new THREE.CylinderGeometry(rr(0.028,0.035),rr(0.04,0.05),h2,6),M.log);
      k2.position.set(px,py+h2/2,pz);
      k2.rotation.set(rr(-0.06,0.06),0,rr(-0.06,0.06));k2.castShadow=true;g.add(k2);
      const tip=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.08,6),M.ring);
      tip.position.set(px,py+h2+0.03,pz);g.add(tip);
      stakes.push([px,py+h2*0.72,pz]);}
    for(let i=0;i<stakes.length-1;i++){
      const [x1,y1,z1]=stakes[i],[x2,y2,z2]=stakes[i+1];
      const len=Math.hypot(x2-x1,y2-y1,z2-z1);
      const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,len,5),M.log);
      bar.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
      bar.rotation.z=Math.PI/2-Math.atan2(y2-y1,Math.hypot(x2-x1,z2-z1));
      bar.rotation.y=-Math.atan2(z2-z1,x2-x1);
      const hb=new THREE.Group();hb.add(bar);g.add(hb);
      bar.rotation.set(0,0,0);
      hb.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
      bar.position.set(0,0,0);
      hb.lookAt(hb.position.clone().add(new THREE.Vector3(x2-x1,y2-y1,z2-z1)));
      bar.rotation.x=Math.PI/2;}
    // стяг сбоку-спереди
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.026,1.9,5),M.log);
    pole.position.set(1.35,0.95,0.72);pole.castShadow=true;g.add(pole);
    const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.3),
      new THREE.MeshStandardMaterial({color:0x8e2a20,side:THREE.DoubleSide,roughness:0.9}));
    flag.position.set(1.62,1.75,0.72);g.add(flag);
    g.scale.setScalar(0.72);                 // масштаб поселения: ~1/4 гекса, как в циве
    g.userData.flat=true;
    return g; },
  field(cx,cz){ const g=new THREE.Group();   // борозды рисует сплат, тут только снопы
    const hF=flatHeight({x:cx,z:cz,type:'field'});
    g.position.y=hF;
    for(let i=0;i<4;i++){ const a=R()*Math.PI*2, d=Math.sqrt(R())*HEXR*0.6;
      const lx=Math.cos(a)*d, lz=Math.sin(a)*d;
      if(heightAt(cx+lx,cz+lz)<hF-0.25)continue;     // река врезала край — сноп не висит
      const sh=mkSheaf();sh.scale.setScalar(0.68);   // сноп ~0.4 м, не треть хаты
      sh.position.set(lx,0,lz);
      sh.rotation.y=R()*Math.PI*2;g.add(sh);}
    g.userData.flat=true;
    return g; },
};

// ================= ДЕКОР ПО КАРТЕ (позиции — по рельефу, без вращения групп) =================
for(const c of CENTERS){
  const t=TILES[c.type]&&TILES[c.type](c.x,c.z);
  if(!t) continue;
  t.position.x=c.x; t.position.z=c.z;   // y уже выставлен площадками village/field
  scene.add(t);
}

// ================= ФИКС-КАМЕРА (цивовский ракурс) =================
const q=new URLSearchParams(location.search);
const CH=q.get('h')!=null?+q.get('h'):40;
const CX=+(q.get('cx')||0), CZ=+(q.get('cz')||-1);   // ?cx&cz — куда смотреть
camera.position.set(CX,CH*0.82,CZ+CH*0.62);
camera.lookAt(CX,0,CZ);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableRotate=false;                          // фикс-ракурс
controls.mouseButtons.LEFT=THREE.MOUSE.PAN;
controls.touches.ONE=THREE.TOUCH.PAN;
controls.enableDamping=true;controls.target.set(CX,0,CZ);
controls.minDistance=8;controls.maxDistance=60;

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
// цив-камера: вблизи ложится горизонтальнее (видны фасады), вдали встаёт вертикальнее
(function loop(){requestAnimationFrame(loop);controls.update();
  const d=camera.position.distanceTo(controls.target);
  const t=Math.min(1,Math.max(0,(d-18)/(46-18)));   // горизонталь уже к ~18 м (просьба 01.10)
  const el=(35+(64-35)*t)*Math.PI/180;
  camera.position.set(controls.target.x,controls.target.y+Math.sin(el)*d,controls.target.z+Math.cos(el)*d);
  camera.lookAt(controls.target);
  renderer.render(scene,camera);})();
// готовность — после загрузки фото-текстур (иначе кадр со стенда серый)
let _rdy=false;
texMan.onLoad=()=>{ if(!_rdy){_rdy=true; window.__ready=true;} };
setTimeout(()=>{ if(!_rdy){_rdy=true; window.__ready=true;} },20000);
</script>
