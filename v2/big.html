function cnv(n){const c=document.createElement('canvas');c.width=c.height=n;return c;}
function tex(c,rep=1){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;return t;}

// плотная трава тайла (детальная, тайлится на плитке)
function grassCanvas(seed,base,dryK){
  const c=cnv(512);const g=c.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(seed);
  g.fillStyle=base;g.fillRect(0,0,512,512);
  for(let i=0;i<180;i++){ // крупные пятна свет/сушь
    g.fillStyle=`hsla(${74+L()*30},${30+L()*22}%,${24+L()*20}%,${0.25+L()*0.3})`;
    g.beginPath();g.ellipse(L()*512,L()*512,14+L()*52,10+L()*36,L()*3,0,7);g.fill();}
  for(let i=0;i<9000;i++){ // травинки
    const x=L()*512,y=L()*512,t0=L();
    g.strokeStyle=`hsla(${70+t0*34},${34+t0*26}%,${20+t0*30}%,0.8)`;
    g.lineWidth=0.8+L()*1.3;g.beginPath();g.moveTo(x,y);
    g.lineTo(x+(L()-0.5)*4,y-3-L()*7);g.stroke();}
  if(dryK)for(let i=0;i<160;i++){ // сухие метёлки
    const x=L()*512,y=L()*512;
    g.strokeStyle=`hsla(${48+L()*14},${40+L()*20}%,${44+L()*20}%,${0.5*dryK})`;
    g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+(L()-0.5)*5,y-6-L()*8);g.stroke();}
  for(let i=0;i<240;i++){ // земля проплешинами
    g.fillStyle=`hsla(${30+L()*12},${26+L()*14}%,${28+L()*14}%,${0.2+L()*0.25})`;
    g.beginPath();g.ellipse(L()*512,L()*512,2+L()*6,1.5+L()*4,L()*3,0,7);g.fill();}
  return c;
}

function strawCanvas(w,h,frayed){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#b08a3e';g.fillRect(0,0,w,h);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(777+w+h);
  for(let i=0;i<w*3;i++){const x=L()*w, wd=0.8+L()*1.8, v=L();
    g.strokeStyle=`hsl(${34+L()*12} ${30+L()*22}% ${22+v*30}%)`;g.lineWidth=wd;g.beginPath();
    const bow=(L()-0.5)*6;g.moveTo(x,-4);g.quadraticCurveTo(x+bow,h*0.5,x+(L()-0.5)*10,h+4);g.stroke();}
  for(let i=0;i<w/6;i++){const x=L()*w;g.strokeStyle='rgba(60,40,10,0.35)';g.lineWidth=2+L()*3;
    g.beginPath();g.moveTo(x,0);g.lineTo(x+(L()-0.5)*14,h);g.stroke();}
  if(frayed){
    g.globalCompositeOperation='destination-out';
    for(let x=0;x<w;x+=2){const d=h*(0.06+0.10*L());g.fillRect(x,h-d,2,d);}
    g.globalCompositeOperation='source-over';
  }
  return c;
}

{ const lg=leafC.getContext('2d');

// карточка листвы: плотная листовая масса по кластерной маске, рваный край
const leafCardC=cnv(256);
{ const lg=leafCardC.getContext('2d');lg.clearRect(0,0,256,256);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(909);
  // маска кластера: слитые овалы
  const blobs=[];
  for(let b=0;b<6;b++)blobs.push([128+(L()-0.5)*120,128+(L()-0.5)*110,42+L()*38,34+L()*30]);
  const inMask=(x,y)=>blobs.some(([bx,by,rx,ry])=>((x-bx)/rx)**2+((y-by)/ry)**2<1);
  // тёмная подложка массы
  for(const [bx,by,rx,ry] of blobs){
    lg.fillStyle='rgba(28,42,18,0.9)';
    lg.beginPath();lg.ellipse(bx,by,rx*0.92,ry*0.92,0,0,7);lg.fill();}
  // листья: сотни мелких, светлее к краям массы
  for(let i=0;i<2400;i++){
    const x=L()*256,y=L()*256;
    const inside=inMask(x,y);
    if(!inside && L()>0.06) continue;          // редкие листья за маской = рваный край
    lg.fillStyle=`hsla(${78+L()*36},${32+L()*26}%,${22+L()*30}%,${0.8+L()*0.2})`;
    lg.beginPath();lg.ellipse(x,y,1.2+L()*2.6,0.9+L()*2,L()*3,0,7);lg.fill();}
  // блики верхних листьев
  for(let i=0;i<420;i++){
    const x=L()*256,y=L()*256; if(!inMask(x,y)) continue;
    lg.fillStyle=`hsla(${84+L()*26},${40+L()*20}%,${44+L()*18}%,0.75)`;
    lg.beginPath();lg.ellipse(x,y,1+L()*1.8,0.8+L()*1.4,L()*3,0,7);lg.fill();}}
const leafCardT=(()=>{const t=new THREE.CanvasTexture(leafCardC);t.colorSpace=THREE.SRGBColorSpace;return t;})();

// фото-текстуры CC0 (ambientCG): цвет + нормали + затенение пор

// макро-вариация оттенка (лечит «заливку» фото-травы с высоты)
function addMacro(mat,amp=0.16,scale=1.7){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uMac={value:[amp,scale]};
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform vec2 uMac;')
      .replace('#include <map_fragment>',
        `#include <map_fragment>\n{ vec2 mu=vMapUv*uMac.y;
          float n=sin(mu.x*3.1+mu.y*5.3)*0.5+sin(mu.x*7.7-mu.y*2.9+1.7)*0.3+sin(mu.x*1.3+mu.y*1.1+4.2)*0.6;
          diffuseColor.rgb*=1.0+n*uMac.x*0.5;
          diffuseColor.g*=1.0+sin(mu.x*2.2-mu.y*3.7)*uMac.x*0.35; }`);};
  return mat;
}

// ================= СПЛОШНОЕ ПОЛОТНО (как в циве: гекс — логика, земля непрерывна) =================
const HEXR=3.2;                 // радиус гекса (по вершинам)
// проба рек/дорог: ?rv=0 русло-вода | 1 нарисованная лента | 2 лента+блики; ?rd=0 как было | 1 чёткий тракт | 2 протоптанная тропа
const Q0=new URLSearchParams(location.search);
const RV=+(Q0.get('rv')||4), RD=+(Q0.get('rd')||0);   // река rv4 — утверждённый вид
// ================= КАРТА 112×84 (средняя прошлого движка), КОЛЬЦО по X =================
// Генератор БУКВ в тех же тайлах; кусок 9×9 с деревней — в центре как есть.
const COLS=112, ROWS=84;
const PER=(x,f,ph)=>Math.sin(x*2*Math.PI*f/COLS+ph);     // периодические гармоники по колонкам
const h2d=(a,b)=>{let h=(a|0)*374761393+(b|0)*668265263;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967296;};
function fbmP(c,r,f0,oct){ let v=0,amp=1,f=f0,sum=0;      // шум, честно замкнутый по колонкам
  for(let o=0;o<oct;o++){ v+=amp*(PER(c,f,o*1.7)*Math.cos(r*0.11*f+o)+PER(c,f*1.7,o*2.3+1)*Math.sin(r*0.07*f+2*o));
    sum+=amp; amp*=0.55; f*=1.9; }
  return v/sum; }
const PIECE=[
"n n n n m p w w w","n t m m m p f w w","t t p m g f2 w w w",
"h h g f v f2 mh w w","g g g f f2 g mh w w","g d d g g g w w w",
"sv sv sv d g j j w w","s s sv sv j j w w w","s s s sv j w w w w"].map(r=>r.split(' '));
const PR0=Math.floor(ROWS/2)-4, PC0=Math.floor(COLS/2)-4;   // кусок в центре
function cellType(c,r){
  if(r>=PR0&&r<PR0+9&&c>=PC0&&c<PC0+9) return PIECE[r-PR0][c-PC0];
  const lat=Math.abs(r-(ROWS-1)/2)/((ROWS-1)/2);            // 0 экватор … 1 полюс
  const wet=0.65*fbmP(c,r,3,4)+0.35*fbmP(c+11,r*1.7+7,7,3), rough=fbmP(c+37,r*1.13+11,5,3); // влажность из двух масштабов: сухие зоны пятнами
  const sea=fbmP(c+73,r*0.9+51,2,4);
  if(sea>0.34-0.12*Math.max(0,0.55-lat)) return 'w';        // моря: у экватора чуть больше воды
  const lake=fbmP(c+131,r*1.21+77,9,3);
  if(lake>0.55&&lat<0.78) return 'w';   // озёр меньше (вердикт 05.10)                       // озёра: мелкие пятна 1-3 гекса
  if(lat>0.93) return 'w';                                  // полярные воды-кромка
  if(lat>0.82) return rough>0.3?'m':'n';
  if(lat>0.74) return rough>0.37?'m':'t';                   // тундровая полоса (закон биомов 02.10)
  if(lat>0.62) return rough>0.36?'m':'p';                    // тайга
  if(lat>0.5){ if(rough>0.43)return 'm'; if(rough>0.24)return 'h';
    return wet>0.18?'p':(wet>-0.25?'f':'g'); }
  if(lat>0.3){ if(rough>0.47)return 'm'; if(rough>0.27)return 'h';
    if(wet>0.14)return 'f'; if(wet>-0.18)return 'g'; return 'd'; }
  if(lat>0.18){ if(rough>0.45)return 'h'; if(wet>0.3)return 'j';
    if(wet>0.12)return 'f'; if(wet>-0.02)return 'g'; if(wet>-0.25)return 'sv'; if(wet>-0.42)return 'd'; return 's'; }
  if(wet>0.3)return 'j'; if(wet>0.05)return 'sv'; if(wet>-0.25)return 'd'; return 's';
}

let rivUX=1e9,rivUZ=1e9;
function updRivU(x,z){
  if(!terU)return;
  if(Math.hypot(x-rivUX,z-rivUZ)<12)return;
  rivUX=x; rivUZ=z;
  const xx=normX(x), sh=x-xx, R2=130, cand=[], seen=new Set();
  for(let gx=Math.floor((xx-R2)/RCS2);gx<=Math.floor((xx+R2)/RCS2);gx++)
    for(let gz=Math.floor((z-R2)/RCS2);gz<=Math.floor((z+R2)/RCS2);gz++){
      const l=RSEG.get(rk2(gx,gz)); if(!l)continue;
      for(const g of l){
        const off=Math.round((g[0]-RIVLIST[g[4]].pts[g[5]][0])/WX);
        const id=(g[4]*100000+g[5])*3+off+1; if(seen.has(id))continue; seen.add(id);
        const mx=(g[0]+g[2])/2,mz=(g[1]+g[3])/2;
        cand.push([Math.hypot(mx-xx,mz-z),g]); } }
  cand.sort((a,b)=>a[0]-b[0]);
  const u=terU.uRiv.value;
  for(let k=0;k<64;k++){
    if(k<cand.length){ const g=cand[k][1];
      u[2*k].set(g[0]+sh,g[1]); u[2*k+1].set(g[2]+sh,g[3]); }
    else { u[2*k].set(9999,9999); u[2*k+1].set(9999,9999); } }

function scatterOnHex(g,n,fn,rMax=HEXR*0.72,cx=0,cz=0){
  for(let i=0;i<n;i++){
    const a=R()*Math.PI*2, d=Math.sqrt(R())*rMax;
    const lx=Math.cos(a)*d, lz=Math.sin(a)*d;
    const y=heightAt(cx+lx,cz+lz);
    if(y<-0.32||(RV>0&&riverT(cx+lx,cz+lz)>0.2))continue;  // в воду/русло/нарисованную реку не ставим
    const o=fn(i);o.position.set(lx,y-0.03,lz);
    o.rotation.y=R()*Math.PI*2;g.add(o);}
}

const tuftGeo=(()=>{ const g1=new THREE.PlaneGeometry(0.34,0.26); g1.translate(0,0.12,0);
  const g2=g1.clone(); g2.rotateY(Math.PI/2);
  const g=new THREE.BufferGeometry(); const ps=[],us=[];
  for(const gg of [g1,g2]){ const n=gg.toNonIndexed();
    ps.push(...n.attributes.position.array); us.push(...n.attributes.uv.array); }
  g.setAttribute('position',new THREE.Float32BufferAttribute(ps,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(us,2));
  g.computeVertexNormals(); return g; })();
const tuftTex=(()=>{ const c=cnv(64); const g=c.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(41);
  for(let i=0;i<12;i++){ const x=8+L()*48;   // травинки толще и светлее: тонкие в мипах чернели
    g.strokeStyle=`hsl(${72+L()*30} ${40+L()*22}% ${36+L()*24}%)`;
    g.lineWidth=2.2+L()*2; g.beginPath(); g.moveTo(x,64);
    g.quadraticCurveTo(x+(L()-0.5)*12,32,x+(L()-0.5)*20,5+L()*12); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; })();
const tuftMat=new THREE.MeshStandardMaterial({map:tuftTex,alphaTest:0.35,side:THREE.DoubleSide,roughness:1});
function addTufts(g,n,cx,cz,dryK=0){
  const im=new THREE.InstancedMesh(tuftGeo,tuftMat,n);
  const Mx=new THREE.Matrix4(),Q=new THREE.Quaternion(),E=new THREE.Euler(),C=new THREE.Color();
  let put=0;
  for(let i=0;i<n;i++){
    const a=R()*Math.PI*2, d=Math.sqrt(R())*HEXR*0.86;
    const lx=Math.cos(a)*d, lz=Math.sin(a)*d;
    const ty2=heightAt(cx+lx,cz+lz); if(ty2<-0.32||(RV>0&&riverT(cx+lx,cz+lz)>0.2))continue;
    E.set(0,R()*Math.PI,0); Q.setFromEuler(E);
    Mx.compose(new THREE.Vector3(lx,ty2+0.02,lz),Q,
      new THREE.Vector3(rr(0.7,1.4),rr(0.6,1.4),1));
    im.setMatrixAt(put,Mx);
    C.setHSL(0.22+rr(-0.03,0.03)-dryK*0.115,rr(0.35,0.55)+dryK*0.1,rr(0.44,0.6)+dryK*0.09,THREE.SRGBColorSpace);
    im.setColorAt(put,C); put++; }

}

      ttl='Река'; tcol='#4a90d8'; tsub=['ручей','средняя река','крупная река'][vd.cls];
      extra=`<div class="row"><span class="k">Глубина</span><span class="v">${word} · ${fm(D)} м</span></div>
        <div class="row"><span class="k">Берега</span><span class="v">${bn}</span></div>`;
    } else {
      ttl=bn; tcol=bc; tsub=bd;
      if(vd){
        const D=vd.D, word = D<FORD_MAX ? 'мелко · можно вброд' : D<5 ? 'глубоко · вброд нельзя' : 'глубоко · только паром';
        extra=`<div class="row"><span class="k">Глубина</span><span class="v">${word} · ${fm(D)} м</span></div>`;
        if(c.type!=='water'){ ttl=BINFO.water[0]; tcol=BINFO.water[1]; tsub=BINFO.water[2]; }
        else if(vd.lake)ttl='Озеро'; else if(vd.far)tsub='открытое море';
      } else if(c.type!=='water'&&c.type!=='hills'){
        // рельеф в заголовке, как в старом: высоко → «Горный склон», крутая клетка → «Крутой склон»; строки «Почва» нет — в новом мире нет карты влажности
        if(hh>2.5*K){ ttl='Горный склон'; tsub=bn.toLowerCase()+' высоко в горах'; tcol='#8d8d95'; }
        else if(slopeOf(c)>=0.85*K){ ttl='Крутой склон'; tsub=bn.toLowerCase()+' на круче'; tcol='#a4906c'; }
      }
    }
    tip.innerHTML=`<div class="strip" style="background:${tcol}"></div><div class="in">
      <div class="ttl">${ttl}</div><div class="sub">${tsub}</div>${extra}</div>`;
    tip.classList.add('on');
    const pad=15; let x=cx+pad, y=cy+pad;
    const r=tip.getBoundingClientRect();
    if(x+r.width>innerWidth-6) x=cx-pad-r.width;
    if(y+r.height>innerHeight-6) y=cy-pad-r.height;
    tip.style.left=Math.max(6,x)+'px'; tip.style.top=Math.max(6,y)+'px';
    window.__hov={col:c.col,row:c.row,type:c.type,ttl,sub:tsub,x:+p.x.toFixed(1),z:+p.z.toFixed(1),h:+hh.toFixed(2),slp:+slopeOf(c).toFixed(2),D:vd?+vd.D.toFixed(2):null};
  }
  const dom=renderer.domElement; let pend=null;
  dom.addEventListener('pointerleave',()=>{ pend=null; hide(); });
  dom.addEventListener('pointermove',ev=>{                       // не чаще раза за кадр: луч считается по heightAt
    const first=!pend; pend=[ev.clientX,ev.clientY];
    if(first)requestAnimationFrame(()=>{ if(!pend)return; const q=pend; pend=null; if(_built)hover(q[0],q[1]); }); });
  window.__hoverAt=(cx,cy)=>{ hover(cx,cy); return window.__hov; };   // мостик для стендовых проверок
})();
(function loop(){requestAnimationFrame(loop);
  if(!_built)return;
  { const tn=performance.now()*0.001;                 // живая вода: два слоя ряби бегут в шейдере (старый uLabT)
    waterUniforms.uLabT.value=tn;
    if(terU)terU.uTime.value=tn; }
  controls.update();
  const T=controls.target;
  T.z=Math.max(MINZ+9,Math.min(MAXZ-9,T.z));        // 08.10: физический край — дальше ледников не уедешь (по X мир кольцо)
  const d=camera.position.distanceTo(T);
  const t=Math.min(1,Math.max(0,(d-16)/(56-16)));   // ложится раньше и ниже (просьба 02.10)
  const el=(28+(64-28)*t)*Math.PI/180;
  scene.fog.near=0.55*d+36; scene.fog.far=Math.min(265,2.1*d+85);  // туман отъезжает с зумом
  T.y=Math.max(-0.4,heightAt(T.x,T.z));             // цель на рельефе: зум в гору не ныряет
  camera.position.set(T.x,T.y+Math.sin(el)*d,T.z+Math.cos(el)*d);
  const hc=heightAt(camera.position.x,camera.position.z)+1.1;
  if(camera.position.y<hc)camera.position.y=hc;      // камера никогда не под землёй
  camera.lookAt(T);
  if(terU)terU.uCamD.value=d;                        // ширина речной нитки растёт с отлётом
  waterMesh.position.set(T.x,-0.62,T.z);
  sun.position.set(T.x+28,40,T.z+30); sun.target.position.set(T.x,0,T.z);
  renderer.render(scene,camera);
  if(!window.__riT||performance.now()-window.__riT>1000){ window.__riT=performance.now();
    window.__ri={calls:renderer.info.render.calls,tris:renderer.info.render.triangles}; }})();
</script>
