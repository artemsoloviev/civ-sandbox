function cnv(n){const c=document.createElement('canvas');c.width=c.height=n;return c;}
function tex(c,rep=1){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;return t;}

// плотная трава тайла (детальная, тайлится на плитке)
function grassCanvas(seed,base,dryK){
  const c=cnv(512);const g=c.getContext('2d');
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(seed);
  g.fillStyle=base;g.fillRect(0,0,512,512);
  for(let i=0;i<180;i++){ // крупные пятна свет/сушь
    g.fillStyle=`hsla(${74+L()*30},${30+L()*22}%,${24+L()*20}%,${0.25+L()*0.3})`;
    g.beginPath();g.ellipse(L()*512,L()*512,14+L()*52,10+L()*36,L()*3,0,7);g.fill();}
  for(let i=0;i<9000;i++){ // травинки
    const x=L()*512,y=L()*512,t0=L();
    g.strokeStyle=`hsla(${70+t0*34},${34+t0*26}%,${20+t0*30}%,0.8)`;
    g.lineWidth=0.8+L()*1.3;g.beginPath();g.moveTo(x,y);
    g.lineTo(x+(L()-0.5)*4,y-3-L()*7);g.stroke();}
  if(dryK)for(let i=0;i<160;i++){ // сухие метёлки
    const x=L()*512,y=L()*512;
    g.strokeStyle=`hsla(${48+L()*14},${40+L()*20}%,${44+L()*20}%,${0.5*dryK})`;
    g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+(L()-0.5)*5,y-6-L()*8);g.stroke();}
  for(let i=0;i<240;i++){ // земля проплешинами
    g.fillStyle=`hsla(${30+L()*12},${26+L()*14}%,${28+L()*14}%,${0.2+L()*0.25})`;
    g.beginPath();g.ellipse(L()*512,L()*512,2+L()*6,1.5+L()*4,L()*3,0,7);g.fill();}
  return c;
}

function strawCanvas(w,h,frayed){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#b08a3e';g.fillRect(0,0,w,h);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(777+w+h);
  for(let i=0;i<w*3;i++){const x=L()*w, wd=0.8+L()*1.8, v=L();
    g.strokeStyle=`hsl(${34+L()*12} ${30+L()*22}% ${22+v*30}%)`;g.lineWidth=wd;g.beginPath();
    const bow=(L()-0.5)*6;g.moveTo(x,-4);g.quadraticCurveTo(x+bow,h*0.5,x+(L()-0.5)*10,h+4);g.stroke();}
  for(let i=0;i<w/6;i++){const x=L()*w;g.strokeStyle='rgba(60,40,10,0.35)';g.lineWidth=2+L()*3;
    g.beginPath();g.moveTo(x,0);g.lineTo(x+(L()-0.5)*14,h);g.stroke();}
  if(frayed){
    g.globalCompositeOperation='destination-out';
    for(let x=0;x<w;x+=2){const d=h*(0.06+0.10*L());g.fillRect(x,h-d,2,d);}
    g.globalCompositeOperation='source-over';
  }
  return c;
}

{ const lg=leafC.getContext('2d');

// карточка листвы: плотная листовая масса по кластерной маске, рваный край
const leafCardC=cnv(256);
{ const lg=leafCardC.getContext('2d');lg.clearRect(0,0,256,256);
  const L=(s=>()=> (s=(s*1103515245+12345)>>>0)/4294967296)(909);
  // маска кластера: слитые овалы
  const blobs=[];
  for(let b=0;b<6;b++)blobs.push([128+(L()-0.5)*120,128+(L()-0.5)*110,42+L()*38,34+L()*30]);
  const inMask=(x,y)=>blobs.some(([bx,by,rx,ry])=>((x-bx)/rx)**2+((y-by)/ry)**2<1);
  // тёмная подложка массы
  for(const [bx,by,rx,ry] of blobs){
    lg.fillStyle='rgba(28,42,18,0.9)';
    lg.beginPath();lg.ellipse(bx,by,rx*0.92,ry*0.92,0,0,7);lg.fill();}
  // листья: сотни мелких, светлее к краям массы
  for(let i=0;i<2400;i++){
    const x=L()*256,y=L()*256;
    const inside=inMask(x,y);
    if(!inside && L()>0.06) continue;          // редкие листья за маской = рваный край
    lg.fillStyle=`hsla(${78+L()*36},${32+L()*26}%,${22+L()*30}%,${0.8+L()*0.2})`;
    lg.beginPath();lg.ellipse(x,y,1.2+L()*2.6,0.9+L()*2,L()*3,0,7);lg.fill();}
  // блики верхних листьев
  for(let i=0;i<420;i++){
    const x=L()*256,y=L()*256; if(!inMask(x,y)) continue;
    lg.fillStyle=`hsla(${84+L()*26},${40+L()*20}%,${44+L()*18}%,0.75)`;
    lg.beginPath();lg.ellipse(x,y,1+L()*1.8,0.8+L()*1.4,L()*3,0,7);lg.fill();}}
const leafCardT=(()=>{const t=new THREE.CanvasTexture(leafCardC);t.colorSpace=THREE.SRGBColorSpace;return t;})();

// макро-вариация оттенка (лечит «заливку» фото-травы с высоты)
function addMacro(mat,amp=0.16,scale=1.7){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uMac={value:[amp,scale]};
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform vec2 uMac;')
      .replace('#include <map_fragment>',
        `#include <map_fragment>\n{ vec2 mu=vMapUv*uMac.y;
          float n=sin(mu.x*3.1+mu.y*5.3)*0.5+sin(mu.x*7.7-mu.y*2.9+1.7)*0.3+sin(mu.x*1.3+mu.y*1.1+4.2)*0.6;
          diffuseColor.rgb*=1.0+n*uMac.x*0.5;
          diffuseColor.g*=1.0+sin(mu.x*2.2-mu.y*3.7)*uMac.x*0.35; }`);};
  return mat;
}

// ================= СПЛОШНОЕ ПОЛОТНО (как в циве: гекс — логика, земля непрерывна) =================
const HEXR=3.2;                 // радиус гекса (по вершинам)
// проба рек/дорог: ?rv=0 русло-вода | 1 нарисованная лента | 2 лента+блики; ?rd=0 как было | 1 чёткий тракт | 2 протоптанная тропа
const Q0=new URLSearchParams(location.search);
const RV=+(Q0.get('rv')||4), RD=+(Q0.get('rd')||0);   // река rv4 — утверждённый вид
// ================= КАРТА 112×84 (средняя прошлого движка), КОЛЬЦО по X =================
// Генератор БУКВ в тех же тайлах; кусок 9×9 с деревней — в центре как есть.
const COLS=112, ROWS=84;
const PER=(x,f,ph)=>Math.sin(x*2*Math.PI*f/COLS+ph);     // периодические гармоники по колонкам
const h2d=(a,b)=>{let h=(a|0)*374761393+(b|0)*668265263;h=(h^(h>>>13))*1274126177;return ((h^(h>>>16))>>>0)/4294967296;};
function fbmP(c,r,f0,oct){ let v=0,amp=1,f=f0,sum=0;      // шум, честно замкнутый по колонкам
  for(let o=0;o<oct;o++){ v+=amp*(PER(c,f,o*1.7)*Math.cos(r*0.11*f+o)+PER(c,f*1.7,o*2.3+1)*Math.sin(r*0.07*f+2*o));
    sum+=amp; amp*=0.55; f*=1.9; }
  return v/sum; }
const PIECE=[
"n n n n m p w w w","n t m m m p f w w","t t p m g f2 w w w",
"h h g f v f2 mh w w","g g g f f2 g mh w w","g d d g g g w w w",
"sv sv sv d g j j w w","s s sv sv j j w w w","s s s sv j w w w w"].map(r=>r.split(' '));
const PR0=Math.floor(ROWS/2)-4, PC0=Math.floor(COLS/2)-4;   // кусок в центре
function cellType(c,r){
  if(r>=PR0&&r<PR0+9&&c>=PC0&&c<PC0+9) return PIECE[r-PR0][c-PC0];
  const lat=Math.abs(r-(ROWS-1)/2)/((ROWS-1)/2);            // 0 экватор … 1 полюс
  const wet=0.65*fbmP(c,r,3,4)+0.35*fbmP(c+11,r*1.7+7,7,3), rough=fbmP(c+37,r*1.13+11,5,3); // влажность из двух масштабов: сухие зоны пятнами
  const sea=fbmP(c+73,r*0.9+51,2,4);
  if(sea>0.34-0.12*Math.max(0,0.55-lat)) return 'w';        // моря: у экватора чуть больше воды
  const lake=fbmP(c+131,r*1.21+77,9,3);
  if(lake>0.48&&lat<0.78) return 'w';                       // озёра: мелкие пятна 1-3 гекса
  if(lat>0.93) return 'w';                                  // полярные воды-кромка
  if(lat>0.82) return rough>0.25?'m':'n';
  if(lat>0.74) return rough>0.32?'m':'t';                   // тундровая полоса (закон биомов 02.10)
  if(lat>0.62) return rough>0.3?'m':'p';                    // тайга
  if(lat>0.5){ if(rough>0.38)return 'm'; if(rough>0.24)return 'h';
    return wet>0.18?'p':(wet>-0.25?'f':'g'); }
  if(lat>0.3){ if(rough>0.42)return 'm'; if(rough>0.27)return 'h';
    if(wet>0.14)return 'f'; if(wet>-0.18)return 'g'; return 'd'; }
  if(lat>0.18){ if(rough>0.45)return 'h'; if(wet>0.3)return 'j';
    if(wet>0.12)return 'f'; if(wet>-0.02)return 'g'; if(wet>-0.25)return 'sv'; if(wet>-0.42)return 'd'; return 's'; }
  if(wet>0.3)return 'j'; if(wet>0.05)return 'sv'; if(wet>-0.25)return 'd'; return 's';
}

let rivUX=1e9,rivUZ=1e9;
function updRivU(x,z){
  if(!terU)return;
  if(Math.hypot(x-rivUX,z-rivUZ)<12)return;
  rivUX=x; rivUZ=z;
  const xx=normX(x), sh=x-xx, R2=130, cand=[], seen=new Set();
  for(let gx=Math.floor((xx-R2)/RCS2);gx<=Math.floor((xx+R2)/RCS2);gx++)
    for(let gz=Math.floor((z-R2)/RCS2);gz<=Math.floor((z+R2)/RCS2);gz++){
      const l=RSEG.get(rk2(gx,gz)); if(!l)continue;
      for(const g of l){
        const off=Math.round((g[0]-RIVLIST[g[4]].pts[g[5]][0])/WX);
        const id=(g[4]*100000+g[5])*3+off+1; if(seen.has(id))continue; seen.add(id);
        const mx=(g[0]+g[2])/2,mz=(g[1]+g[3])/2;
        cand.push([Math.hypot(mx-xx,mz-z),g]); } }
  cand.sort((a,b)=>a[0]-b[0]);
  const u=terU.uRiv.value;
  for(let k=0;k<32;k++){
    if(k<cand.length){ const g=cand[k][1];
      u[2*k].set(g[0]+sh,g[1]); u[2*k+1].set(g[2]+sh,g[3]); }
    else { u[2*k].set(9999,9999); u[2*k+1].set(9999,9999); } }
}

function chunkGeo(ix,iz,seg){
  const n=Math.max(8,Math.round(CH/seg));
  // внешнее кольцо вершин прижато к границе и уходит отвесно вниз (стенка в щель);
  // нормали — аналитически из сетки высот: computeVertexNormals красил кромку в тень стенки
  const cell=CH/n;
  const g=new THREE.PlaneGeometry(CH+2*cell,CH+2*cell,n+2,n+2);
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position, uv=g.attributes.uv;
  const bx=ix*CH+CH/2, bz=iz*CH+CH/2, h=CH/2;
  const W=n+3, H=new Float32Array(W*W);
  for(let i=0;i<pos.count;i++){
    let lx=pos.getX(i), lz=pos.getZ(i);
    lx=Math.min(h,Math.max(-h,lx)); lz=Math.min(h,Math.max(-h,lz));
    pos.setX(i,lx); pos.setZ(i,lz);
    H[i]=heightAt(bx+lx,bz+lz);
    uv.setXY(i,(bx+lx)/2.2,(bz+lz)/2.2); }
  // снап кромки к урезу (лесенка берега, приём 15.09): на ребре со сменой знака (H−WL)
  // ближняя вершина тянется в точку изолинии → контур берега идёт по урезу, а не по квадратам сетки.
  // Граничные вершины чанка (слои 0,1 и W-2,W-1) поперёк границы не двигаем — стыки чанков совпадают.
  {
    const WL=-0.5, mvd=new Uint8Array(W*W);
    for(let r=1;r<W-1;r++)for(let c2=1;c2<W-1;c2++){
      const i=r*W+c2;
      if(c2<W-2){ const j=i+1, a=H[i]-WL, b2=H[j]-WL;
        if((a>0)!==(b2>0)){ let t=a/(a-b2); t=Math.min(0.96,Math.max(0.04,t));
          const near=t<0.5?i:j, cn=near%W;
          if(!mvd[near]&&cn>1&&cn<W-2){ mvd[near]=1;
            pos.setX(near,pos.getX(i)+(pos.getX(j)-pos.getX(i))*t); H[near]=WL+0.03; } } }
      if(r<W-2){ const j=i+W, a=H[i]-WL, b2=H[j]-WL;
        if((a>0)!==(b2>0)){ let t=a/(a-b2); t=Math.min(0.96,Math.max(0.04,t));
          const near=t<0.5?i:j, rn=(near-near%W)/W;
          if(!mvd[near]&&rn>1&&rn<W-2){ mvd[near]=1;
            pos.setZ(near,pos.getZ(i)+(pos.getZ(j)-pos.getZ(i))*t); H[near]=WL+0.03; } } }
    }
  }
  const nrm=new Float32Array(pos.count*3);
  for(let r=0;r<W;r++)for(let c=0;c<W;c++){
    const i=r*W+c;
    const tc=Math.max(1,Math.min(W-2,c)), tr=Math.max(1,Math.min(W-2,r));
    const ca=Math.max(1,tc-1), cb=Math.min(W-2,tc+1);
    const ra=Math.max(1,tr-1), rb=Math.min(W-2,tr+1);
    const nx=(H[tr*W+ca]-H[tr*W+cb])/((cb-ca)*cell);
    const nz=(H[ra*W+tc]-H[rb*W+tc])/((rb-ra)*cell);
    const l=1/Math.hypot(nx,1,nz);
    nrm[i*3]=nx*l; nrm[i*3+1]=l; nrm[i*3+2]=nz*l; }
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  for(let r=0;r<W;r++)for(let c=0;c<W;c++){
    const i=r*W+c, out=(r===0||c===0||r===W-1||c===W-1);
    pos.setY(i,H[i]-(out?1.6:0)); }
  return g; }
function terRescan(tx,tz){
  terQueue.length=0;
  const ix0=Math.round(tx/CH), iz0=Math.round(tz/CH), R=Math.ceil(CH_FAR/CH);
  for(const [key,msh] of terChunks){
    const [ix,iz]=key.split(',').map(Number);
    const d=Math.hypot((ix*CH+CH/2)-tx,(iz*CH+CH/2)-tz);
    if(d>CH_DROP){ scene.remove(msh); msh.geometry.dispose(); terChunks.delete(key); } }
  for(let dx=-R;dx<=R;dx++)for(let dz=-R;dz<=R;dz++){
    const ix=ix0+dx, iz=iz0+dz;
    const d=Math.hypot((ix*CH+CH/2)-tx,(iz*CH+CH/2)-tz);
    if(d>CH_FAR)continue;
    // гистерезис ±9 м: чанк на границе зон не мечется между сетками (дрожали берега)
    const w=d<CH_NEAR-9?0:(d>CH_NEAR+9?1:null);
    if(w===null){ if(!terChunks.has(ix+','+iz+',0')&&!terChunks.has(ix+','+iz+',1'))
        terQueue.push([d,ix,iz,d<CH_NEAR?0:1]); }
    else if(!terChunks.has(ix+','+iz+','+w))terQueue.push([d,ix,iz,w]);
  }
  terQueue.sort((a,b)=>a[0]-b[0]);
}
function terTick(ms){                 // бюджет времени: на быстрой машине 1-2 чанка, на медленной не душит кадр
  const t0=performance.now();

    const [d,ix,iz,lod]=terQueue.shift();
    const key=ix+','+iz+','+lod; if(terChunks.has(key))continue;
    const seg=lod===0?0.30:0.9;
    const msh=new THREE.Mesh(chunkGeo(ix,iz,seg),terMat);
    msh.position.set(ix*CH+CH/2,0,iz*CH+CH/2);
    msh.castShadow=msh.receiveShadow=true;
    scene.add(msh); terChunks.set(key,msh);
    const ok=ix+','+iz+','+(lod?0:1);             // сменили сетку — старую убрать тем же шагом (без дыры и мерцания)
    if(terChunks.has(ok)){ const m2=terChunks.get(ok); scene.remove(m2); m2.geometry.dispose(); terChunks.delete(ok); } } }

  {const p2=new THREE.Group();p2.rotation.y=-aD;g.add(p2);
   for(const [px,pz,h] of [[RAD2+0.78,-0.5,0.88],[RAD2+0.76,0.48,0.92]]){

  {const lin=log(0.4,0.018,0.018);lin.rotation.z=Math.PI/2;
   lin.position.set(0.06,0.51,Dp/2+R2+0.015);g.add(lin);}

    const nR=4+Math.floor(R()*2), phi=R()*Math.PI*2, amp=rr(0.1,0.16);
    const px=rr(-0.12,0.12), pz=rr(-0.1,0.1);
    const sx=rr(0.46,0.54), sz=rr(0.38,0.46);
    const sec=rr(0.5,0.72), sh2=R()*Math.PI*2;
    const p2x=Math.cos(sh2)*0.45, p2z=Math.sin(sh2)*0.4;
    const fld=(u,v)=>{
      const th=Math.atan2(v-pz,u-px);
      const rib=1+amp*Math.sin(th*nR+phi);
      const d1=Math.hypot((u-px)/(sx*rib),(v-pz)/(sz*rib));
      let h=H0*Math.exp(-1.9*Math.pow(d1,0.85));
      const th2=Math.atan2(v-p2z,u-p2x);
      const rib2=1+amp*0.8*Math.sin(th2*(nR+1)+phi*1.7);
      const d2=Math.hypot((u-p2x)/(0.34*rib2),(v-p2z)/(0.3*rib2));
      h=Math.max(h,H0*sec*Math.exp(-1.9*Math.pow(d2,0.85)));
      const rE=Math.hypot(u,v*1.2);
      h*=1-Math.min(1,Math.max(0,(rE-0.82)/0.18));
      return [h,Math.sin(th*nR+phi)];
    };
    const mk=(snow)=>{ const g=new THREE.PlaneGeometry(RAD*2,RAD*2,N,N); g.rotateX(-Math.PI/2);
      const pos=g.attributes.position, uv=g.attributes.uv, cols=[];
      for(let i=0;i<pos.count;i++){
        const u=pos.getX(i)/RAD, v=pos.getZ(i)/RAD;
        const f=fld(u,v); let y=f[0]-0.4;
        if(snow){ const thr=H0*(0.7-0.07*f[1]);            // шапка: верхняя треть, зубцы по рёбрам
          y=(f[0]>thr)?y+0.06:y-0.45; }
        pos.setY(i,y);
        uv.setXY(i,(u*0.5+0.5)*RAD*2/2.2,(v*0.5+0.5)*RAD*2/2.2);
        if(snow)cols.push(1,1,1);
        else { const k=0.74+0.26*Math.max(0,f[1]);         // рёбра светлые, ложбины тёмные
          let r=k,g2=k*0.95,b2=k*0.88;
          if(f[0]<0.8){ const t=(0.8-f[0])/0.8; r*=(1-0.2*t); b2*=(1-0.28*t); }
          cols.push(r,g2,b2); } }
      g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
      g.computeVertexNormals(); return g; };
    return [mk(false),mk(true)];
  }
  const mRockMat=M.rock.clone(); mRockMat.vertexColors=true; mRockMat.roughness=1; mRockMat.metalness=0;
  const mSnowMat=new THREE.MeshStandardMaterial({map:M.snowCap.map,color:0xf4f7fb,roughness:0.92,vertexColors:true});
  const MVN=6,geos=[];for(let i=0;i<MVN;i++)geos.push(mGeo());
  const lists=geos.map(()=>[]);
  for(const c of mh.values()){
    const mb=MB.get(c.col+','+c.row)||0, ns=nbr(c);
    let ang=R()*Math.PI*2;
    if(ns.length){ const n0=ns[0];
      ang=Math.atan2(n0.z-c.z,wdx(n0.x,c.x))+(R()<0.5?0:Math.PI); }
    const sc2=rr(0.92,1.08)*(1+0.08*Math.min(1,mb));
    lists[Math.floor(R()*MVN)].push(new THREE.Matrix4().compose(
      new THREE.Vector3(c.x,heightAt(c.x,c.z)-0.35,c.z),
      new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-ang),
      new THREE.Vector3(sc2*1.2,sc2,sc2*0.95))); }
  for(let v=0;v<MVN;v++){ const L=lists[v]; if(!L.length)continue;
    for(let part=0;part<2;part++){
      const mat=part?mSnowMat:mRockMat;
      const im=new THREE.InstancedMesh(geos[v][part],mat,L.length);
      for(let i=0;i<L.length;i++)im.setMatrixAt(i,L[i]);
      im.frustumCulled=false; scene.add(im); MNT_A.push(im);
      const im2=new THREE.InstancedMesh(geos[v][part],mat,L.length);
      im2.instanceMatrix=im.instanceMatrix;
      im2.frustumCulled=false; scene.add(im2); MNT_B.push(im2); } }
}
const _zeroM=new THREE.Matrix4().makeScale(0,0,0);
function farShow(key,on){ const l=farReg.get(key); if(!l)return;
  for(const e of l){ (on?e.m:_zeroM).toArray(e.att.array,e.i*16); e.att.needsUpdate=true; } }
// окно полного декора: внутри — настоящие группы полигона, дальние инстансы гекса гасятся
const DEC_R=62, DEC_DROP=74;
const decMap=new Map(), decQueue=[];
let decTX=1e9,decTZ=1e9;
function decRescan(tx,tz){
  decTX=tx; decTZ=tz; decQueue.length=0;
  const sh0=Math.round(tx/WX)*WX, shB=sh0+(tx>=sh0?WX:-WX);
  for(const im of FAR_A)im.position.x=sh0;        // лист кольца под камерой + сосед со стороны взгляда
  const nearSeam=WX/2-Math.abs(tx-sh0)<260;       // вдали от шва второй лист не рисуем (полкадра даром)
  for(const im of FAR_B){im.position.x=shB;im.visible=nearSeam;}
  for(const im of MNT_A)im.position.x=sh0;        // горы-объекты ездят по кольцу теми же листами
  for(const im of MNT_B){im.position.x=shB;im.visible=nearSeam;}
  for(const c of CENTERS){
    const d=Math.hypot(wdx(c.x,tx),c.z-tz), key=c.col+','+c.row, has=decMap.has(key);
    if(d<DEC_R&&!has)decQueue.push([d,c]);
    else if(d>DEC_DROP&&has){ const e=decMap.get(key); decMap.delete(key);
      if(e.g){ scene.remove(e.g); e.g.traverse(o=>{if(o.geometry)o.geometry.dispose();}); }
      farShow(key,true); }
    else if(has){ const e=decMap.get(key); if(e&&e.tuf)e.tuf.visible=d<32; } }
  decQueue.sort((a,b)=>a[0]-b[0]);
}
function decTick(ms){
  const t0=performance.now();
  while(decQueue.length&&performance.now()-t0<ms){
    const [d,c]=decQueue.shift(), key=c.col+','+c.row;
    if(decMap.has(key))continue;
    farShow(key,false);
    const t=TILES[c.type]&&TILES[c.type](c.x,c.z);
    if(!t){ decMap.set(key,{g:null}); continue; }
    const px=c.x+Math.round((decTX-c.x)/WX)*WX;
    if(c.type==='village'||c.type==='field'){      // живые группы: их мало, мелочь важна
      t.position.x=px; t.position.z=c.z;
      scene.add(t); decMap.set(key,{g:t}); continue; }
    // запекание: сотни мешей тайла → 2-6 (главное лекарство от 8400 вызовов за кадр)
    const parts=bakeGroup(t,1,1,m=>m===tuftMat?'tuft':m===flowerMat?'flw':(m.map||0));
    const grp=new THREE.Group();
    for(const pb of parts){
      if(pb.key==='tuft'||pb.key==='flw'){ pb.geo.dispose(); continue; } // трава убрана (вердикт 02.10)
      const msh=new THREE.Mesh(pb.geo,bakedMat(pb.key,pb.map));
      msh.castShadow=true; grp.add(msh); }
    grp.position.set(px,0,c.z);
    scene.add(grp); decMap.set(key,{g:grp,tuf:null}); } }

// ================= ФИКС-КАМЕРА (цивовский ракурс) =================
const q=new URLSearchParams(location.search);
const CAMH=q.get('h')!=null?+q.get('h'):40;
const CX=q.get('cx')!=null?+q.get('cx'):(vC?vC.x:0), CZ=q.get('cz')!=null?+q.get('cz'):(vC?vC.z:-1);
camera.position.set(CX,CAMH*0.82,CZ+CAMH*0.62);
camera.lookAt(CX,0,CZ);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableRotate=false;                          // фикс-ракурс
controls.mouseButtons.LEFT=THREE.MOUSE.PAN;
controls.touches.ONE=THREE.TOUCH.PAN;
controls.enableDamping=true;controls.target.set(CX,0,CZ);
controls.minDistance=8;controls.maxDistance=100;   // дальний обзор (просьба 02.10)

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
// цив-камера: вблизи ложится горизонтальнее (видны фасады), вдали встаёт вертикальнее
scene.add(sun.target);                     // тень едет за целью камеры
// ===== МИНИКАРТА: клик = телепорт =====
const mmW=224, mmH=Math.round(mmW*(ROWS*dzH)/(COLS*dxH));
const mm=document.createElement('canvas'); mm.width=mmW; mm.height=mmH;
mm.style.cssText='position:fixed;left:10px;bottom:10px;width:224px;border:1px solid rgba(20,26,30,.65);border-radius:6px;z-index:8;cursor:pointer;opacity:.92';
document.body.appendChild(mm);
const mmg=mm.getContext('2d');
{ const MMCOL={water:'#3e5a66',meadow:'#7fae4e',forest:'#3f6d35',pines:'#2f5a40',hills:'#8a9a58',
    mountain:'#8d8578',snow:'#e8ecef',desert:'#d9c188',dry:'#c9c070',tundra:'#aab398',
    marsh:'#5d6b43',jungle:'#2e5c2e',savanna:'#b8a855',village:'#cc9966',field:'#aa9977'};
  for(let r2=0;r2<ROWS;r2++)for(let c2=0;c2<COLS;c2++){
    mmg.fillStyle=MMCOL[KEY[MAP[r2][c2]]]||'#888';
    mmg.fillRect(c2/COLS*mmW,r2/ROWS*mmH,mmW/COLS+1,mmH/ROWS+1); } }
const mmBase=mmg.getImageData(0,0,mmW,mmH);
setInterval(()=>{ mmg.putImageData(mmBase,0,0);
  const T=controls.target;
  const u=((normX(T.x)-WX0)/WX)*mmW, v=((T.z-MINZ)/(MAXZ-MINZ))*mmH;
  mmg.strokeStyle='#fff'; mmg.lineWidth=2; mmg.strokeRect(u-9,v-7,18,14); },500);
mm.addEventListener('click',e=>{
  const r2=mm.getBoundingClientRect();
  const wx=WX0+((e.clientX-r2.left)/r2.width)*WX, wz=MINZ+((e.clientY-r2.top)/r2.height)*(MAXZ-MINZ);
  const k=Math.round((controls.target.x-wx)/WX)*WX;    // ближайший лист кольца
  controls.target.x=wx+k; controls.target.z=wz;
  terCX=1e9;splCX=1e9;decTX=1e9;                       // рескан немедленно + кусок полотна сразу
  terRescan(controls.target.x,controls.target.z); terTick(350);
});
let _rdy=false,_texOK=false;
texMan.onLoad=()=>{_texOK=true;};
setTimeout(()=>{_texOK=true;},25000);
let terCX=1e9,terCZ=1e9,splCX=1e9,splCZ=1e9,_built=false;
const bootEl=document.createElement('div');   // заставка: без неё Safari считал сборку зависанием и перезагружал
bootEl.style.cssText='position:fixed;inset:0;background:#0e1a20;color:#cfe0ec;display:flex;flex-direction:column;align-items:center;justify-content:center;font:16px/1.6 system-ui;z-index:9';
bootEl.innerHTML='<div style="font-size:22px">Собираю мир…</div><div id="bootP" style="margin-top:8px;opacity:.8">0%</div>';
document.body.appendChild(bootEl);
(async()=>{ // ПЕРВИЧНАЯ СБОРКА — кусками ≤120 мс с передышками для браузера
  const Y=()=>new Promise(r=>setTimeout(r,0));
  const Pr=t=>{const e=document.getElementById('bootP'); if(e)e.textContent=t;};
  terCX=CX;terCZ=CZ;splCX=CX;splCZ=CZ;
  splSetWindow(CX,CZ);
  while(bakeRow<SPW){ const t0=performance.now();
    while(bakeRow<SPW&&performance.now()-t0<120)splTick();
    Pr('краски '+Math.round(bakeRow/SPW*50)+'%'); await Y(); }
  window.__t_bake=Math.round(performance.now());
  terRescan(CX,CZ);
  const tq0=terQueue.length||1;
  while(terQueue.length){ terTick(120);
    Pr('земля '+Math.round(50+(1-terQueue.length/tq0)*35)+'%'); await Y(); }
  decRescan(CX,CZ);
  const dq0=decQueue.length||1;
  while(decQueue.length){ decTick(120);
    Pr('деревья '+Math.round(85+(1-decQueue.length/dq0)*15)+'%'); await Y(); }
  updRivU(CX,CZ);
  window.__t_ter=Math.round(performance.now());
  _built=true; bootEl.remove();
  let tkN=0;
  (function waitTex(){ if(_texOK){_rdy=true;window.__ready=true;} else setTimeout(waitTex,200); })();
  setInterval(()=>{                       // догрузка при движении: тикает по часам, не по кадрам
    const T=controls.target;
    if(Math.hypot(T.x-terCX,T.z-terCZ)>12){terCX=T.x;terCZ=T.z;terRescan(T.x,T.z);}
    if(Math.hypot(T.x-splCX,T.z-splCZ)>70){splCX=T.x;splCZ=T.z;splSetWindow(T.x,T.z);}
    if(Math.hypot(T.x-decTX,T.z-decTZ)>9)decRescan(T.x,T.z);
    if(++tkN%3===0){ terTick(12); decTick(10); }  // чанк/тайл ~40-80 мс — не душим каждый кадр
    splTick(); updRivU(T.x,T.z);
  },16);
})();
(function loop(){requestAnimationFrame(loop);
  if(!_built)return;
  controls.update();
  const T=controls.target;
  const d=camera.position.distanceTo(T);
  const t=Math.min(1,Math.max(0,(d-16)/(56-16)));   // ложится раньше и ниже (просьба 02.10)
  const el=(28+(64-28)*t)*Math.PI/180;
  scene.fog.near=0.55*d+36; scene.fog.far=Math.min(265,2.1*d+85);  // туман отъезжает с зумом
  T.y=Math.max(-0.4,heightAt(T.x,T.z));             // цель на рельефе: зум в гору не ныряет
  camera.position.set(T.x,T.y+Math.sin(el)*d,T.z+Math.cos(el)*d);
  const hc=heightAt(camera.position.x,camera.position.z)+1.1;
  if(camera.position.y<hc)camera.position.y=hc;      // камера никогда не под землёй
  camera.lookAt(T);
  if(terU)terU.uCamD.value=d;                        // ширина речной нитки растёт с отлётом
  waterMesh.position.set(T.x,-0.62,T.z);
  sun.position.set(T.x+28,40,T.z+30); sun.target.position.set(T.x,0,T.z);
  renderer.render(scene,camera);
  if(!window.__riT||performance.now()-window.__riT>1000){ window.__riT=performance.now();
    window.__ri={calls:renderer.info.render.calls,tris:renderer.info.render.triangles}; }})();
